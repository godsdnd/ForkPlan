<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ForkPlan</title><style>
:root{--g:#167642;--bg:#f7f4ec;--ink:#17221c;--muted:#6d756f;--card:#fff;--line:#dfe4df;--red:#b43131}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#fffdf8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:21px}.logo{width:46px;height:46px;border-radius:15px;background:var(--g);display:grid;place-items:center;font-size:25px}.tabs{display:flex;gap:5px}.tab{border:0;background:transparent;font-size:24px;padding:10px 13px;border-radius:14px}.tab.on{background:#edf5ef}.page{display:none;max-width:1250px;margin:auto;padding:22px}.page.on{display:block}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:14px}.heroTitle{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900}.heroMark{width:48px;height:48px;border-radius:15px;background:var(--g);color:white;display:grid;place-items:center;font-size:25px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 15px;border:1px solid var(--line);border-radius:14px;background:white;box-shadow:0 3px 10px #22332208}.stat b{color:var(--g)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.search{flex:1;min-width:250px;padding:15px;border:1px solid var(--line);border-radius:16px;background:white}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 15px;font-weight:700}.chip.on{background:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}.card{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 18px #2233220b}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.body{padding:16px}.body h3{margin:0 0 8px;font-size:20px}.fpid{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--g);margin-bottom:7px}.meta{color:var(--muted);display:flex;gap:12px;font-size:14px;margin-bottom:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font-weight:800}.btn.primary{background:var(--g);color:white;border-color:var(--g)}.btn.full{grid-column:1/-1}.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.weekbar h2{margin-right:auto}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.day{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;min-height:180px}.day h3{margin:0 0 10px}.mealrow{display:flex;gap:8px;align-items:center;background:#f2f7f3;padding:9px;border-radius:12px;margin:7px 0}.mealrow img{width:58px;height:42px;object-fit:cover;border-radius:8px}.mealrow span{flex:1;font-weight:700}.x{border:0;background:transparent;font-size:20px}.note{width:100%;min-height:55px;border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:8px}.aisle{background:white;border-radius:18px;border:1px solid var(--line);padding:18px;margin:13px 0}.aisle h3{margin:0 0 10px}.gitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid #edf0ed}.gitem:first-of-type{border-top:0}.gitem input{width:24px;height:24px}.gitem .name{flex:1}.qty{font-weight:800;color:var(--g)}.modal{position:fixed;inset:0;background:#122018aa;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.panel{background:white;border-radius:24px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px}.panelhead{display:flex;justify-content:space-between;gap:12px}.panel img{width:100%;border-radius:18px}
.recipeDetailHead{padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.recipeDetailId{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--g);margin-bottom:7px}
.recipeDetailMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.recipeDetailMeta span{background:#f1f7f3;border:1px solid #e2ece5;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800;color:#415148}
.recipeSectionTitle{margin:20px 0 10px;font-size:20px}
.recipeDetailActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.recipeDetailActions .full{grid-column:1/-1}.ings{columns:2}.step{padding:12px 0;border-top:1px solid var(--line);line-height:1.5}.plannerSelect{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.movebtn{border:0;background:#e5efe8;color:var(--g);border-radius:9px;padding:7px 9px;font-weight:900;cursor:pointer}.mealrow .x{flex:0 0 auto}
.calendarHead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:2px 0 18px;padding:18px 20px;background:linear-gradient(135deg,#ffffff 0%,#eef6f0 100%);border:1px solid var(--line);border-radius:20px}.calendarHead h2{font-size:28px;margin:3px 0 2px}.calendarHead p{margin:0;color:var(--muted)}.calendarEyebrow{font-size:12px;letter-spacing:.14em;font-weight:900;color:var(--g)}.calendarNav{display:flex;gap:8px;flex-wrap:wrap}.currentBtn{background:var(--g);color:white;border-color:var(--g)}.days{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.day{position:relative;overflow:hidden;min-height:205px;padding:0;border-radius:20px;box-shadow:0 5px 16px #2233220b}.day:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:#d9e9dd}.day.hasMeals:before{background:var(--g)}.day.todayDay{border-color:#8fc5a4;box-shadow:0 0 0 2px #dceee3,0 7px 20px #22332212}.day.weekendDay{background:#fffdf8}.dayHead{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 17px 12px;border-bottom:1px solid #edf0ed}.weekday{font-size:17px;font-weight:900}.dateLine{font-size:14px;color:var(--muted);margin-top:2px}.todayPill{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--g);color:white;font-size:11px;font-weight:900}.mealCount{font-size:12px;font-weight:900;color:var(--g);background:#edf5ef;border-radius:999px;padding:6px 9px}.dayMeals{padding:10px 14px 2px}.mealrow{background:#f1f7f3;border:1px solid #e3eee6;padding:8px 9px;border-radius:13px;transition:.15s}.mealrow:hover{transform:translateY(-1px);box-shadow:0 4px 10px #2233220d}.mealrow img{width:62px;height:45px}.mealrow span{cursor:pointer;line-height:1.25}.emptyHint{min-height:58px;display:flex;align-items:center;justify-content:center;gap:7px;color:#98a19b;font-weight:700;border:1px dashed #d9e0da;border-radius:13px;background:#fbfcfa}.emptyHint span{font-size:20px;color:#8db39a}.note{margin:10px 14px 14px;width:calc(100% - 28px);min-height:48px;resize:vertical;background:#fcfdfc}.movebtn{background:#dfeee4}.x{color:#7b8580;cursor:pointer}.x:hover{color:var(--red)}
@media(max-width:700px){.page{padding:14px}.calendarHead{align-items:flex-start;flex-direction:column;padding:16px}.calendarNav{width:100%}.calendarNav .btn{flex:1;padding:10px 6px}.hero{align-items:flex-start}.heroTitle{font-size:26px}.stats{width:100%}.stat{flex:1;text-align:center;min-width:100px}.days{grid-template-columns:1fr}.ings{columns:1}.tab{font-size:22px;padding:9px}.grid{grid-template-columns:1fr}.hero{padding:23px}}
</style></head><body><header class="top"><div class="brand"><div class="logo">🍴</div><span>ForkPlan</span></div><nav class="tabs"><button class="tab on" data-page="recipes">🍽️</button><button class="tab" data-page="calendar">📅</button><button class="tab" data-page="grocery">🛒</button></nav></header>
<main><section id="recipes" class="page on"><div class="hero"><div class="heroTitle"><div class="heroMark">🍴</div><span>ForkPlan</span></div><div class="stats"><div class="stat"><b id="recipeCount"></b> recipes</div><div class="stat"><b id="favCount">0</b> favorites</div></div></div><div class="controls"><input id="search" class="search" placeholder="🔎 Search meals or ingredients..."></div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></section>
<section id="calendar" class="page"><div class="calendarHead"><div><div class="calendarEyebrow">MEAL CALENDAR</div><h2 id="weekTitle">Two-week plan</h2><p>Move meals between days to balance your week.</p></div><div class="calendarNav"><button class="btn" id="prev">← Previous</button><button class="btn currentBtn" id="today">Current</button><button class="btn" id="next">Next →</button></div></div><div id="days" class="days"></div></section>
<section id="grocery" class="page"><div class="weekbar"><h2>Grocery list</h2><button class="btn" id="uncheck">Uncheck all</button><button class="btn" id="complete">Complete trip</button></div><p>Combined from meals in the two-week period currently shown on the calendar.</p><div id="groceryList"></div></section></main>

<script>const RECIPES=[{"id":"3eaa56e4cb48","title":"Honey Dijon Crispy Chicken Sandwiches","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Pantry"},{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Cut the potatoes into wedges and slice the onion into thick rings. Toss the potatoes with oil, salt, and pepper, then roast for 20–25 minutes.","Place the flour, beaten egg, and breadcrumbs in three separate shallow dishes. Season the breadcrumbs with the fry seasoning.","Pound the chicken to an even ⅓-inch thickness. Season both sides, then coat each piece in flour, egg, and breadcrumbs.","Heat a thin layer of oil in a skillet over medium-high heat. Cook the chicken for 3–4 minutes per side, until crisp and the center reaches 165°F.","Cook the onion rings in a lightly oiled skillet for 2–3 minutes per side, until browned and tender.","Butter and toast the buns. Layer each bun with crispy chicken, onion, and honey Dijon sauce. Serve with the roasted potato wedges."],"image":"images/recipe_0001.webp","source_file":"Honey Dijon Crispy Chicken Sandwhiches with Griddled Onion and Crispy Potato Wedges.pdf","fpid":"FP-0001","version":"1.1"},{"id":"5d462cda15d6","title":"BBQ Pineapple Pepper Jack Flatbreads","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flatbreads","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"BBQ Sauce","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pineapple","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Slice the tomato, bell pepper, and red onion. Toss the vegetables with oil, salt, and pepper.","Spread the vegetables on a baking sheet and roast for 15–18 minutes, until tender and lightly browned.","If using bacon, cook it in a dry skillet until crisp, then drain and crumble it.","Mix the softened butter with the minced garlic and brush it over the flatbreads.","Stir the BBQ sauce together with a spoonful of pineapple juice.","Top the flatbreads with roasted vegetables, pepper jack, pineapple, and bacon if using. Bake for 5–7 minutes, then drizzle with the pineapple BBQ sauce."],"image":"images/recipe_0002.webp","source_file":"BBQ Pineapple and Pepper Jack Flatbreads with Roasted Tomato Onion and Green Pepper.pdf","fpid":"FP-0002","version":"1.1"},{"id":"205710999fcb","title":"BBQ Chicken with Cheddar Mashed Potatoes","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Brown Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Milk","amount":0.25,"unit":"cup","quantity_text":"¼ cup","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"BBQ Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Cheddar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Dice the potatoes, peel the garlic, and slice the zucchini into half-moons.","Place the potatoes and garlic in salted water. Boil for about 10 minutes, until the potatoes are fork-tender, then drain.","Mash the potatoes with cheddar, milk, and butter. Season with salt and pepper.","Season the chicken with oil, salt, and pepper. Arrange it on a sheet pan with the zucchini.","Roast for 18–22 minutes, until the zucchini is tender and the chicken reaches 165°F.","Brush the chicken with BBQ sauce during the final few minutes of cooking. Serve with the cheddar mashed potatoes and zucchini."],"image":"images/recipe_0003.webp","source_file":"BBQ Chicken with Cheddar Mashed Potatoes plus Roasted Zucchini.pdf","fpid":"FP-0003","version":"1.1"},{"id":"9a0acffe232b","title":"Mushroom and Thyme Risotto","category":"Veggie","prep_minutes":null,"ready_minutes":50,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["Warm the stock in a small saucepan and keep it at a gentle simmer. Slice the mushrooms and finely chop the onion, garlic, and thyme.","Heat olive oil in a wide pan over medium-high heat. Cook the mushrooms for 5–7 minutes, until browned, then transfer them to a plate.","Add butter, onion, garlic, and thyme to the same pan. Cook for 4–5 minutes, until softened.","Stir in the rice and cook for 1 minute. Add the warm stock about ½ cup at a time, stirring often and allowing each addition to absorb.","Continue adding stock until the rice is creamy and tender, about 25–30 minutes.","Fold in the mushrooms, a little butter, and half the Parmesan. Season to taste and finish with the remaining Parmesan."],"image":"images/recipe_0004.webp","source_file":"Mushroom and Thyme Risotto with Parmesan.pdf","fpid":"FP-0004","version":"1.1"},{"id":"3bcb8dd324cc","title":"Crispy Chicken with Cherry BBQ Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"BBQ Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Cherry Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Flour","amount":0.5,"unit":"cup","quantity_text":"½ Cup","aisle":"Pantry"},{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Dice the potatoes and slice the carrots. Toss the carrots with oil, salt, and pepper and roast for 20–25 minutes.","Boil the potatoes in salted water for 10–12 minutes, until tender. Reserve a little cooking water, then drain.","Combine the BBQ sauce, cherry jam, and mustard in a small bowl.","Pound the chicken to an even ½-inch thickness. Season it, then coat each piece in flour, beaten egg, and flour once more.","Heat a thin layer of oil in a skillet. Fry the chicken for 3–5 minutes per side, until golden and the center reaches 165°F.","Mash the potatoes with butter and enough reserved water to make them creamy. Serve with the chicken, roasted carrots, and cherry BBQ sauce."],"image":"images/recipe_0005.webp","source_file":"Crispy Chicken with Cherry BBQ Sauce plus Mashed Potatoes and Roasted Carrots.pdf","fpid":"FP-0005","version":"1.1"},{"id":"4978a2ba719c","title":"Blistered Tomato and Feta Penne","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Penne Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Kale","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Tomatoes","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Bring a large pot of salted water to a boil. Mince the garlic and remove the thick stems from the kale.","Cook the penne until al dente. Reserve ½ cup of pasta water, then drain.","Heat olive oil in a large skillet over medium-high heat. Add the tomatoes and cook until they begin to blister.","Add the garlic, kale, seasoning, salt, and pepper. Cook until the kale is tender.","Stir in the stock concentrate and a splash of pasta water. Simmer for 2–3 minutes.","Add the pasta, cream cheese, butter, and half the feta. Toss until creamy, adding more pasta water as needed. Top with the remaining feta."],"image":"images/recipe_0006.webp","source_file":"Blistered Tomato and Feta Penne with Garlicky Kale.pdf","fpid":"FP-0006","version":"1.1"},{"id":"3add8f96f4b7","title":"Cuban Black Bean Rice Bowls","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Hot Sauce","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Turmeric","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"}],"instructions":["Melt butter in a small pot. Cook half the garlic for 30 seconds, then add the rice, water, stock concentrate, and turmeric. Cover and simmer until tender.","Slice the onion and bell pepper. Dice the tomato, chop the cilantro, and zest and quarter the lime.","Combine diced tomato, a little chopped onion, cilantro, lime juice, salt, and pepper to make the salsa.","Mix the sour cream with lime juice and enough water to make a drizzleable crema.","Cook the sliced onion and bell pepper in oil for 6–8 minutes, until browned and tender.","Add the remaining garlic, black beans, stock concentrate, and a splash of water. Simmer until thickened.","Fluff the rice and divide it between bowls. Add beans, vegetables, salsa, lime crema, and cilantro."],"image":"images/recipe_0007.webp","source_file":"Cuban Style Black Bean and Yellow Rice Bowls with Salsa Fresca Lime Crema and Green Pepper.pdf","fpid":"FP-0007","version":"1.1"},{"id":"c3cda20dec35","title":"Charred Zucchini and Tomato Melts","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Bread","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Bakery"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle" .0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Curry Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Coconut Milk","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Mince the garlic. Dice the sweet potato and bell pepper, then separate the scallion whites from the greens.","Heat oil in a small pot. Cook half the garlic for 30 seconds, then add the rice, water, and salt. Cover and simmer until tender.","In a large skillet, cook the sweet potato, bell pepper, and scallion whites for 6–8 minutes.","Add the curry powder, paprika, and remaining garlic. Stir for 30 seconds.","Add the tomato, tomato paste, coconut milk, water, sugar, and a pinch of salt. Cover and simmer for 10–12 minutes, until the sweet potato is soft.","Fluff the rice and divide it between bowls. Spoon the curry over the top and finish with scallion greens and sour cream."],"image":"images/recipe_0009.webp","source_file":"Sweet Potato and Bell Pepper Curry over Garlic Basmati Rice.pdf","fpid":"FP-0009","version":"1.1"},{"id":"b67f8440f651","title":"Kung Pao Beef Bowls","category":"Beef","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Cook the jasmine rice with water and a pinch of salt. Cover and simmer for 15–20 minutes.","Dice the bell pepper, slice the scallions, and mince the garlic and ginger.","Heat oil in a skillet over medium-high heat. Cook the bell pepper for 4–6 minutes.","Add the scallion whites, garlic, and ginger. Cook for 30 seconds.","Add the beef and cook for 4–5 minutes, breaking it into small pieces. Drain excess grease if needed.","Stir in the sweet soy glaze and butter. Serve over rice and garnish with scallion greens and peanuts."],"image":"images/recipe_0010.webp","source_file":"Kung Pao Beef Bowls with Green Bell Pepper and Peanuts.pdf","fpid":"FP-0010","version":"1.1"},{"id":"1c4a2df74e59","title":"Cheddar Pub Burgers with Caramelized Onions and Dijon Sauce","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"optional","aisle":"Other"}],"instructions":["Heat the oven to 450°F. Cut the sweet potatoes into ½-inch wedges and thinly slice the onion.","Toss the sweet potatoes with oil, salt, and pepper. Roast for 20–25 minutes, until browned and tender.","Melt the butter with a little oil in a skillet over medium-high heat. Add the onion and cook for 8–10 minutes.","Stir in the sugar and a splash of water. Cook for another 2–3 minutes, until the onion is soft and jammy.","Mix the sour cream and Dijon mustard. Season with salt and pepper.","Shape the beef into two patties. Cook for 3–5 minutes per side, then top with cheddar and cover until melted.","Toast the buns and assemble with Dijon sauce, burgers, and caramelized onions. Serve with the sweet potato wedges."],"image":"images/recipe_0011.webp","source_file":"Cheddar Pub Burgers with Carmelized Onion Creamy Dijon Sauce and Sweet Potato Wedges.pdf","fpid":"FP-0011","version":"1.1"},{"id":"0a39f0af86ea","title":"Beef Shepherd's Pie with Cheesy Mashed Potatoes","category":"Beef","prep_minutes":null,"ready_minutes":60,"servings":2,"ingredients":[{"name":"Potatoes","amount":24.0,"unit":"oz","quantity_text":"24 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Carrots","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Celery","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Rosemary","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Dried Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrates","amount":6.0,"unit":"unit","quantity_text":"6","aisle":"Other"},{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Milk","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Dice the potatoes, onion, carrots, and celery. Mince the garlic and chop the herbs.","Boil the potatoes in salted water for 12–15 minutes, until tender. Drain and return them to the pot.","Cook the onion, carrots, celery, and garlic in oil for 3–4 minutes. Add the beef, rosemary, thyme, salt, and pepper and cook until browned.","Stir in the tomato paste and flour. Add the peas, stock concentrate, and water, then simmer for 2–3 minutes until thickened.","Transfer the beef mixture to a baking dish.","Mash the potatoes with butter, cheese, sour cream, milk, and egg yolk. Season well.","Spread the potatoes over the filling and bake for about 15 minutes, until bubbling and lightly browned. Rest for 5 minutes before serving."],"image":"images/recipe_0012.webp","source_file":"Family Style Beef Shepherds Pie with Cheese Potato Topping.pdf","fpid":"FP-0012","version":"1.1"},{"id":"e1ff2fe67ca4","title":"Sweet Potato and Poblano Fajitas","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Cut the sweet potatoes into wedges and thinly slice the onion and poblano.","Toss the sweet potatoes with oil, half the seasoning, salt, and pepper. Season the onion and poblano with the remaining seasoning.","Roast everything for 20–25 minutes, stirring once, until browned and tender.","Dice the tomato and chop the cilantro. Combine them with a little minced onion, lime juice, salt, and pepper.","Mix the sour cream with lime juice and enough water to make a thin crema.","Warm the tortillas until soft and pliable.","Fill the tortillas with roasted vegetables and sweet potatoes. Top with pepper jack, pico de gallo, lime crema, and cilantro."],"image":"images/recipe_0013.webp","source_file":"Sweet Potato and Poblano Fajitas with Pepper Jack Pico de Gallo and Lime Crema.pdf","fpid":"FP-0013","version":"1.1"},{"id":"6e549a0b9dc6","title":"Caramelized Onion and Blue Cheese Flatbreads","category":"Veggie","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Sugar","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Pantry"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Dressing","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Flatbreads","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Arugula","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Heat the oven to 425°F. Place the flatbreads on a baking sheet, brush with olive oil, and season with salt and pepper.","Toast the flatbreads for 5–7 minutes, until lightly crisp.","Thinly slice the onion. Cook it in olive oil over medium-high heat for 5–6 minutes.","Add the balsamic vinegar, sugar, and a splash of water. Cook for 3–4 minutes, until the onion becomes caramelized.","Combine the Monterey Jack, blue cheese dressing, and mayonnaise.","Spread the cheese mixture over the toasted flatbreads and top with the caramelized onion. Bake for 3–4 minutes, until bubbly.","Toss the arugula with olive oil, salt, and pepper. Add it to the flatbreads just before slicing and serving."],"image":"images/recipe_0014.webp","source_file":"Caramelized Onion and Blue Cheese Flatbreads with Balsamic Vinegar and Arugula.pdf","fpid":"FP-0014","version":"1.1"},{"id":"b463e755f31c","title":"Sriracha Apricot Pork Chops with Garlic Rice","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Apricot Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Mince the garlic, cut the carrots on a diagonal, and zest and quarter the lime.","Melt butter in a small pot. Cook half the garlic for 30 seconds, then add the rice, water, and salt. Cover and simmer for 15–20 minutes.","Toss the carrots with oil, salt, and pepper. Roast for 15–20 minutes.","Season the pork chops. Cook them in oil over medium heat for 4–5 minutes per side, then transfer to a plate to rest.","In the same skillet, cook the remaining garlic briefly. Stir in apricot jam, Sriracha, soy sauce, lime juice, and a splash of water.","Simmer the sauce until glossy, then return the pork to the pan and turn to coat.","Fluff the rice and serve with the pork chops, carrots, and apricot-Sriracha sauce."],"image":"images/recipe_0015.webp","source_file":"Sriracha Apricot Pork Chops with Carrots and Garlic Rice.pdf","fpid":"FP-0015","version":"1.1"},{"id":"974eb5696de4","title":"Steak Frites with Broccoli and Roasted Garlic Butter","category":"Steak","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Mayonnaise","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Cut the potatoes into fries and the broccoli into bite-size florets.","Toss the potatoes with oil, salt, and pepper. Roast for 15 minutes.","Add the broccoli to the baking sheet with a little more oil and seasoning. Roast for another 12–15 minutes.","Season the steak generously with salt and pepper.","Heat oil in a heavy skillet over medium-high heat. Cook the steak to your preferred doneness, then transfer it to a cutting board.","Mix softened butter with roasted or minced garlic and any included herbs.","Rest the steak for at least 5 minutes, then slice it across the grain. Serve with the fries, broccoli, and garlic butter."],"image":"images/recipe_0016.webp","source_file":"Steak Frites with Broccoli and Roasted Garlic Butter.pdf","fpid":"FP-0016","version":"1.1"},{"id":"8237f28d035a","title":"Cowboy Skillet Pie with Poblano and Jalapeño","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Poblano","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"}],"instructions":["Heat the broiler. Dice the potatoes, onion, poblano, and jalapeño, and mince the garlic.","Boil the potatoes in salted water until tender, then drain.","Cook the poblano and onion in an oven-safe skillet until softened and lightly browned.","Add the garlic, Southwest seasoning, jalapeño, and beef. Cook until the beef is browned.","Stir in the flour, stock concentrate, ketchup, and water. Simmer for 1–2 minutes, until the filling thickens.","Mash the potatoes with sour cream and butter. Season with salt and pepper.","Spread the potatoes over the beef mixture and broil for 3–4 minutes, until bubbling and lightly browned."],"image":"images/recipe_0017.webp","source_file":"Cowboy Skillet Pie with Poblano and Jalapeno.pdf","fpid":"FP-0017","version":"1.1"},{"id":"e6cbf00d1950","title":"Chicken and Pepper Stir-Fry over Ginger Rice","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cornstarch","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Strips","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Rinse the rice. Cook half the ginger in a little oil, then add the rice, water, and salt. Cover and simmer for 15 minutes.","Dice the bell pepper and mince the garlic. Whisk together ponzu, soy sauce, chili sauce, sugar, cornstarch, and water.","Season the chicken and toss it with the remaining cornstarch.","Cook the chicken in a hot skillet for 4–6 minutes, until browned and cooked through. Transfer it to a plate.","Cook the bell pepper for 3–5 minutes. Add the garlic and remaining ginger and cook for 1 minute.","Return the chicken to the pan and add the sauce. Stir until the sauce thickens, then finish with butter.","Fluff the ginger rice and divide it between bowls. Spoon the chicken and pepper stir-fry over the top."],"image":"images/recipe_0018.webp","source_file":"Saucy Chicken and Pepper Stir Fry over Ginger Rice.pdf","fpid":"FP-0018","version":"1.1"},{"id":"a35f316d3137","title":"Moroccan Chickpea and Apricot Tagine","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chickpeas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{ ":"Eggs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Dijon Mustard","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Heat the oven to 425°F. Cut the potatoes into wedges and thinly slice the onion.","Toss the potatoes with oil, salt, and pepper. Roast for 20–25 minutes.","Cook the onion in oil for 8–10 minutes. Add sugar and a splash of water and cook until caramelized.","Pound the pork chops to about ⅓ inch thick. Season them with salt and pepper.","Set out flour, beaten egg, and breadcrumbs in separate shallow dishes. Coat each pork cutlet in that order.","Fry the pork in a thin layer of hot oil for 3–4 minutes per side, until golden and the center reaches 145°F.","Mix the mayonnaise and Dijon mustard. Toast the buns, then assemble with mustard sauce, crispy pork, and caramelized onion. Serve with potato wedges."],"image":"images/recipe_0020.webp","source_file":"Biergarten Pork Sandwhiches with Caramelized Onion and Creamy Mustard Sauce.pdf","fpid":"FP-0020","version":"1.1"},{"id":"283eaa7d6051","title":"Pork and Poblano Tacos with Pico de Gallo","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Poblano","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Dice the tomato, onion, and poblano. Mince the garlic, chop the cilantro, and cut the lime into wedges.","Combine the tomato, a little onion, cilantro, lime juice, salt, and pepper to make the pico de gallo.","Mix the sour cream with garlic, lime juice, and enough water to make a smooth sauce.","Cook the poblano and remaining onion in oil until softened and lightly browned.","Add the pork and seasoning. Cook while breaking it into small pieces until browned and fully cooked.","Warm the tortillas until soft.","Fill each tortilla with pork and poblano mixture. Top with pico de gallo, garlicky sour cream, and cilantro."],"image":"images/recipe_0021.webp","source_file":"Pork and Poblano Tacos with Pico de Gallo and Garlicky Sour Cream.pdf","fpid":"FP-0021","version":"1.1"},{"id":"cb9f273e28e7","title":"Guacamole Burgers with Chipotle Ketchup","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Guacamole","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ketchup","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Other"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Cut the potatoes into wedges and slice the onion.","Toss the potatoes with oil, salt, and pepper. Roast for 20–25 minutes.","Cook the onion in a skillet over medium-high heat until deeply browned and tender.","Mix ketchup with chipotle seasoning or sauce to taste.","Mash the avocado with lime juice, salt, and pepper to make a chunky guacamole.","Shape the beef into patties and cook for 3–5 minutes per side, until done to your liking.","Toast the buns and assemble with chipotle ketchup, burgers, griddled onion, and guacamole. Serve with potato wedges."],"image":"images/recipe_0022.webp","source_file":"Guacamole Burgers with Griddled Onions Chipotle Ketchup and Potato Wedges.pdf","fpid":"FP-0022","version":"1.1"},{"id":"816c0a4e9154","title":"Diner-Style Chicken and Gravy","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Flour","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Cut the potatoes into chunks and mince the garlic. Bring the potatoes to a boil in salted water and cook until tender.","Season the chicken with salt and pepper. Cook in a skillet with oil until browned and the center reaches 165°F, then transfer to a plate.","Add butter and flour to the skillet. Whisk for about 1 minute.","Slowly whisk in the stock and simmer until the gravy thickens. Return the chicken to the pan and coat it with gravy.","Mash the potatoes with garlic, butter, and milk or reserved cooking water. Season to taste.","Cook the peas with butter, lemon zest, and a squeeze of lemon juice.","Serve the chicken and gravy with garlic mashed potatoes and lemon-butter peas."],"image":"images/recipe_0023.webp","source_file":"Diner Style Chicken and Gravy with Garlic Mashed Potatoes and Lemon Butter Peas.pdf","fpid":"FP-0023","version":"1.1"},{"id":"e9579dc0d0f2","title":"Creamy Lemon Herb Chicken","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Parsley","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Cut the potatoes and carrots into bite-size pieces.","Toss the vegetables with oil, salt, and pepper. Roast for 20–25 minutes, until tender.","Season the chicken with salt, pepper, and the herb blend.","Cook the chicken in a skillet over medium-high heat until browned and the center reaches 165°F. Transfer to a plate.","Lower the heat and add garlic, stock concentrate, lemon juice, and a splash of water.","Stir in the cream cheese or sour cream until the sauce is smooth. Return the chicken to the skillet and coat it in the sauce.","Serve the lemon herb chicken with the roasted potatoes and carrots."],"image":"images/recipe_0024.webp","source_file":"Creamy Lemon Herb Chicken with Roasted Potatoes and Carrots.pdf","fpid":"FP-0024","version":"1.1"},{"id":"8d83421e6cfa","title":"Brussels Sprout and Shallot Flatbreads","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flatbreads","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Cream Cheese","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Honey","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Thinly slice the Brussels sprouts and shallot and mince the garlic.","Cook the Brussels sprouts and shallot in olive oil for 5–7 minutes, until softened and lightly browned.","Stir together the honey and garlic.","Place the flatbreads on a baking sheet and brush them lightly with oil.","Top with cheese and the Brussels sprout mixture.","Bake for 6–8 minutes, until the crust is crisp and the cheese is melted.","Drizzle with the garlic honey, slice, and serve."],"image":"images/recipe_0025.webp","source_file":"Brussels Sprout and Shallot Flatbreads with Garlic Honey.pdf","fpid":"FP-0025","version":"1.1"},{"id":"4740b0b3725d","title":"Mushroom Biscuit Pot Pie","category":"Veggie","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Black Pepper","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Produce"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Biscuits","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Heat the oven according to the biscuit package directions. Slice the mushrooms and chop the onion and thyme.","Melt butter in an oven-safe skillet. Cook the mushrooms and onion for 6–8 minutes, until browned and tender.","Add the thyme and flour. Stir for 1 minute.","Slowly add the stock and milk, stirring until the gravy is smooth and thick.","Stir in the peas and season with salt and pepper.","Arrange the biscuits over the mushroom filling.","Bake until the biscuits are golden and cooked through and the filling is bubbling."],"image":"images/recipe_0026.webp","source_file":"Mushroom Biscuit Pot Pie with Peas and Thyme Gravy.pdf","fpid":"FP-0026","version":"1.1"},{"id":"5e9455f1e48d","title":"Zucchini Parmesan Sandwiches","category":"Veggie","p Pantry"},{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Mayonnaise","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Pantry"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 450°F. Dice the sweet potatoes, cut the broccoli into florets, slice the scallions, and dice the cucumber.","Cook the scallion whites in butter for 1 minute. Add the rice, water, and salt, then cover and simmer until tender.","Toss the sweet potatoes with oil, fry seasoning, salt, and pepper. Roast for 12 minutes.","Add the broccoli with a little oil, salt, and pepper. Continue roasting for 12–15 minutes.","Combine the cucumber with lime juice, sugar, and salt. Let it pickle while the vegetables roast.","Mix the mayonnaise, Sriracha, and lime juice. Fry the eggs to your preferred doneness.","Stir lime zest into the rice. Build bowls with rice, roasted vegetables, pickled cucumber, fried egg, Sriracha mayo, and scallion greens."],"image":"images/recipe_0029.webp","source_file":"Sweet Potato and Broccoli Donburi with Fried Egg over Scallion Lime Rice with Pickled Cucumber and Sriracha Mayo.pdf","fpid":"FP-0029","version":"1.1"},{"id":"1db78137634d","title":"BBQ Meatloaf Sandwiches with Caramelized Onion","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"BBQ Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Other"},{"name":"Brown Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Bread","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Bakery"},{"name":"White Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Mince the garlic, cut the potatoes into wedges, and thinly slice the onion.","Combine the beef, stock concentrate, soy sauce, garlic, breadcrumbs, BBQ seasoning, salt, and pepper. Shape into two small loaves.","Mix the BBQ sauce, ketchup, brown sugar, and black pepper. Reserve half for serving.","Cook the onion in oil for 8–10 minutes. Add sugar and a splash of water and cook until caramelized, then stir in butter.","Place the potatoes and meatloaves on a baking sheet. Season the potatoes and brush the meatloaves with BBQ sauce.","Roast for 18–20 minutes, until the meatloaves reach 160°F. Continue roasting the potatoes if they need more time.","Toast the bread in butter. Slice the meatloaves and assemble sandwiches with mayonnaise, caramelized onion, and reserved BBQ sauce. Serve with potato wedges."],"image":"images/recipe_0030.webp","source_file":"BBQ Meatloaf Sandwhiches with Caramelized Onion and Garlic Potato Wedges.pdf","fpid":"FP-0030","version":"1.1"},{"id":"753db2df80a8","title":"Crispy Chicken with Honey Dijon and Sweet-Heat Brussels Sprouts","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Flour","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Pantry"},{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"}],"instructions":["Heat the oven to 425°F. Trim and halve the Brussels sprouts, then toss them with oil, salt, pepper, and a small pinch of chili flakes.","Roast the Brussels sprouts for 18–22 minutes, turning once, until browned at the edges and tender.","Pound the chicken to an even thickness. Season with salt and pepper, then coat each piece in flour, beaten egg, and breadcrumbs.","Heat a thin layer of oil in a skillet over medium-high heat. Cook the chicken for 3–5 minutes per side, until crisp and the center reaches 165°F.","Melt the butter with the minced garlic. Stir in the honey-Dijon ingredients and warm until smooth.","Serve the crispy chicken with the roasted Brussels sprouts and spoon the honey-Dijon sauce over the top."],"image":"images/recipe_0031.webp","source_file":"Crispy Chicken with Honey Dijon Drizzle plus Sweet Heat Brussels Sprouts.pdf","fpid":"FP-0031","version":"1.2"},{"id":"599618fa1740","title":"Fig-Glazed Pork Chops with Broccoli and Crispy Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Fig Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"}],"instructions":["Heat the oven to 425°F. Dice the potatoes and cut the broccoli into bite-size florets.","Toss the potatoes with oil, salt, and pepper. Roast for 12 minutes, then add the broccoli with a little more oil and seasoning.","Continue roasting for 12–15 minutes, until the vegetables are browned and tender.","Pat the pork chops dry and season both sides. Cook in an oiled skillet over medium-high heat for 4–6 minutes per side, until the center reaches 145°F.","Transfer the pork to a plate. Add garlic, stock concentrate, fig jam, butter, and a splash of water to the skillet.","Simmer until glossy, then return the pork to the pan and turn to coat. Serve with the potatoes and broccoli."],"image":"images/recipe_0032.webp","source_file":"Jammin Fig Pork Chops with Broccoli and Crispy Potatoes.pdf","fpid":"FP-0032","version":"1.2"},{"id":"c7bf0be8d92a","title":"Beef Flautas with Fajita Vegetables and Lime","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Thinly slice the bell pepper and red onion, mince the garlic, and dice the tomato.","Cook the pepper and most of the onion in oil over medium-high heat until tender and lightly charred.","Add the beef and garlic. Season well and cook, breaking the meat into small pieces, until browned and fully cooked.","Place the beef mixture down the center of each tortilla. Roll tightly and arrange seam-side down on an oiled sheet pan.","Brush the flautas lightly with oil and bake for 10–14 minutes, until crisp and golden.","Mix the sour cream with lime juice and a little water. Serve the flautas with diced tomato, remaining onion, and lime crema."],"image":"images/recipe_0033.webp","source_file":"Beef Flautas with Fajita Style Veggies and Lime.pdf","fpid":"FP-0033","version":"1.2"},{"id":"96efbb557adb","title":"Pork Fried Rice with Carrots, Peas, and Egg","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Ground Pork","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Basmati Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Soy Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Cook the rice with water and a pinch of salt, then spread it on a plate to cool slightly.","Dice the onion, mince the garlic and ginger, and beat the eggs in a small bowl.","Heat oil in a large skillet or wok. Scramble the eggs until just set, then transfer them to a plate.","Add the pork and onion to the skillet. Cook until the pork is browned, breaking it into small pieces.","Stir in the garlic, ginger, carrots, and peas. Cook for 2–3 minutes, until the vegetables are tender.","Add the rice, soy sauce, ponzu, and a small pinch of sugar. Stir-fry until hot, then fold in the eggs and serve."],"image":"images/recipe_0034.webp","source_file":"Pork Fried Rice with Carrots Peas and Scrambled Eggs.pdf","fpid":"FP-0034","version":"1.2"},{"id":"5516c985d534","title":"Tuscan Roasted Vegetable Penne","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Penne Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cream Cheese","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Heat the oven to 425°F. Chop the zucchini, bell pepper, tomato, and scallions into bite-size pieces.","Toss the vegetables with olive oil, Tuscan seasoning, salt, and pepper. Roast for 18–22 minutes.","Bring a pot of salted water to a boil and cook the penne until al dente. Reserve ½ cup pasta water, then drain.","Melt butter in a wide skillet and cook the garlic for 30 seconds.","Stir in the cream cheese, Parmesan, lemon juice, and a splash of pasta water until smooth.","Add the penne and roasted vegetables. Toss until coated, loosening with more pasta water as needed."],"image":"images/recipe_0035.webp","source_file":"Roasted Zucchini Bell Pepper and Tomato Penne in Tuscan-Spiced Cream Sauce.pdf","fpid":"FP-0035","version":"1.2"},{"id":"4dab59660046","title":"Spanish Chorizo Rice with Roasted Pepper and Garlic Aioli","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Dried Chorizo","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Arborio Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Mayonnaise","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["Heat the oven to 425°F. Slice the bell pepper and onion, and mince the garlic.","Toss the bell pepper with oil, salt, and pepper. Roast for 15–18 minutes, until softened and lightly browned.","Cook the chorizo and onion in a wide skillet over medium-high heat until the onion is tender and the chorizo releases its oils.","Stir in the rice, paprika, and half the garlic. Cook for 1 minute, then add water and a pinch of salt.","Cover and simmer until the rice is tender and the liquid is absorbed.","Mix the mayonnaise with the remaining garlic and a little water. Serve the rice with roasted pepper and garlic aioli."],"image":"images/recipe_0036.webp","source_file":"Spanish Chorizo and Rice with Roasted Bell Pepper and Garlic Aioli.pdf","fpid":"FP-0036","version":"1.2"},{"id":"278d96ec8e8c","title":"Lemony Asparagus and Tomato Linguine","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"}],"instructions":["Bring a large pot of salted water to a boil. Trim the asparagus, halve the tomatoes, and mince the garlic.","Cook the linguine until al dente. Reserve ½ cup pasta water, then drain.","Heat olive oil in a skillet over medium-high heat. Cook the asparagus for 3–4 minutes, then add the tomatoes.","Add the garlic and Tuscan seasoning. Cook until fragrant and the tomatoes begin to soften.","Lower the heat and stir in butter, cream sauce ingredients, lemon juice, and a splash of pasta water.","Add the linguine and Parmesan. Toss until glossy and creamy, then season to taste."],"image":"images/recipe_0037.webp","source_file":"Lemony Asparagus and Tomato Linguine with Tuscan Herb Cream Sauce and Parmesan.pdf","fpid":"FP-0037","version":"1.2"},{"id":"6c842884cf69","title":"Sweet-and-Spicy Bacon Gouda Burgers","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Bacon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Brown Sugar","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Hot Sauce","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Sliced Gouda","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Onions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Cut the sweet potatoes into wedges and toss with oil, garlic powder, salt, and pepper.","Roast the wedges for 20–25 minutes, turning once, until browned and tender.","Cook the bacon in a skillet until crisp. Drain it on paper towels and reserve a small amount of the drippings.","Cook the onions in the skillet until golden and crisp at the edges. Stir together brown sugar and hot sauce.","Shape the beef into patties and cook for 3–5 minutes per side. Top with Gouda and cover until melted.","Toast the buns and assemble with burgers, bacon, onions, and sweet-spicy sauce. Serve with the wedges."],"image":"images/recipe_0038.webp","source_file":"Sweet and Spicy Bacon Gouda Burgers with Crispy Fried Onions and Sweet Potato Wedges.pdf","fpid":"FP-0038","version":"1.2"},{"id":"4b03dda1dbd8","title":"BBQ Beef Meatloaves with Roasted Potatoes and Broccoli","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Brown Sugar","amount":1.0,"unit":"½ tsp","quantity_text":"1½ tsp","aisle":"Pantry"},{"name":"Ketchup","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Other"},{"name":"White Bread","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Milk","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Dice the potatoes, cut the broccoli into florets, and mince the garlic.","Toss the potatoes with oil, salt, and pepper. Roast for 10 minutes.","Soak the bread with milk, then mix it with the beef, garlic, scallion whites, salt, and pepper.","Shape into individual loaves and place them on the sheet pan. Add the broccoli with oil and seasoning.","Mix ketchup, brown sugar, and BBQ seasoning. Brush the loaves with half the glaze.","Roast for 15–20 minutes, glazing once more, until the meatloaves reach 160°F and the vegetables are tender."],"image":"images/recipe_0039.webp","source_file":"BBQ Beef Meatloaves with Roasted Potatoes and Broccoli.pdf","fpid":"FP-0039","version":"1.2"},{"id":"dc7c9a3c373d","title":"Black Bean and Pepper Jack Tostadas","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Dice the tomato and onion, mince the garlic, and finely chop as much jalapeño as desired.","Combine tomato, some onion, jalapeño, lime juice, salt, and pepper to make the pico de gallo.","Cook the remaining onion and garlic in butter until softened. Add the black beans, Southwest seasoning, stock concentrate, and a splash of water.","Simmer until thickened, then lightly mash some of the beans.","Brush both sides of the tortillas with oil and bake for 5–8 minutes, flipping once, until crisp.","Spread with beans, add pepper jack, and bake until melted. Finish with pico de gallo and lime crema."],"image":"images/recipe_0040.webp","source_file":"Black Bean and Pepper Jack Tostadas with Southwest Lime Crema and Spicy Pico de Gallo.pdf","fpid":"FP-0040","version":"1.2"},{"id":"613e5a64da7c","title":"Cherry Balsamic Pork Chops with Potatoes and Zucchini","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Brown Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cherry Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Dice the potatoes and slice the zucchini into thick half-moons.","Toss the potatoes with oil, salt, and pepper. Roast for 12 minutes, then add the zucchini and continue roasting until tender.","Pat the pork chops dry and season both sides. Cook in an oiled skillet for 4–6 minutes per side, until the center reaches 145°F.","Transfer the pork to a plate. Add garlic to the skillet and cook for 30 seconds.","Stir in cherry jam, balsamic vinegar, soy sauce, stock concentrate, brown sugar, ketchup, and a splash of water.","Simmer until glossy, whisk in butter, and return the pork to the pan. Serve with the roasted vegetables."],"image":"images/recipe_0041.webp","source_file":"Saucy Cherry Balsamic Pork Chops with Roasted Potatoes and Zucchini.pdf","fpid":"FP-0041","version":"1.2"},{"id":"5a1b254485a2","title":"Chick ","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Bring a large pot of salted water to a boil. Mince the garlic and grate the Parmesan if needed.","Cook the bacon in a wide skillet until crisp. Transfer it to a paper-towel-lined plate and chop when cool.","Cook the linguine until al dente. Reserve 1 cup pasta water, then drain.","Cook the garlic in a little bacon fat for 30 seconds, then add the peas.","Lower the heat and stir in cream cheese, butter, Parmesan, and a splash of pasta water.","Add the linguine and bacon. Toss until glossy and creamy, adding more pasta water as needed."],"image":"images/recipe_0057.webp","source_file":"Linguine Carbonara with Peas and Bacon.pdf","fpid":"FP-0057","version":"1.2"},{"id":"483123f8d055","title":"Sriracha-Apricot Chicken with Green Beans","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Green Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Cook the rice with water, butter, half the garlic, and a pinch of salt. Cover and keep warm.","Trim the green beans and combine the soy sauce, apricot ingredients, Sriracha, and a splash of water.","Cook the green beans in an oiled skillet until bright green and tender. Transfer to a plate.","Season the chicken and cook in the same skillet for 4–6 minutes per side, until the center reaches 165°F.","Add the remaining garlic and cook briefly. Pour in the Sriracha-apricot sauce and simmer until glossy.","Return the chicken to the skillet
