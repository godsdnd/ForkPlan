","quantity_text":"1","aisle":"Spices"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ponzu Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"}],"instructions":["Why are we always telling you to pat your chicken dry? Well, since you asked, drying protein with paper towels ensures even browning rather than steaming. Crispy, caramelized edges = major flavor!","Wash and dry produce. Peel and finely chop garlic. Heat a drizzle of oil in a small pot over medium-high heat. Add garlic; cook, stirring, until fragrant, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","core, deseed, and dice green pepper. Halve and peel onion; cut one half (whole onion for 4 servings) into ½-inch-thick wedges. Pat chicken dry with paper towels.","In a large bowl, toss chicken with remaining Fry Seasoning, a drizzle of oil, salt, and pepper. Heat a drizzle of oil in a large, preferably nonstick, pan over medium-high heat. Add green pepper and onion wedges; cook, stirring occasionally, 2 minutes. Add chicken and cook, stirring occasionally, until veggies are softened and chicken is browned and cooked through, 4-6 minutes more. Turn off heat.","In a small bowl, combine mayonnaise, 1 tsp Fry Seasoning (you'll use the rest in the next step), 1 tsp ketchup, ½ tsp sugar, and Sriracha to taste. (For 4 servings, use 2 tsp Fry Seasoning, 2 tsp ketchup, and 1 tsp sugar.) Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Swap in shrimp for chicken. Cook green pepper and onion wedges for 4-6 minutes, then add shrimp. Cook stirring occasionally, until opaque and cooked through, 2-3 minutes more. Turn off heat.","Fluff rice with a fork; season with salt and pepper. Divide rice between shallow bowls or plates. Top with chicken stir-fry and any remaining ponzu glaze from pan. Drizzle with special spicy sauce.","Stir ponzu and 2 TBSP butter (3 TBSP for 4 servings) into pan with chicken mixture until everything is thoroughly coated. If mixture seems too thick, stir in a splash of water.","Chicken is fully cooked when internal temperature reaches 165 degrees. Shrimp are fully cooked when internal temperature reaches 145 degrees."],"image":"images/recipe_0190.webp","source_file":"Hibachi Style Chicken Stir Fry with Garlic Rice and Special Spicy Sauce.pdf"},{"id":"7cb539ddd370","title":"Jammin Fig Pork Chops with Crispy Potatoes and Green Beans","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Fig Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"}],"instructions":["Hey, EP friend! Did you substitute chicken breasts for pork chops? Easy peasy! Cook through the recipe as instructed, swapping in chicken for pork in steps 2, 4, and 6. In step 4, cook the chicken for 5-6 minutes per side.","If the fig jam doesn't dissolve right away when you add it to the pan in step 5, break up any clumps into smaller pieces with your spatula. Eventually, they'll melt into a deliciously sweet and sticky sauce.","pat pork dry with paper towels and season all over with salt and pepper; set aside. In a medium bowl, toss green beans with a drizzle of oil and a pinch of salt and pepper.","Preheat oven to 450 degrees. Wash and dry all produce. Dice potatoes into ½-inch pieces. Peel and finely chop garlic. Toss potatoes on a baking sheet with a large drizzle of oil and a pinch of salt and pepper. Roast for 15 minutes (you'll add the green beans then).","remove sheet from oven and push potatoes to one side. add green beans to empty side. (For 4 servings, leave potatoes roasting and add green beans to a second sheet.) Return to oven until veggies are browned and tender, 10-12 minutes more.","heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Turn off heat; transfer to a plate and set aside.","Return same pan to medium-high heat. Add garlic and cook until fragrant, 30 seconds. Stir in stock concentrate, jam, and ¼ cup water (⅓ cup for 4 servings). Cook, stirring, until thickened and glossy, 2-3 minutes. Turn off heat; stir in 1 TBSP butter (2 TBSP for 4) until melted.","Return pork to pan and turn to coat in sauce. Divide pork and roasted veggies between plates. Top pork with any remaining sauce.","Pork is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK34 NJ-84."],"image":"images/recipe_0191.webp","source_file":"Jammin Fig Pork Chops with Crispy Potatoes and Green Beans.pdf"},{"id":"e8a8243d71a6","title":"Garlicky White Sauce Flatbreads with Tomato and Roasted Zucchini","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Black Pepper","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flatbreads","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":4.0,"unit":"clove","quantity_text":"4 Cloves","aisle":"Produce"},{"name":"Cream Cheese","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Happen to have some Parm hanging out in your fridge? (Oh, you fancy, huh??) Grate it up (if it isn't pre- shredded) and sprinkle over your finished flatbreads to really take 'em over the top. Just say when!","Toss zucchini on a baking sheet with a drizzle of oil, 1 tsp Italian Seasoning (2 tsp for 4 servings), salt, and pepper. Place garlic foil packet on same sheet. Roast on top rack until zucchini is browned and tender, 12-15 minutes. Meanwhile, place tomato in a medium bowl and toss with 1 tsp Italian Seasoning (2 tsp for 4; you'll use the rest later), salt, and pepper; set aside.","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 450 degrees. Wash and dry produce. Trim and halve zucchini lengthwise; slice crosswise into ½-inch-thick half-moons. Peel garlic; place cloves in the center of a small piece of foil. Drizzle with olive oil and season with salt and pepper. Cinch into a packet. Halve tomato lengthwise; cut crosswise into ¼-inch-thick half-moons.","heat a large, dry pan over medium-high heat. Add bacon; cook, turning occasionally and adjusting heat if browning too quickly, until crispy, 6-10 minutes. Turn off heat; transfer to a paper-towel-lined plate. Wash out pan. Once bacon is cool enough to handle, roughly chop.","melt 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium-high heat. Add garlic powder, remaining Italian Seasoning, and 1 TBSP flour (2 TBSP for 4). Whisk constantly until lightly browned, 30 seconds. Reduce heat to medium low and whisk in ½ cup water (1 cup for 4) and cream cheese until melted and combined. Season generously with salt and pepper. Simmer until thickened, 1-2 minutes. (If sauce clumps, continue whisking and adding splashes of water until smooth.) Remove from heat.","transfer to bowl with tomato; toss to combine. Keeping garlic foil packet on sheet, wipe off any excess oil. Place flatbreads on sheet, then return to top rack until flatbreads are lightly toasted and garlic is softened, 5-7 minutes. (For 4 servings, divide flatbreads between 2 sheets; roast on top and middle racks.).","Return flatbreads to oven until cheese melts, 2-3 minutes. Slice flatbreads into pieces and divide between plates. If you've got some on hand, sprinkle with a pinch of chili flakes from your pantry if desired.","transfer cloves to a cutting board and roughly chop. Evenly top toasted flatbreads with white sauce, roasted garlic, and veggies. Sprinkle with mozzarella.","EPRC_12.91_EP1299B / EP1299BPA01_GARLICKY WHITE SAUCE FLATBREADS.indd 2 EPRC_12.91_EP1299B / EP1299BPA01_GARLICKY WHITE SAUCE FLATBREADS.indd 2 3/1/22 3:45 PM 3/1/22 3:45 PM."],"image":"images/recipe_0192.webp","source_file":"Garlicky White Sauce Flatbreads with Tomato and Roasted Zucchini.pdf"},{"id":"2f422d6480a9","title":"Garlicky Roasted Pepper Penne with Toasted Panko and Parmesan","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Olive Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Penne Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to give this dish some spicy *pizzazz*? If you've got some on hand, sprinkle your finished pasta with a pinch of chili flakes.","Place bell pepper halves, cut sides up, on one side of a baking sheet; drizzle each half with olive oil and rub to coat. Season with salt and pepper. Toss tomatoes on empty side of sheet with a drizzle of olive oil, salt, and pepper. Add garlic packet to sheet and roast on middle rack until veggies are browned and tender, 20- 25 minutes. transfer to a cutting board. Once cool enough to handle, roughly chop tomatoes and thinly slice bell pepper into strips. Mash garlic with a fork to form a paste.","Adjust rack to middle position and preheat oven to 425 degrees. Bring a large pot of salted water to a boil. Wash and dry produce. Halve bell pepper; remove stem and seeds. Cut tomatoes into ½-inch wedges. Peel garlic and place in the center of a small piece of foil; drizzle with olive oil and season with salt and pepper. Cinch into a packet.","add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve 1 cup pasta cooking water (2 cups for 4 servings), then drain and set aside.","melt 1 TBSP butter (2 TBSP butter for 4 servings) in a large pan over medium-high heat. Add half the panko and ¼ tsp garlic powder; season with salt and pepper (use all the panko and ½ tsp garlic powder for 4). Cook, stirring occasionally, until panko is toasted and golden brown, 3-5 minutes. Turn off heat; transfer to a small bowl. Wipe out pan.","Rinse shrimp under cold water; pat shrimp or chicken dry with paper towels. Season with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add shrimp or chicken; cook, stirring occasionally, until cooked through, 3-4 minutes for shrimp or 4-6 minutes for chicken. Turn off heat; transfer to a plate. Wipe out pan.","Heat a drizzle of olive oil in same pan over medium-high heat. Add roasted veggies, mashed garlic, tomato paste, Italian Seasoning, and remaining garlic powder; stir to combine (add a pinch of chili flakes from your pantry if you like things spicy!). Add cream cheese and ⅓ cup reserved pasta cooking water (⅔ cup for 4 servings); stir until sauce is creamy. Season generously with salt and pepper. Add drained pasta and 1 TBSP butter (2 TBSP for 4); stir until coated. (If needed, add more pasta cooking water a splash at a time.)."],"image":"images/recipe_0193.webp","source_file":"Garlicky Roasted Pepper Penne with Toasted Panko and Parmesan.pdf"},{"id":"ff17b0b0525a","title":"Cherry Glazed Pork Meatballs with Mashed Potatoes and Roasted Carrots","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Cherry Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to really up your mashed potato game? Replace the splash of water in Step 6 with half-and-half (YOLO), or stir in some cream cheese, sour cream, or grated Parmesan. If you've got any fresh herbs on hand (we especially love chives), they'll work great, too.","Preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Dice potatoes into ½-inch pieces. In a medium bowl, combine pork, half the panko (all for 4 servings), half the garlic, ¾ tsp salt (1½ tsp for 4), and pepper. Form into 10 1-inch meatballs (20 for 4).","Toss carrots on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 20-25 minutes. Meanwhile, place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, about 10 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Keep covered off heat until ready to mash.","Heat a drizzle of oil in pan used for meatballs over medium heat. Add remaining garlic and cook, stirring, until fragrant, about 30 seconds. Stir in vinegar; cook until mostly evaporated, 1-2 minutes. Stir in jam, stock concentrate, 1 TBSP ketchup (2 TBSP for 4 servings), and 2 TBSP water (3 TBSP for 4).","heat a drizzle of oil in a large pan over medium-high heat. Add meatballs and cook, turning occasionally, until browned on all sides, 6-8 minutes (they'll finish cooking in step 5). Turn off heat; transfer to a plate. Wipe out pan.","Mash potatoes with 3 TBSP butter (6 TBSP for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4). Season with salt and pepper. Divide meatballs, carrots, and mashed potatoes between plates. Top meatballs with any remaining glaze.","Return meatballs to pan with sauce; cook, stirring, until sauce has thickened and meatballs are coated and cooked through, 2-3 minutes more. Turn off heat and stir in 1 TBSP butter (2 TBSP for 4 servings) until melted."],"image":"images/recipe_0194.webp","source_file":"Cherry Glazed Pork Meatballs with Mashed Potatoes and Roasted Carrots.pdf"},{"id":"86c16a9066c5","title":"Cheesy Tex-Mex Pork Burgers with Caramelizsed Onion and Potato Wedges","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Black Pepper","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Ground Pork","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["When forming your patties in step 4, be gentle and try not to overwork the meat. Using a light touch when flattening and shaping will make for juicy and tender results!","Toss potatoes on a baking sheet with a drizzle of oil and half the Southwest Spice (you'll use more later). Season generously with salt and pepper. Roast on top rack, flipping halfway through, until browned and tender, 20-25 minutes.","Adjust racks to top and middle positions and preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Trim and thinly slice onion. Peel and finely chop garlic.","in a large bowl, combine pork, garlic, 1 tsp Southwest Spice (2 tsp for 4 servings; you'll use the rest in the next step), salt (we used ¾ tsp; 1½ tsp for 4), and pepper. Form into two patties (four patties for 4), each a bit wider than a burger bun. Heat a drizzle of oil in pan used for onion over medium-high heat. Add patties and cook until browned and cooked through, 4-6 minutes per side. In the last 2 minutes of cooking, top patties with cheese; cover pan to melt cheese.","heat a drizzle of oil in a large pan over medium-high heat. Add onion and a pinch of salt and pepper. Cook, stirring, until lightly browned and softened, 6-7 minutes. Stir in 1 tsp sugar (2 tsp for 4 servings), 1 TBSP butter (2 TBSP for 4), and if you've got some on hand, hot sauce from your pantry if desired. Reduce heat under pan to medium. Cook, stirring, until onion is caramelized, 3-4 minutes more. Turn off heat; transfer to a bowl. Wipe out pan.","Halve and toast buns. Spread some spiced ketchup onto cut sides of buns; fill with patties and caramelized onion. Divide burgers and potato wedges between plates. Serve with remaining spiced ketchup on the side.","In a small bowl, combine 3 TBSP ketchup (6 TBSP for 4 servings), remaining Southwest Spice, and a pinch of pepper.","EPRC_2.88_EP1591B / EP1591BSS03_CHEESY TEX-MEX PORK BURGERS.indd 2 EPRC_2.88_EP1591B / EP1591BSS03_CHEESY TEX-MEX PORK BURGERS.indd 2 12/21/21 1:16 PM 12/21/21 1:16 PM."],"image":"images/recipe_0195.webp","source_file":"Cheesy Tex-Mex Pork Burgers with Caramelizsed Onion and Potato Wedges.pdf"},{"id":"0456c722518e","title":"Loaded Pork Potato Wedges with Pickled Onion Monterey Jack and Lime Crema","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Sugar","amount":0.25,"unit":"tsp","quantity_text":"¼ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["We gave crispy, spiced oven fries the nacho treatment by piling on saucy pork, cheese, pickled onion, and tangy lime crema. Want to go even more wild? If you've got any on hand, feel free to add sliced avocado, freshly chopped cilantro, pico de gallo, or even a few fried eggs! We support all of your nacho endeavors.","halve, peel, and thinly slice onion. Zest and quarter lime. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens.","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Toss on a baking sheet with a large drizzle of oil, half the Southwest Spice Blend (you'll use the rest later), salt, and pepper. (For 4, divide between 2 sheets; roast on top and middle racks.) Roast on top rack until browned and crispy, 20-25 minutes.","Heat a large drizzle of oil in a large pan over medium-high heat. Add pork, scallion whites, and remaining onion. Season with remaining Southwest Spice Blend, salt, and pepper. Cook, breaking up meat into pieces, until pork is browned, 3-4 minutes (it'll finish cooking later). Stir in stock concentrates, ¼ cup water, and 2 TBSP ketchup. (For 4 servings, use ½ cup water and 4 TBSP ketchup.) Season generously with salt and pepper. Cook until pork is cooked through and mixture is saucy and combined, 1-2 minutes more.","In a small microwave-safe bowl, combine ¼ of the onion, juice from two lime wedges, ¼ tsp sugar, and a pinch of salt. (For 4 servings, use four lime wedges and ½ tsp sugar.) Microwave until onion is softened, 1 minute; set aside. In a separate small bowl, combine sour cream, half the lime zest, a squeeze of lime juice, 2 tsp water (4 tsp for 4), and a pinch of garlic. Season with salt and pepper.","Pat chicken dry with paper towels. Cook through this step as instructed, swapping in chicken (no need to break up into pieces!) or beef for pork.","Divide potato wedges between plates. Top with pork mixture and drizzle with lime crema. Garnish with cheese, scallion greens, pickled onion (draining first), and remaining lime zest to taste.","Ground Pork is fully cooked when internal temperature reaches 160°. Chicken is fully cooked when internal temperature reaches 165°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0196.webp","source_file":"Loaded Pork Potato Wedges with Pickled Onion Monterey Jack and Lime Crema.pdf"},{"id":"caf6bad2d64f","title":"Chicken Sausage and Roasted Tomato Linguine with Parmesan","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"}],"instructions":["How do you know if your pasta water is salty enough? Taste it! (We're serious.) Because your cooking water is the only chance you have to season the pasta itself, it's super-important to treat it like you would any other ingredient. The water should taste about as salty as the ocean!","Heat a drizzle of oil in a large pan over medium-high heat. Add diced onion and sausage; season with salt and pepper. Cook, breaking up meat into pieces, until sausage is browned and cooked through, 4-6 minutes. Add garlic; cook, stirring, until fragrant, 30 seconds. Stir in tomato paste until everything is fully coated.","Adjust rack to middle position and preheat oven to 400 degrees. Bring a large pot of salted water to a boil. Wash and dry produce. Cut tomato into ½-inch-thick wedges; toss on a baking sheet with a drizzle of olive oil, salt, and pepper. Roast on middle rack until browned and tender, 15-20 minutes. Meanwhile, halve, peel, and dice half the onion (whole onion for 4 servings). Peel and finely chop garlic.","slowly stir 1 cup plain water (1½ cups for 4 servings) into pan with sausage mixture until thoroughly combined. Reduce heat to medium; simmer, stirring, until thickened, 3-5 minutes. Season with salt and pepper. Stir in cream cheese, half the Parmesan (save the rest for serving), and 1 TBSP butter (2 TBSP for 4) until melted and combined.","add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water, then drain.","Add drained pasta and roasted tomato wedges to pan with sauce; toss to coat. If needed, add splashes of reserved pasta cooking water until everything is coated in a creamy sauce. Season with salt. If you've got some on hand, add a pinch of chili flakes from your pantry if desired."],"image":"images/recipe_0197.webp","source_file":"Chicken Sausage and Roasted Tomato Linguine with Parmesan.pdf"},{"id":"84bd6aaea888","title":"Chili Crunch Noodles with Snow Peas Carrots and Peanuts","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Carrots","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ramen Noodles","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sweet Soy Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 4, we instruct you to use ⅔ of the ramen noodles and save the rest for another use. Need some inspo for the extras? Cook until tender, then stir into soup, toss with vinaigrette (try rice vinegar + soy sauce + sesame oil), and top with an over-easy egg, or make fried “rice” but replace the grains with the twirlable noodles! You really can't go wrong.","Trim snow peas; remove and discard strings. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop or grate garlic and ginger.","Bring a large pot of salted water to a boil. Wash and dry all produce. In a small bowl, combine peanuts, sesame seeds, soy sauce, 1 tsp sugar (2 tsp for 4 servings), and half the chili flakes. Fill bowl with enough oil to just cover (we used ¼ cup; ⅓ cup for 4-you may need a little more or less). Cover with plastic wrap and microwave for 30 seconds. Set aside to cool. Once cooled, taste and add more chili flakes if desired.","Heat a drizzle of oil in a large pan over medium- high heat. Add snow peas and cook until slightly softened, 1-2 minutes. Add carrots and cook, stirring, until slightly softened, 1-2 minutes. Stir in scallion whites, garlic, and ginger. Cook until fragrant, 1 minute. Season with salt and pepper.","add ⅔ of the ramen noodles to pot (save the rest for another use). Cook until tender, 1-2 minutes. Drain and rinse well under cold running water. (This stops the cooking process and gets rid of excess starch so your noodles don't stick together. Win-win!).","heat a drizzle of oil in a second large pan over medium-high heat. Add salmon skin sides down; cook until skin is crisp, 5-7 minutes. Flip and cook to desired doneness, 1-2 minutes more.","To pan with veggies, add sweet soy glaze, half the chili crunch, and drained ramen noodles. Toss to thoroughly combine. Remove from heat and season with salt and pepper."],"image":"images/recipe_0198.webp","source_file":"Chili Crunch Noodles with Snow Peas Carrots and Peanuts.pdf"},{"id":"dc58f0f18578","title":"Meatloaf Italiano Sandos with Crispy Parmesan Zucchini and Special Sauce","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ciabattas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Ketchup","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Milk","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["If you like a touch of heat, add some chili flakes to the cheesy panko mixture in Step 2 before coating your zucchini. That extra spice will add even more oomph to this delicious, crispy side.","In a large bowl, toss zucchini with a large drizzle of oil. In a small bowl, combine cheese, half the panko, and a drizzle of oil. Season with salt and pepper. Working one piece at a time, press one side of zucchini slices into panko mixture until coated. Arrange zucchini slices, coated sides up, in a single layer on one side of a baking sheet (for 4 servings, arrange across entire sheet). Press any extra panko mixture in bowl onto tops of coated zucchini. Reserve bowl.","Adjust racks to middle and top positions and preheat oven to 425 degrees. Wash and dry produce. Trim and slice zucchini into ¼-inch-thick rounds. Peel and finely chop garlic. Halve ciabattas horizontally. In a small bowl, combine 2 TBSP ketchup (4 TBSP for 4 servings) and 1 tsp Tuscan Heat Spice (2 tsp for 4). (You'll use the rest of the Tuscan Heat Spice later.).","in a small microwave-safe bowl, combine 1 TBSP butter (2 TBSP for 4 servings) and remaining garlic; microwave until melted, 30-60 seconds. Brush garlic butter onto cut sides of ciabattas; arrange, cut sides down, on a second baking sheet. When meatloaves have 5 minutes left, transfer ciabattas to top rack until toasted, 3-5 minutes. (For 4, remove sheet with zucchini from oven and push zucchini to one side; add ciabattas, cut sides down, to opposite side and toast as instructed.).","In bowl used for zucchini, combine remaining panko and 2 TBSP milk (4 TBSP for 4 servings). Add beef, half the garlic, remaining Tuscan Heat Spice, ½ tsp salt (1 tsp for 4), and pepper; mix to combine. Shape into two 1-inch-tall loaves (four loaves for 4). Place meatloaves on opposite side of baking sheet from zucchini. Brush meatloaves with ketchup mixture. Roast on middle rack until meatloaves are cooked through and zucchini is crisp and tender, 15-18 minutes. (For 4, arrange meatloaves on a second baking sheet; roast zucchini on top rack and meatloaves on middle rack.).","In a second small bowl, combine 2 TBSP ketchup and 2 TBSP mayonnaise (4 TBSP ketchup and 4 TBSP mayonnaise for 4 servings). Spread as much special sauce as you like over cut sides of toasted ciabattas. Transfer meatloaves to a cutting board; slice each meatloaf crosswise into four slices and arrange over sauce. Close sandwiches and halve on a diagonal."],"image":"images/recipe_0199.webp","source_file":"Meatloaf Italiano Sandos with Crispy Parmesan Zucchini and Special Sauce.pdf"},{"id":"e0602c4dccc0","title":"Crispy Southwest Chicken Sandwiches with Pickled Jalapeno Potato Wedges and Southwest Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"more for frying)","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Other"},{"name":"Flour","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["We love jalapeños for their fresh kick. If you're looking for a milder spice, however, remove the ribs and seeds in Step 1 (that's where most of the heat lives).","place ¼ cup flour (½ cup for 4 servings) in a shallow dish. Crack one egg (two eggs for 4) into a second shallow dish; add 2 TBSP water (4 TBSP for 4) and beat with a fork to combine. Combine panko and 2¼ tsp Southwest Spice Blend (4½ tsp for 4; you'll use the rest later) in a third shallow dish. Season all three dishes generously with salt and pepper.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Thinly slice half the jalapeño into rounds, removing ribs and seeds for less heat. Quarter lime. In a small bowl, combine sliced jalapeño and juice from half the lime; season with salt and pepper and set aside. Cut potatoes into ½-inch-thick wedges; toss on a baking sheet with a large drizzle of oil, salt, and pepper. Roast on top rack until browned and tender, 20-25 minutes. Remove from sheet.","Trim and halve Brussels sprouts lengthwise (quarter any larger ones) or trim green beans if necessary. Swap in Brussels sprouts or green beans for potatoes; roast 15-20 minutes for Brussels sprouts or 12-15 minutes for green beans.","Heat a ¼-inch layer of oil in a large pan over medium-high heat. Once oil is hot enough that a pinch of seasoned panko sizzles when added to the pan, add coated chicken. Cook until chicken is golden brown and cooked through, 3-4 minutes per side. Transfer to a paper-towel-lined plate. Season with salt and pepper.","Pat chicken dry with paper towels and season all over with salt and pepper. Place between 2 large pieces of plastic wrap; pound with a mallet or heavy-bottomed pan until about ⅓ inch thick. Working with one piece at a time, press chicken into flour until fully coated. Shake off excess, then dip both sides into beaten egg. Let excess egg drip off, then press into seasoned panko until fully coated. (For less mess, use tongs to dip and transfer! Discard any excess flour, egg, and panko after coating.).","halve buns. Place 1 TBSP butter (2 TBSP for 4 servings) in a second small microwave-safe bowl; microwave until melted, 30 seconds. Brush onto cut sides of buns. Place buns, cut sides up, on baking sheet used for potatoes. Toast in oven until golden, 3-5 minutes. Meanwhile, in a third small bowl, combine remaining Southwest Spice Blend, 2 TBSP mayonnaise (4 TBSP for 4), and 2 tsp ketchup (4 tsp for 4).","Fill toasted buns with crispy chicken, pickled jalapeño (draining first), and Southwest sauce. Divide sandwiches and potato wedges between plates. Serve with remaining lime wedges on the side. (If you've got some extra ketchup on hand, serve on the side for dipping.).","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Chicken is fully cooked when internal temperature reaches 165°."],"image":"images/recipe_0200.webp","source_file":"Crispy Southwest Chicken Sandwiches with Pickled Jalapeno Potato Wedges and Southwest Sauce.pdf"},{"id":"f44129202a20","title":"Crispy Black Bean Burritos with Tex Mex Rice Pico de Gallo and Guacamole","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Tex-Mex Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Guacamole","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to nail the perfect pot of rice? Once the water boils, cover the pot with a tight-fitting lid and reduce the heat. Simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat while you finish cooking. This allows the moisture to redistribute, giving you tender, fluffy grains.","Wash and dry produce. Dice tomato into ½-inch pieces. Halve, peel, and finely dice half the onion (whole onion for 4 servings). Quarter lime. In a medium bowl, combine tomato, 2 TBSP diced onion (4 TBSP for 4), a big squeeze of lime juice, a large drizzle of olive oil, and salt and pepper to taste.","In a small pot, combine rice, half the Tex-Mex paste (you'll use the rest later), 1¼ cups water (2¼ cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 18-20 minutes. Fluff rice with a fork. Keep covered off heat until ready to serve.","Heat a drizzle of oil in a medium pot over medium-high heat. Add beef and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Turn off heat; transfer to a plate. Wipe out pot.","Melt 1 TBSP butter (2 TBSP for 4 servings) in same pot over medium-high heat. Whisk in 1 TBSP flour (2 TBSP for 4) and cook, whisking, until lightly browned, 30 seconds. Whisk in ½ cup water (1 cup for 4) and remaining Tex-Mex paste until combined. Whisk in cream cheese until smooth. Cook until sauce has thickened, about 1 minute. (Add a splash of water if sauce becomes too thick.) Cover to keep warm.","In a medium pot, combine beans and their liquid, 1 TBSP butter (2 TBSP for 4 servings), and ¾ tsp salt (1½ tsp for 4) over medium-high heat. Cook, stirring occasionally, until beans are warmed through, 3-4 minutes. Turn off heat; transfer to a medium bowl and cover to keep warm. Wash out pot.","Heat a large drizzle of oil and 2 TBSP butter (4 TBSP for 4 servings) in a large pan over medium-high heat. Once butter has melted, add burritos seam sides down; cook until golden and crispy, 1-2 minutes per side. (If burritos begin to brown too quickly, lower that heat!) Halve burritos and divide between plates along with remaining rice and remaining beans. Drizzle burritos with Tex-Mex sauce (if necessary, reheat sauce in pot over low heat). Garnish with pico de gallo and serve with remaining lime wedges on the side.","Place tortillas on a clean work surface. Place ⅔ cup rice in a line on the bottom third of each tortilla. Drain beans. Top rice with ⅔ cup beans and guacamole. (You'll have some rice and beans left over-save for serving!) Fold up bottom side of each tortilla over filling, then fold over left and right sides toward filling. Roll up tortillas, starting with filled sides, to form burritos."],"image":"images/recipe_0201.webp","source_file":"Crispy Black Bean Burritos with Tex Mex Rice Pico de Gallo and Guacamole.pdf"},{"id":"b0757871ef18","title":"Garlic Lime Chicken Fajitas with Pickled Onion and Lime Crema","category":"Chicken","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Vegetable Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.25,"unit":"tsp","quantity_text":"¼ tsp","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Hey, EP friend! Did you substitute shrimp for chicken? Cook through the recipe as instructed, swapping in shrimp for chicken in steps 4, 5, and 6. In step 4, rinse the shrimp under cold water before patting dry. In step 5, cook the shrimp until opaque and cooked through, 2-4 minutes.","In step 6, we instruct you to warm your tortillas in the microwave. This method will yield steamy-soft 'tillas. To add a little more depth to your dish, try charring them over the flames of your gas stove. Using tongs and working one at a time, place tortillas directly on the burner until they blister, a few minutes per side.","In a small bowl, combine ¼ of the onion, juice from half the lime, ¼ tsp sugar, and a pinch of salt. Set aside to quick-pickle. In a separate small bowl, combine sour cream, half the lime zest, a squeeze of lime juice, and a pinch of garlic. Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Wash and dry all produce. Halve, peel, and very thinly slice onion. Zest and quarter lime. Peel and finely chop garlic. Halve, core, and thinly slice poblano and green pepper into strips.","Heat a drizzle of oil in a large pan over medium-high heat. Add poblano and green pepper; season with salt and pepper. Cook, stirring, until slightly softened, 5-7 minutes. Add remaining onion and season with salt and pepper. Cook, stirring, until lightly browned and tender, 4-5 minutes. Add 1 tsp Southwest Spice (2 tsp for 4 servings; you'll use the rest in the next step). Cook until fragrant, 30 seconds. Transfer veggies to a plate and set aside.","place chicken in a medium bowl and pat dry with paper towels. Add a large drizzle of oil and remaining Southwest Spice, lime zest, and garlic. Season generously with salt and pepper; stir to coat.","heat a drizzle of oil in same pan over high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes. (Don't move the chicken around too much! You want to develop nice caramelization on all sides.).","wrap tortillas in damp paper towels and microwave until warm and pliable, 30 seconds. Divide tortillas between plates and fill with chicken, veggies, pickled onion (draining first), and a drizzle of lime crema. Serve with any remaining lime wedges on the side. Chicken is fully cooked when internal temperature reaches 165 degrees. Shrimp (Contains: Shellfish) is fully cooked when internal temperature reaches 145 degrees. WK42 NJ-87."],"image":"images/recipe_0202.webp","source_file":"Garlic Lime Chicken Fajitas with Pickled Onion and Lime Crema.pdf"},{"id":"ec672da4433d","title":"Hotel Butter Steak with Cranberry Brussels Sprouts and Crispy Potatoes","category":"Steak","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Cranberries","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Parsley","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"}],"instructions":["The best way to tell when your Brussels sprouts are done in step 2? After 15 minutes, stick a fork into the center of one-it should go through like butter. If there's some resistance, pop 'em back in the oven and check again a few minutes later. (And don't worry if they get a little dark brown in spots. We <3 a toasty sprout.).","Preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ¼-inch-thick rounds. Toss on one side of a baking sheet with a large drizzle of oil, salt, and pepper. (For 4 servings, spread potatoes out across entire sheet.) Roast for 5 minutes (you'll add the Brussels sprouts then).","trim and halve Brussels sprouts lengthwise. Once potatoes have roasted 5 minutes, remove baking sheet from oven. toss Brussels sprouts on empty side with a drizzle of oil, salt, and pepper. (For 4 servings, leave potatoes roasting and toss Brussels sprouts on a second baking sheet.) Return to oven until everything is lightly browned and tender, 15-20 minutes more. Toss Brussels sprouts with cranberries.","Pat steak dry with paper towels and season all over with salt and pepper. Heat a large drizzle of oil in a large pan over medium-high heat. Add steak and cook to desired doneness, 3-5 minutes per side. Turn off heat; transfer to a cutting board to rest.","finely chop parsley. Peel and finely chop garlic. Place 2 TBSP butter (4 TBSP for 4 servings) in a small microwave-safe bowl; microwave until just softened, 5-10 seconds. Stir in 1 tsp parsley (2 tsp for 4) and a pinch of garlic. Season with salt and pepper.","Thinly slice steak against the grain. Divide steak, potatoes, and Brussels sprouts between plates. Dollop steak with hotel butter. Garnish with remaining parsley."],"image":"images/recipe_0203.webp","source_file":"Hotel Butter Steak with Cranberry Brussels Sprouts and Crispy Potatoes.pdf"},{"id":"b01c19e85c5c","title":"Cream of Mushroom Soup with Garlic Bread","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Mushrooms","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Flour","amount":0.25,"unit":"cup","quantity_text":"¼ Cup","aisle":"Pantry"},{"name":"Ciabatta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Milk","amount":1.0,"unit":"cup","quantity_text":"1 Cup","aisle":"Dairy & Eggs"}],"instructions":["Happen to have some Parm hanging out in your fridge? Grate it up (if it isn't pre-shredded) and sprinkle over your soup to really take it over the top. Just say when!","Heat a drizzle of oil in a medium pot (use a large pot for 4 servings) over medium-high heat. Add mushrooms and cook, undisturbed, until mushrooms begin to brown, 2-3 minutes. Stir in onion and scallion whites; cook, stirring occasionally, until veggies are softened, 2-3 minutes more. Season with salt and pepper. Transfer veggies to a plate and reduce heat to medium.","Preheat oven to 425 degrees. (If you have a toaster oven, you can skip the preheating!) Place 1 TBSP butter (2 TBSP for 4 servings) in a small bowl; bring to room temperature. Wash and dry produce. Trim and thinly slice mushrooms (skip if your mushrooms are pre-sliced!). Halve, peel, and finely dice onion. Trim and thinly slice scallions, separating whites from greens.","Slowly stir in 1 cup milk (2 cups for 4 servings) until fully incorporated. Add stock concentrates, 2 cups water, and 1 tsp salt (use 4 cups water and 2 tsp salt for 4); stir to combine. Bring to a boil, then reduce heat to medium low. Return veggies to pot and simmer, stirring occasionally, until thickened, 8-10 minutes. Turn off heat and stir in sour cream; taste and season with salt and pepper if desired. If soup seems too thick, stir in a splash of water (or cream, for a luxe experience).","Add 4 TBSP butter, ½ tsp thyme, and ¾ tsp garlic powder to same pot. (For 4 servings, use 8 TBSP butter, 1 tsp thyme, and 1½ tsp garlic powder.) Cook, stirring, until mixture is fragrant and butter has melted, 1-2 minutes. Add ¼ cup flour (½ cup for 4); cook, stirring constantly, until golden brown, 1-2 minutes.","add remaining garlic powder and a pinch of salt and pepper to bowl with softened butter; stir to combine. Halve ciabatta and spread cut sides with garlic butter. Toast, cut sides up, directly on oven rack until golden brown, 3-5 minutes (or use your toaster oven). Halve garlic bread on a diagonal."],"image":"images/recipe_0204.webp","source_file":"Cream of Mushroom Soup with Garlic Bread.pdf"},{"id":"437bb41f67bb","title":"Garden Herb Chicken and Cavatappi with Tomato in a Creamy Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Breasts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["You may notice that we pretty much always ask you to reserve a bit of pasta cooking water before draining your pasta. Wondering what makes this cloudy water so darn special? It's salty and starchy, and those magical starches help emulsify your sauce (aka turn it silky smooth). Basically, it makes good pasta great, and we'll never leave you with a bowl full of just good.","Bring a large pot of salted water to a boil. Wash and dry produce. Peel and finely chop garlic. Dice tomato into small pieces. Pat chicken dry with paper towels and dice into ½-inch pieces; season generously with salt and pepper.","add pasta to pot. Cook, stirring occasionally, until al dente, 10-12 minutes. Reserve ½ cup pasta cooking water (¾ cup for 4 servings), then drain.","Stir in 1 TBSP flour (2 TBSP for 4 servings) until lightly browned, 15-30 seconds. Stir in reserved pasta cooking water, stock concentrate, cream cheese, remaining Ranch Spice, and ½ tsp salt. Simmer until sauce has thickened and coats the back of a spoon, 1-2 minutes.","heat a large drizzle of oil in a medium pan (use a large pan for 4 servings) over medium heat. Once pan is hot, add chicken in a single layer; stir in garlic and half the Ranch Spice (you'll use the rest later). Cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes.","Add drained pasta and tomato to pan with sauce; toss to coat. Cook, stirring occasionally, until tomato is warmed through, 1-2 minutes. Remove from heat. Stir in sour cream and 1 TBSP butter (2 TBSP for 4 servings) until melted and combined. Taste and season with salt. Divide between bowls and serve."],"image":"images/recipe_0205.webp","source_file":"Garden Herb Chicken and Cavatappi with Tomato in a Creamy Sauce.pdf"},{"id":"88c78a70abbf","title":"Hibachi Style Steak Rice Bowls with Zucchini Onion and Spicy Special Sauce","category":"Steak","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Mayonnaise","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Other"},{"name":"Diced Steak","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"}],"instructions":["Want to nail the perfect pot of rice? Once your water boils in step 1, immediately cover the pot with a tight- fitting lid and reduce heat to the lowest setting. Let it simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat for a few minutes while you cook the rest of the meal. This crucial step allows the moisture to redistribute, giving you tender, fluffy grains every time.","Wash and dry produce. Trim and thinly slice half the scallions (all for 4 servings), separating whites from greens. Melt 1 TBSP butter in a small pot over medium-high heat. Add half the sesame seeds (all for 4); cook, stirring, until golden brown, 1-2 minutes. Transfer to a medium bowl. Add a drizzle of oil and scallion whites to same pot; cook, stirring, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4), and a pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until tender, 15-20 minutes. Keep covered off heat until ready to serve.","trim and halve zucchini lengthwise; slice crosswise into ½-inch-thick half-moons. Trim, peel, and cut onion into a large dice.","Heat a large drizzle of oil in a large pan over medium-high heat. Add zucchini and onion; season with salt and pepper. Cook, stirring occasionally, until veggies are tender and lightly charred, 7-9 minutes. Transfer to bowl with toasted sesame seeds; toss to combine.","In a small bowl, combine 4 TBSP mayonnaise, 1 tsp ketchup, ½ tsp sugar, and Sriracha to taste. (For 4 servings, use 8 TBSP mayonnaise, 2 tsp ketchup, and 1 tsp sugar.) Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings) and season with salt and pepper. Divide between shallow bowls. Top with steak and veggies. Drizzle with spicy special sauce. Garnish with scallion greens.","Pat diced steak dry with paper towels. Heat a drizzle of oil in pan used for veggies over high heat. Add steak, garlic powder, salt, and pepper. Cook, stirring occasionally, until steak is browned and cooked to desired doneness, 2-3 minutes. Stir in ponzu and soy sauce, then turn off heat."],"image":"images/recipe_0206.webp","source_file":"Hibachi Style Steak Rice Bowls with Zucchini Onion and Spicy Special Sauce.pdf"},{"id":"cbe63450bebe","title":"Greek Pork Meatball Bowls with Cucumber Tomato Salad and Garlic Couscous","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":0.25,"unit":"tsp","quantity_text":"¼ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Dried Oregano","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mini Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Vinaigrette","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"}],"instructions":["Splash a little cold water on your hands before shaping the meatballs in Step 2. The heat in your hands is what causes a mixture to stick; cooling them down will make the pork hold to itself rather than to you. And remember to use a light touch-this helps ensure the meatballs won't toughen up when cooked.","In a medium bowl, combine pork, oregano, half the panko (all for 4 servings), ¼ of the garlic, salt (we used ¾ tsp; 1½ tsp for 4), and pepper. Form into 10-12 (20-24 for 4) 1½ inch meatballs.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Trim and quarter cucumber lengthwise; slice crosswise into ½-inch-thick pieces. Dice tomato.","Place meatballs on a lightly oiled baking sheet. Roast on top rack until browned and cooked through, 14-16 minutes. Meanwhile, melt 1 TBSP butter (2 TBSP for 4 servings) in a medium pot over medium-high heat. Add remaining garlic; cook until fragrant, 30 seconds. Add couscous; stir to coat. Stir in stock concentrate, ¾ cup water (1½ cups for 4), and a big pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until couscous is tender, 6-8 minutes. Drain any excess liquid if necessary. Keep covered off heat until ready to serve.","Stir in 1 TBSP butter (2 TBSP for 4 servings) to pot with couscous; season with salt and pepper. Divide couscous between bowls. Top with meatballs and cucumber tomato salad in separate sections. Drizzle meatballs with creamy Greek sauce.","in a second medium bowl, combine cucumber, tomato, and 2 tsp vinaigrette (4 tsp for 4 servings); season with salt and pepper. In a small bowl, combine sour cream, remaining vinaigrette, and ¼ tsp sugar (½ tsp for 4); season with salt and pepper. Add water 1 tsp at a time until sauce reaches a drizzling consistency.","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0207.webp","source_file":"Greek Pork Meatball Bowls with Cucumber Tomato Salad and Garlic Couscous.pdf"},{"id":"f19ceb94c07f","title":"Diner Style Chicken and Gravy with Buttery Broccoli and Garlic Mashed Potatoes","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Flour","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Pantry"},{"name":"Butter","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Want to turn this meal into a full-blown diner-style feast? Whip up frosty vanilla milkshakes for dessert-or for sipping alongside! (We won't judge.) For two, blend 1 pint vanilla ice cream, 1 cup milk, 1 tsp vanilla extract, and a pinch of salt. Divide between glasses and treat yourself.","Preheat oven to 425 degrees. Wash and dry produce. Cut broccoli into bite-size pieces. Dice potatoes into ½-inch pieces. Peel garlic and finely chop one clove (two cloves for 4 servings); keep remaining cloves whole. Halve, peel, and finely chop shallot. Add ¼ cup flour (½ cup for 4) to a plate or shallow dish; season generously with salt and pepper (and, if you've got some, a pinch of garlic powder, paprika, or poultry seasoning!).","Toss broccoli on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 15-20 minutes. Meanwhile, place potatoes and whole garlic cloves in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until fork-tender, about 10 minutes. Reserve ½ cup potato cooking liquid, then drain. Return potatoes and garlic to pot.","place 1 tsp chopped garlic (2 tsp for 4 servings) and 1 TBSP butter (2 TBSP for 4) in a medium microwave-safe bowl; microwave until melted, 30 seconds. Stir in roasted broccoli and season with salt and pepper; cover and keep warm until serving. Once potatoes and garlic cloves are drained, mash with sour cream and 3 TBSP butter (6 TBSP for 4) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup). Season generously with salt and pepper.","pat chicken dry with paper towels; place between 2 large pieces of plastic wrap. Pound with a rolling pin or mallet until chicken is about ¾ inch thick. Season all over with salt and pepper. Press chicken into seasoned flour to completely coat; shake off any excess. Heat a drizzle of oil in a large pan over medium heat. Add coated chicken and cook until browned and cooked through, 3-5 minutes per side. Turn off heat; transfer to a plate. Wash out pan.","Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for chicken over medium heat. Add shallot; season with salt and pepper. Cook, stirring, until softened, 2-3 minutes. Stir in 1 TBSP flour (2 TBSP for 4) until lightly browned, 1 minute. Gradually whisk in ¾ cup plain water (1½ cups for 4), then stir in stock concentrate. Bring to a boil and cook until thickened, 1-2 minutes. Season gravy with salt and pepper. (If gravy gets too thick, add a splash more water.)."],"image":"images/recipe_0208.webp","source_file":"Diner Style Chicken and Gravy with Buttery Broccoli and Garlic Mashed Potatoes.pdf"},{"id":"6919dc8d8910","title":"Family Style Ponzu Beef Lettuce Wraps with Charred Snap Peas Garlic Ginger Rice and Thai Chili Mayo","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Peas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Baby Lettuce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Carrots","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Here's a quick and easy tip for peeling garlic: Place the cloves in a cup, cover with your hand, and shake, shake, shake! This will help loosen the peel and make it easier to remove.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Wash and dry produce. Peel and finely chop garlic. Peel and finely chop ginger. Trim and remove strings from snap peas by snapping off the stem end with your fingers and gently pulling (like you would a zipper). Trim and discard root end from lettuce; separate leaves. Pick cilantro leaves from stems; discard stems.","Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add half the garlic and half the ginger. Cook, stirring, until fragrant, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4), and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15- 20 minutes. Keep covered off heat until ready to serve.","Heat a drizzle of oil in a large pan over medium-high heat. Add snap peas; cook, undisturbed, until charred on one side, 1-2 minutes. Continue to cook, stirring occasionally, until tender and charred all over, 1-2 minutes more. Turn off heat; transfer to a small bowl. Season with salt and pepper and cover to keep warm. Wipe out pan.","In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with half the chili sauce (you'll use the rest later). Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Set aside.","Fluff rice with a fork. Stir in 1 TBSP butter (2 TBSP for 4 servings) and a pinch of salt; transfer to a medium bowl. Transfer lettuce leaves to a large platter. Transfer ponzu beef mixture to a large bowl and top with peanuts and cilantro leaves. Transfer charred snap peas to a small bowl and serve Thai chili mayo on the side for drizzling. Serve everything family style!","Heat a drizzle of oil in same pan over medium-high heat. Add beef and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-5 minutes (drain any excess grease if necessary). Add carrots, remaining garlic, and remaining ginger; cook until fragrant, 30-60 seconds. Add ponzu, sweet soy glaze, and remaining chili sauce; stir until coated. Remove from heat; taste and season with salt and pepper."],"image":"images/recipe_0209.webp","source_file":"Family Style Ponzu Beef Lettuce Wraps with Charred Snap Peas Garlic Ginger Rice and Thai Chili Mayo.pdf"},{"id":"b0dd611db778","title":"Herby Parmesan Crusted Chicken with Garlic Mashed Potatoes and Roasted Carrots","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"}],"instructions":["Want to really go the extra mile with your mashed potatoes? Peel the potatoes before dicing in step 1 for an extra fluffy and silky end result! (A splash of milk or heavy cream while mashing never hurts either.).","Preheat oven to 450 degrees. Wash and dry produce. Dice potatoes into ½-inch pieces. Peel garlic. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Pat chicken dry with paper towels and season all over with salt and pepper; place on one side of a baking sheet. (For 4 servings, spread chicken out across entire sheet.).","In a small bowl, combine cheese, half the panko, a large drizzle of olive oil, 1 tsp Italian Seasoning (you'll use more later), salt, and pepper. (For 4 servings, use all the panko and 2 tsp Italian Seasoning.) Spread tops of chicken with half the sour cream (you'll use the rest later), then mound with panko mixture, pressing firmly to adhere (no need to coat the undersides).","toss carrots on empty side of sheet with a drizzle of olive oil, 1 tsp Italian Seasoning (2 tsp for 4 servings; measure-we sent more), salt, and pepper. (For 4, add carrots to a second sheet.) Roast until crust is browned, chicken is cooked through, and carrots are browned and tender, 15-20 minutes.","Place potatoes and garlic cloves in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid (1 cup for 4 servings), then drain. Return potatoes and garlic to pot. Keep covered off heat until ready to mash.","Swap in green beans or Brussels sprouts for carrots. If green beans are done before chicken, remove from sheet; continue roasting chicken as instructed.","mash potatoes and garlic with remaining sour cream and 2 TBSP butter (4 TBSP for 4 servings) until smooth, adding splashes of potato cooking liquid (we used ¼ cup). Season generously with salt and pepper. Divide mashed potatoes, chicken, and carrots between plates."],"image":"images/recipe_0210.webp","source_file":"Herby Parmesan Crusted Chicken with Garlic Mashed Potatoes and Roasted Carrots.pdf"},{"id":"97a790b9dbce","title":"Chipotle Glazed Meatloaves with Roasted Garlic Mashed Potatoes and Carrots","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Milk","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"White Bread","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"}],"instructions":["Splash a little cold water on your hands before shaping the meatloaves in Step 3. The heat in your hands is what causes a mixture to stick; cooling them down will make the ground beef hold to itself rather than to you. And remember to use a light touch-this helps ensure the beef won't toughen up when cooked.","Preheat oven to 425 degrees. Wash and dry produce. Trim and thinly slice scallions, separating whites from greens; finely chop whites. Peel garlic; finely chop one clove (two cloves for 4 servings). Place remaining cloves in the center of a small piece of foil; cinch into a packet. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces.","In a medium bowl, soak bread with 2 TBSP milk (4 TBSP for 4 servings); break up with your hands until pasty. Stir in beef, scallion whites, chopped garlic, ¼ tsp chipotle powder (½ tsp for 4; you'll use more later), salt (we used ¾ tsp; 1½ tsp for 4), and pepper.","Shape beef mixture into two 1-inch-tall loaves (four loaves for 4 servings). Place meatloaves and garlic foil packet on one side of a baking sheet. Toss carrots on empty side with a large drizzle of oil and a pinch of salt and pepper. (For 4, spread meatloaves and garlic foil packet out across entire sheet and toss carrots on a second sheet.) Roast until meatloaves are almost cooked through, 10 minutes (you'll glaze them then).","dice potatoes into ½-inch pieces. Place in a medium pot with enough salted water to cover by 2 inches. Bring to a boil; cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid; drain and return potatoes to pot. While potatoes cook, in a small bowl, combine 2 TBSP ketchup (4 TBSP for 4 servings) and a pinch of chipotle powder if desired. Once meatloaves have roasted 10 minutes, brush with chipotle ketchup. Return to oven until meatloaves are cooked through, carrots are browned, and garlic is softened, 5-8 minutes more. (If meatloaves are done first, remove from sheet and roast carrots for an additional 5 minutes.).","Cook through this step as instructed. Once veggies are browned and tender, remove from sheet; 2-5 minutes more for broccoli or 1-2 minutes more for green beans.","add cloves, sour cream, and 3 TBSP butter (6 TBSP for 4 servings) to pot with drained potatoes. Mash until smooth, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4) to create a creamy consistency. Season generously with salt and pepper.","Divide meatloaves, mashed potatoes, and roasted carrots between plates. Garnish with scallion greens. (Sprinkle with remaining chipotle powder if you want an extra kick!)."],"image":"images/recipe_0211.webp","source_file":"Chipotle Glazed Meatloaves with Roasted Garlic Mashed Potatoes and Carrots.pdf"},{"id":"1db8589b5a9d","title":"Crispy Beef Bowls with Sweet N Spicy Sauce Carrot Ribbons and Sauteed Zucchini","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Sriracha","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Soy Sauce","amount":6.0,"unit":"unit","quantity_text":"6","aisle":"Pantry"},{"name":"Sesame Oil","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Did you substitute chicken breast strips for ground beef? In step 1, pat chicken dry with paper towels; season with salt and pepper. In step 5, swap in chicken for beef; cook until lightly browned, 4-5 minutes. Increase heat to high; cook until chicken is browned, crisp, and cooked through, 1-2 minutes. Continue with the rest of the recipe as instructed. Add chicken to bowls in step 6.","Why do we tell you to drain the excess grease from your pan in step 5? Removing this extra moisture not only makes your finished dish less greasy, it also helps the beef get that crispy, caramelized texture we're looking for. We call that a win-win!","wash and dry all produce. Trim and thinly slice scallions, separating whites from greens. Quarter lime. Trim and peel carrots. Using a peeler, shave carrots lengthwise into ribbons, rotating as you go, until you get to the core; discard core. Trim and halve zucchini lengthwise; cut crosswise into ¼-inch-thick half-moons. Peel and finely chop garlic and ginger.","Place rice in a fine-mesh sieve and rinse until water runs clear. Add to a small pot along with 1 cup water (2 cups for 4 servings) and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve.","In a small bowl, combine sesame oil, half the soy sauce (you'll use the rest later), 1 TBSP sugar (2 TBSP for 4 servings), and as much sriracha as you'd like (start with half, taste, and add more from there if desired). In a separate small bowl, combine scallion whites, juice from half the lime, and a pinch of salt.","Heat a drizzle of oil in a large pan over medium-high heat. Add carrots and season with salt and pepper. Cook, stirring, until tender, 3-4 minutes. Remove from pan and set aside, covered. Heat another drizzle of oil in same pan over medium-high heat. Add zucchini and season with salt and pepper. Cook, stirring occasionally, until browned and tender, 4-5 minutes. Season with salt and pepper. Set aside with carrots.","Heat another drizzle of oil in same pan over medium-high heat. Add garlic and ginger; cook until fragrant, 30 seconds. Add beef and cook, breaking up meat into pieces, until lightly browned, 3-4 minutes. (If there's excess grease in your pan, pour it out.) Increase heat to high and cook until beef is browned, crisp, and cooked through, 2-3 minutes. Stir in remaining soy sauce and cook until mostly evaporated, 1-2 minutes more. Turn off heat. Taste and season with salt and pepper.","Fluff rice with a fork and divide between bowls. Top with beef, carrots, and zucchini. (For extra presentation points, arrange each ingredient in its own section of the bowl!) Garnish with scallion greens and pickled scallion whites (draining first). Drizzle with as much sauce as you'd like. Serve with remaining lime wedges on the side.","Ground Beef is fully cooked when internal temperature reaches 160 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK41 NJ-89."],"image":"images/recipe_0212.webp","source_file":"Crispy Beef Bowls with Sweet N Spicy Sauce Carrot Ribbons and Sauteed Zucchini.pdf"},{"id":"25e53e02eb26","title":"Cheesy Tex-Mex Beef Tortilla Bake with Black Beans and Corn","category":"Beef","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Corn","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Spice Blend","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Spices"},{"name":"Tomatoes","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cheese Blend","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Dairy & Eggs"}],"instructions":["Planning to enjoy this meal again tomorrow (or the next day)? refrigerate any leftovers, reheat in the microwave until warmed through, and dig in. Your future self will thank you for stocking the fridge with homemade goodness!","If you ordered a 12-serving meal, combine the 4- and 8-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 12 SERVINGS.","Heat a drizzle of oil in a large, heavy-bottomed pot over medium-high heat. Add beef, scallion whites, and garlic; cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. drain any excess grease from pot. Add Tex-Mex paste, stock concentrate, and Southwest Spice Blend; stir to combine.","Adjust rack to middle position and preheat oven to 425 degrees. Wash and dry produce. Trim and thinly slice scallions, separating whites from greens. Peel and finely ch
