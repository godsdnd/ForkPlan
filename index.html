In a large bowl, combine pork, ponzu, ginger, scallion whites, half the panko (all for 4 servings), and remaining garlic. Season generously with salt and pepper. Form into two 1-inch-tall loaves (four loaves for 4).","Place meatloaves on one side of a baking sheet. Toss carrots on empty side with a drizzle of oil, salt, and pepper. Roast on top rack until meatloaves are cooked through and carrots are browned and tender, 20-25 minutes. (For 4 servings, divide between 2 sheets; roast meatloaves on middle rack and carrots on top rack.).","Fluff rice with a fork and stir in 1 TBSP butter; season with salt and pepper. Divide rice, carrots, and meatloaves between plates. Drizzle meatloaves with remaining glaze (warm your glaze in the microwave before serving if you'd like). Garnish with scallion greens, remaining sesame seeds, and a pinch of chili flakes if desired.","in a small bowl, combine sweet soy glaze, 2 TBSP ketchup (4 TBSP for 4 servings), and a pinch of chili flakes to taste. When meatloaves and carrots have 2-3 minutes left, remove sheet from oven. Brush tops of meatloaves with 1 TBSP glaze (save the rest for serving). Return to oven until meatloaves are cooked through and glaze is tacky."],"image":"images/recipe_0238.webp","source_file":"Ponzu Pork Meatloaves with a Korean Chili and Sweet Soy Glaze Garlic Sesame Rice and Roasted Carrots.pdf"},{"id":"42e0e81b27fd","title":"Super shed Burgers with Caramelized Onion Chipotle Aioli and Sweet Potato Wedges","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"optional","aisle":"Other"}],"instructions":["utilize your largest pan and spatula here. You want room to get those patties as thin as possible. Use your hands to hold the spatula in place and press down to flatten. The ultra-crispy results will amaze and delight!","Preheat oven to 450 degrees. Wash and dry produce. Cut sweet potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice onion. Peel and finely chop garlic until you have ¼ tsp (½ tsp for 4 servings). Toss sweet potatoes on a baking sheet with a large drizzle of oil, salt, and pepper. Roast until golden and crispy, 20-25 minutes.","heat a drizzle of oil in a large pan over medium-high heat. Add onion and season with salt and pepper. Cook, stirring, until softened and lightly browned, 8-10 minutes. Add ¼ cup water (⅓ cup for 4 servings) and 1 tsp sugar (2 tsp for 4). Cook, stirring, until caramelized and jammy, 2-3 minutes more. (If onion begins to burn, stir in a splash of water.) Turn off heat; transfer to a small bowl and set aside. Wash out pan.","Heat a drizzle of oil in pan used for onion over medium-high heat. Once pan is very hot, add beef. Firmly flatten each ball with a spatula to create very thin patties. (Don't worry if patties aren't perfectly round-those irregular edges will turn deliciously crispy!) Cook to desired doneness, 3-4 minutes per side. Transfer patties to a plate. Discard any excess grease from pan.","in a second small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings), garlic, a pinch of chipotle powder (taste and add more from there if desired), salt, and pepper. Form beef into two equal-size balls (four for 4); season all over with salt and pepper.","Divide toasted buns between plates; fill with patties, caramelized onion, and chipotle aioli. Serve with sweet potato wedges and, if you've got some, ketchup on the side for dipping.","Halve buns. Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for patties over medium-high heat. Add buns cut sides down; cook until golden brown and toasted, 1-2 minutes."],"image":"images/recipe_0239.webp","source_file":"Super shed Burgers with Caramelized Onion Chipotle Aioli and Sweet Potato Wedges.pdf"},{"id":"80e2332a82af","title":"Spiced Chickpea Rice Bowls with Tomato Cucumber Salad and Creamy Lemon Sauce","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chickpeas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"}],"instructions":["Hey! Just wanted to let you know that it's possible-and totally natural-for chickpeas to pop a bit while they roast. What can you do to help? Pat the chickpeas extra-dry with paper towels after rinsing. You'll be glad you gave them some TLC. The crispy little treasures are worth the effort.","Heat a drizzle of oil in a small pot over medium heat. Add garlic; cook until fragrant, 1 minute. Stir in rice, stock concentrate, 1½ cups water (3 cups for 4 servings), ½ tsp Tunisian Spice Blend (1 tsp for 4; you'll use more in the next step), and 1 tsp salt (2 tsp for 4). Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 16-18 minutes. Keep covered off heat until ready to serve.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Drain and rinse chickpeas; pat dry with paper towels. Halve, peel, and cut onion into ½-inch-thick wedges; finely chop a wedge or two until you have 2 TBSP (4 TBSP for 4 servings). Zest and quarter lemon (for 4, zest one lemon and quarter both). Trim and halve cucumber lengthwise; cut crosswise into ¼-inch-thick half- moons. Dice tomato.","in a small bowl, combine sour cream with juice from two lemon wedges (juice from four wedges for 4 servings). Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt to taste.","toss chickpeas and onion wedges on a baking sheet with a large drizzle of olive oil, 2 tsp Tunisian Spice Blend (4 tsp for 4 servings; measure-we sent more), salt, and pepper. Roast on top rack, stirring halfway through, until chickpeas are crispy and onion wedges are tender, 18-20 minutes.","Fluff rice with a fork; stir in lemon zest and 1 TBSP butter (2 TBSP for 4 servings). Divide rice between bowls and top with roasted chickpeas and onion. Drizzle with as much creamy lemon sauce as you like. Add tomato cucumber salad to one side of each bowl and garnish with remaining cheese.","In a medium bowl, whisk together juice from remaining lemon, 2 tsp olive oil, and ½ tsp sugar. (For 4 servings, use 4 tsp olive oil and 1 tsp sugar.) Stir in chopped onion, cucumber, tomato, and half the cheese (save the rest for serving). Season with salt and pepper to taste."],"image":"images/recipe_0240.webp","source_file":"Spiced Chickpea Rice Bowls with Tomato Cucumber Salad and Creamy Lemon Sauce.pdf"},{"id":"f65f9c86d4dd","title":"Saucy Cumin Lime Chicken Tacos with Pickled Veggies and Zesty Crema","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"¼ tsp","quantity_text":"1¼ tsp","aisle":"Pantry"},{"name":"Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Strips","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["In step 5, we ask you to warm your tortillas in the microwave. If you have a few extra minutes, try charring them over the flames of your gas stove instead for smoky, ~fire-touched~ flavor and a crispier texture. Using tongs and working one at a time, place tortillas directly on the burner until lightly charred on both sides.","Wash and dry produce. Peel and finely chop garlic. Zest and quarter lime (for 4 servings, zest one lime and quarter both). Halve, peel, and thinly slice onion. Thinly slice jalapeño into rounds, removing ribs and seeds for less heat.","In a medium bowl, combine soy sauce, stock concentrate, garlic, cumin, chili powder, juice from half the lime, ¾ tsp sugar (1½ tsp for 4 servings), and a big pinch of salt and pepper. Pat chicken dry with paper towels; add to bowl with marinade and stir to combine. Set aside to marinate, stirring occasionally.","Heat a drizzle of oil in a large pan over medium-high heat. Add remaining onion; cook, stirring, until browned and tender, 5-6 minutes. Add chicken and marinade. Cook, stirring, until chicken is browned and cooked through, 4-6 minutes.","In a small microwave-safe bowl, combine ¼ of the onion, juice from remaining lime, ½ tsp sugar (1 tsp for 4 servings), 1 TBSP water (2 TBSP for 4), salt, and as much jalapeño as you like. Stir until sugar and salt have mostly dissolved. Microwave for 30 seconds; set aside, stirring occasionally, until ready to serve. In a separate small bowl, combine sour cream with lime zest to taste. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Divide tortillas between plates; fill with chicken filling and as many pickled veggies (draining first) as you like. Drizzle with zesty crema."],"image":"images/recipe_0241.webp","source_file":"Saucy Cumin Lime Chicken Tacos with Pickled Veggies and Zesty Crema.pdf"},{"id":"9f0aeff2b3f9","title":"Smoky Garlic Butter Steak with Roasted Bell Pepper Penne","category":"Steak","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Garlic","amount":4.0,"unit":"clove","quantity_text":"4 Cloves","aisle":"Produce"},{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chives","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["Want to know our trick for the crispiest Brussels sprouts? Before popping 'em in the oven, arrange each one cut side down on the baking sheet. The flat sides provide more surface area for browning and caramelization!","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Place sweet potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15- 20 minutes. Drain and set aside. (Keep empty pot handy for step 5.).","Adjust rack to top position and preheat oven to 450 degrees. Cut 2 TBSP butter (4 TBSP for 4 servings) into ½-inch cubes and place in a small microwave-safe bowl; bring to room temperature. Wash and dry produce. Peel and dice sweet potatoes into ½-inch pieces. Trim and halve Brussels sprouts lengthwise.","finely chop chives. Pat steak dry with paper towels and season generously with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add steak and cook to desired doneness, 3-5 minutes per side. Turn off heat; transfer to a cutting board to rest. Tent with foil to keep warm.","toss Brussels sprouts on a baking sheet with a large drizzle of olive oil, salt, and pepper. Peel garlic; place cloves in the center of a small piece of foil. Drizzle with olive oil, season with salt and pepper, and cinch into a packet. Place on same sheet. Roast on top rack until everything is browned and tender, 15-20 minutes. Once garlic is done, open packet and let cloves cool slightly.","Mash roasted garlic cloves with a fork until smooth. Add to bowl with cubed softened butter (if butter is not yet softened, microwave for 5-10 seconds) along with mustard, half the chives, salt, and pepper. (Psst-make sure the garlic has cooled before adding so that the butter doesn't melt!) Slice steak against the grain. Divide steak, Brussels sprouts, and mashed sweet potatoes between plates. Top sweet potatoes with remaining chives and dollop steak with roasted garlic Dijon butter.","Melt 2 TBSP butter (4 TBSP for 4 servings) in pot used for sweet potatoes over medium heat. Cook, stirring, until butter is foamy and flecked with amber brown bits, 1-2 minutes. (Take a whiff-it should smell deliciously nutty!) Return drained sweet potatoes to pot and mash with sour cream until smooth and creamy. Season with salt and pepper."],"image":"images/recipe_0242.webp","source_file":"Smoky Garlic Butter Steak with Roasted Bell Pepper Penne.pdf"},{"id":"13f5ac9dbfee","title":"Roasted Sweet Potato and Edamame Bowls with Garlic Rice Carrot Salad and a Fried Egg","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Mayonnaise","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Can't imagine these bowls without a spicy kick? If you've got some on hand, drizzle your finished dish with Sriracha!","peel and dice sweet potatoes into ½-inch pieces. Toss on one side of a baking sheet with a drizzle of oil, salt, and pepper (for 4 servings, spread out across entire sheet.) Roast on top rack for 12 minutes (you'll add more to the sheet then).","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Heat a drizzle of oil in a small pot over medium-high heat. Add garlic; cook, stirring, until fragrant, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4) and ¼ tsp salt (½ tsp for 4). Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15- 20 minutes. Keep covered off heat until ready to serve.","trim and peel carrot; grate on the largest holes of a box grater. Trim and quarter cucumber lengthwise; slice into ¼-inch-thick pieces. In a medium bowl, combine edamame, soy sauce, and half the chili sauce (you'll use the rest in the next step). Season with salt and pepper to taste. Once sweet potatoes have roasted 12 minutes, remove sheet from oven. add edamame mixture to empty side. (For 4 servings, add edamame mixture to a second baking sheet; roast on middle rack.) Return to top rack until sweet potatoes and edamame are browned and tender, 8-10 minutes more.","Wash out bowl used for edamame mixture. In same bowl, combine carrot, cucumber, half the vinegar (all for 4 servings), ½ tsp sugar (1 tsp for 4), and a big pinch of salt. In a small bowl, combine mayonnaise with remaining chili sauce. Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Fluff rice with fork; season with salt to taste. Divide rice between shallow bowls; arrange sweet potatoes, edamame, and carrot salad on top in separate sections. Top with fried eggs and drizzle with chili mayo.","Heat a drizzle of oil in a medium, preferably nonstick, pan (use a large, preferably nonstick, pan for 4 servings) over medium heat. crack eggs into hot pan and cover. (For 4, you may want to cook eggs in batches.) Fry eggs to preference. Lightly season with salt and pepper.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness.","EPRC_47.95_EP1670A_Roasted Edamame & Sweet Potato Bowls.indd 2 EPRC_47.95_EP1670A_Roasted Edamame & Sweet Potato Bowls.indd 2 11/2/21 3:13 PM 11/2/21 3:13 PM."],"image":"images/recipe_0243.webp","source_file":"Roasted Sweet Potato and Edamame Bowls with Garlic Rice Carrot Salad and a Fried Egg.pdf"},{"id":"00d257bb3c75","title":"Tunisian Spiced Turkey Bowls with Basmati Rice Greek Salad and Lemon Feta Sauce","category":"Turkey","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"with Basmati Rice, Greek Salad & Lemon Feta Sauce","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Produce"}],"instructions":["Have any tender herbs in the back of your fridge (say, some parsley, cilantro, or chives) just begging to be used? We highly recommend chopping up a handful and sprinkling them over your finished bowls!","Wash and dry produce. Peel and finely chop garlic. Halve cucumber crosswise; slice lengthwise into ½-inch-thick planks. Cut planks lengthwise into ½-inch-thick sticks. Halve, peel, and thinly slice ¼ of the onion (half an onion for 4 servings); cut remaining onion into a small dice. Zest lemon until you have 1 tsp (2 tsp for 4); quarter lemon.","In a small pot, combine rice, ¾ cup water (1½ cups for 4 servings), and ½ tsp salt (¾ tsp for 4). Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","In a small bowl, combine cucumber, half the cheese, and as much sliced onion as you like. Toss with a drizzle of olive oil, juice from two lemon wedges (four wedges for 4 servings), and a pinch of salt and pepper. In a second small bowl, combine sour cream, lemon zest, juice from one lemon wedge (two wedges for 4), remaining cheese, and pepper. Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Heat a drizzle of oil in a medium pan (use a large pan for 4 servings) over medium heat. Add turkey, garlic, diced onion, and Tunisian Spice; season with a big pinch of salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. In the last minute of cooking, stir in 1 TBSP water (2 TBSP for 4) and 1 TBSP butter (2 TBSP for 4). Turn off heat and set aside.","Fluff rice with a fork and season with salt and pepper to taste. Divide rice between bowls. Top with turkey and salad. Drizzle with lemon feta sauce. Halve remaining lemon wedge and serve on the side."],"image":"images/recipe_0244.webp","source_file":"Tunisian Spiced Turkey Bowls with Basmati Rice Greek Salad and Lemon Feta Sauce.pdf"},{"id":"4274671787ae","title":"Salisbury Steaks with Herb Mashed Potates and Buttered Carrots","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Carrots","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ranch Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"}],"instructions":["Why do we ask you to cut your carrots on a diagonal in step 1? The sharp angles of these “bias cuts” (in chefspeak) won't make the veggies taste any different, but they do make for a striking, restaurant-style presentation. Pinkies up!","Wash and dry produce. Dice potatoes into ½-inch pieces. Halve, peel, and thinly slice half the onion (all for 4 servings); finely dice a few slices until you have 1 TBSP (2 TBSP for 4). Peel and finely chop garlic. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces.","Place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, about 10 minutes. Reserve ¼ cup potato cooking liquid (½ cup for 4 servings); drain and return potatoes to pot. Mash with sour cream, ¼ tsp Ranch Spice (½ tsp for 4), and 1 TBSP butter (2 TBSP for 4) until smooth and creamy, adding splashes of reserved potato cooking liquid. Season with salt and pepper. Keep covered off heat until ready to serve.","Form beef mixture into four ½-inch-thick patties (eight patties for 4 servings). Heat a drizzle of oil in a large pan over medium- high heat. Add patties and cook until browned, 2-3 minutes per side (they'll finish cooking in the next step). Turn off heat; transfer patties and their juices to a plate.","in a medium bowl, combine soy sauce, half the panko, one of the stock concentrates, and 2 TBSP water. (For 4 servings, use all the panko, two of the stock concentrates, and 4 TBSP water.) Add beef, diced onion, ¼ tsp Ranch Spice (½ tsp for 4; measure-we sent more), salt, and pepper. Mix to combine.","place carrots and ¼ cup water (½ cup for 4 servings) in a medium microwave-safe bowl. Cover bowl with plastic wrap and microwave until tender, 4 minutes; uncover and drain. Stir in 1 TBSP butter (2 TBSP for 4) until melted; season with salt and pepper. Divide patties, mashed potatoes, and carrots between plates. Spoon gravy over patties.","Melt 1 TBSP butter (2 TBSP for 4 servings) in same pan over medium heat. Add sliced onion; cook, stirring, until softened and translucent, 2-3 minutes. Add garlic; cook, stirring, until fragrant, 30 seconds. Stir in remaining stock concentrate, 1 TBSP flour (2 TBSP for 4), and 1 cup water (2 cups for 4). Season with salt and pepper. Bring to a simmer and return patties and their juices to pan. Cook until patties are cooked through and gravy has thickened, 3-4 minutes.","Swap in green beans or broccoli for carrots; microwave 1-2 minutes for green beans or 2-3 minutes for broccoli."],"image":"images/recipe_0245.webp","source_file":"Salisbury Steaks with Herb Mashed Potates and Buttered Carrots.pdf"},{"id":"c410644d7b95","title":"Tomato Cream Chicken Linguine with Italian Herbs and Parmesan","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["You may notice that we pretty much always ask you to reserve a bit of pasta cooking water before draining your pasta. Wondering what makes this cloudy water so darn special? It's salty and starchy, and those magical starches help emulsify your sauce (aka turn it silky smooth). Basically, it makes good pasta great, and we'd never leave you with a bowl full of just good.","Heat a drizzle of olive oil in a large pan over medium-high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Turn off heat; transfer to a plate. Wipe out pan.","Bring a large pot of salted water to a boil. Wash and dry produce. Dice tomatoes. Peel and finely chop garlic. Pat chicken dry with paper towels; season all over with Italian Seasoning, salt, and pepper.","add pasta to pot. Cook until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water, then drain.","melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for chicken over medium-high heat. Add garlic and cook until fragrant, 30 seconds. Stir in tomatoes, ¼ cup plain water (⅓ cup for 4), and a big pinch of salt. Bring to a simmer and cook, stirring occasionally, until tomatoes are broken down and saucy and liquid has mostly reduced, 6-8 minutes. Stir in cream cheese until melted, then reduce heat to low. Season with salt and pepper.","Add drained pasta, chicken, and 1 TBSP butter (2 TBSP for 4 servings) to pan. Toss until butter has melted and everything is thoroughly coated in sauce, 1-2 minutes. If needed, add splashes of reserved pasta cooking water. Season with salt and pepper. Divide pasta between bowls and top with Parmesan."],"image":"images/recipe_0246.webp","source_file":"Tomato Cream Chicken Linguine with Italian Herbs and Parmesan.pdf"},{"id":"4b6cb096f8d8","title":"Steak Au Poivre with Crispy Potatoes and Roasted Asparagus","category":"Steak","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Peppercorns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Asparagus","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Ready to *raise the STEAKS* (see what we did there?) with tonight's dinner? If you look closely, you'll see that your steak naturally has lines running through it. In order to ensure maximum tenderness, we want you to slice perpendicular to those lines, aka against the grain. It'll only take a second to do and will make the end result ten bajillion times better (scientific fact).","trim and discard bottom 1 inch from asparagus. Halve, peel, and thinly slice shallot. Thinly slice chives. Pat steak dry with paper towels; season all over with salt and crushed peppercorns (we used 1 tsp crushed peppercorns; 2 tsp for 4 servings-you'll use more later.).","Adjust racks to top and middle positions and preheat oven to 450 degrees. Wash and dry produce. Crush peppercorns in their bag with a rolling pin or heavy-bottomed pan. Dice potatoes into ½-inch pieces; toss on a baking sheet with a drizzle of oil, salt, and a big pinch of crushed peppercorns. Roast on top rack, tossing halfway through, until golden brown and crispy, 20-25 minutes (you'll roast the asparagus after 10 minutes).","heat a drizzle of oil in a large pan over medium-high heat. Add steak and cook to desired doneness, 3-5 minutes per side. Turn off heat; transfer to a cutting board to rest. Wash out pan.","toss asparagus on a second baking sheet with a drizzle of oil, salt, and pepper. Roast on middle rack until tender, 10-12 minutes.","Slice steak against the grain; divide between plates along with potatoes and asparagus. Drizzle steak with sauce and sprinkle with remaining chives.","Heat a drizzle of oil in same pan over medium-high heat. Add shallot; cook until softened, 2-3 minutes. Stir in stock concentrate and ¼ cup water (⅓ cup for 4 servings); simmer until slightly thickened, 2-3 minutes. Remove pan from heat, then stir in sour cream, half the chives, and 1 TBSP butter (2 TBSP for 4). Season generously with crushed peppercorns."],"image":"images/recipe_0247.webp","source_file":"Steak Au Poivre with Crispy Potatoes and Roasted Asparagus.pdf"},{"id":"303298bc063a","title":"Pork and Pineapple Tacos with Pickled Veggies and Garlic Lime Crema","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pineapple Cup","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ground Pork","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["If you have a few extra minutes, ditch the microwave in step 4 and try charring your tortillas over the flames of your gas stove! This'll give 'em smoky, fire-touched flavor and a crispier texture. Using tongs and working one at a time, place tortillas directly on the burner until lightly charred on both sides.","Wash and dry produce. Zest and quarter lime. Peel and finely chop garlic. Thinly slice half the jalapeño (whole jalapeño for 4 servings) into rounds, removing ribs and seeds for less heat. Halve, peel, and thinly slice onion. Drain pineapple (psst-save the juice for adding to cocktails or smoothies).","In a small bowl, combine sour cream, 1 TBSP water (2 TBSP for 4 servings), a squeeze of lime juice, a pinch of garlic, salt, pepper, and as much lime zest as you like. In a separate small bowl, combine sliced jalapeño, ⅓ cup onion (⅔ cup for 4), ½ tsp sugar (1 tsp for 4), a squeeze of lime juice, and a pinch of salt and pepper. Set aside to pickle, stirring occasionally.","Heat a large drizzle of oil in a large pan over medium-high heat. Add remaining onion and a pinch of salt and pepper. Cook, stirring, until softened, 4-5 minutes. Add pork, Southwest Spice, and another pinch of salt and pepper. Cook, breaking up meat into pieces, until pork is browned and cooked through, 4-6 minutes. Stir in pineapple and remaining garlic. Cook until browned and fragrant, 1 minute more. Turn off heat.","Rinse shrimp under cold water, then pat dry with paper towels. cook through this step as instructed, swapping in shrimp for pork; cook, stirring occasionally, until opaque and cooked through, 3-4 minutes.","Divide tortillas between plates; fill with pork filling and as many pickled veggies (draining first) as you like. Drizzle with garlic lime crema. Serve with remaining lime wedges on the side.","Ground Pork is fully cooked when internal temperature reaches 160 degrees. Shrimp are fully cooked when internal temperature reaches 145 degrees.","EPRC_3.89_EP1159 / EP1159APU12_PORK & PINEAPPLE TACOS.indd 2 EPRC_3.89_EP1159 / EP1159APU12_PORK & PINEAPPLE TACOS.indd 2 12/28/21 2:50 PM 12/28/21 2:50 PM."],"image":"images/recipe_0248.webp","source_file":"Pork and Pineapple Tacos with Pickled Veggies and Garlic Lime Crema.pdf"},{"id":"4590e55f0762","title":"One Pot Pork Sausage and Kale Pasta with Creamy Garlic Sauce","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"}],"instructions":["Hey, EP friend! Did you substitute chicken sausage mix for pork sausage? Cook through the recipe as instructed, swapping in chicken sausage for pork sausage in steps 3 and 6. In step 1, there's no need to remove and discard casing-our chicken sausage mix has none! In step 3, cook the sausage for 4-6 minutes.","Craving a pop of acidity and/or a spicy kick with your pasta? Add a squeeze of lemon juice or a sprinkle of chili flakes (OR BOTH!) just before serving.","add pasta to pot. Cook until al dente, 7-9 minutes. Reserve 1 cup pasta cooking water, then drain.","Bring a medium pot of salted water to a boil. Wash and dry produce. Remove sausage from casing; discard casing. Remove and discard any large stems from kale; cut into bite-size pieces, if necessary. Peel and finely chop garlic.","heat a drizzle of oil in empty pot over medium-high heat. Add sausage and cook, breaking up meat into pieces, until browned and cooked through, 4-5 minutes. Add kale and another drizzle of oil; season with salt and pepper. Cook, stirring, until tender, 4-5 minutes, adding splashes of plain water to help kale soften. Transfer to a plate and set aside. Let pot cool slightly off heat.","Melt 1 TBSP butter (2 TBSP for 4 servings) in same pot over medium-high heat. Add garlic and cook until fragrant, 30 seconds. Add 1 TBSP flour (2 TBSP for 4); whisk constantly until lightly browned, 1 minute. Whisk in ¾ cup plain water (1 cup for 4) until fully incorporated. Bring to a simmer, then stir in cream cheese and half the Parmesan (save the rest for serving) until combined and thickened, scraping up any browned bits from bottom of pot. Season generously with salt and pepper.","Stir in pasta, sausage, and kale; toss until everything is thoroughly coated in a creamy sauce, adding splashes of reserved pasta cooking water. Taste and season with salt and pepper. Divide between bowls and top with remaining Parmesan.","Pork Sausage is fully cooked when internal temperature reaches 160 degrees. Chicken Sausage is fully cooked when internal temperature reaches 165 degrees. WK35 NJ-91.","91 One-Pot Pork Sausage & Kale Pasta_NJ.indd 2 35.91 One-Pot Pork Sausage & Kale Pasta_NJ.indd 2 8/4/20 2:09 PM 8/4/20 2:09 PM."],"image":"images/recipe_0249.webp","source_file":"One Pot Pork Sausage and Kale Pasta with Creamy Garlic Sauce.pdf"},{"id":"34b2289e1a13","title":"Sriracha Apricot Pork Chops with Green Beans and Garlic Rice","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Apricot Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Green Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Give it a rest! (The cooked pork, that is.) When you let your pork stand after cooking (as you will in Step 3), you're giving it time to distribute all of that juicy goodness evenly throughout the meat. The reward? Extra-juicy pork chops.","Preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium heat. Add half the garlic; cook until fragrant, 30 seconds. Add rice; stir to coat. Stir in 1¼ cups water (2¼ cups for 4) and a big pinch of salt. Bring to a boil. Once boiling, cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","trim green beans (if necessary). Zest and quarter lime. Pat pork dry with paper towels and season all over with salt and pepper. Toss green beans on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 12-15 minutes.","Heat a drizzle of oil in a large pan over medium heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Turn off heat; transfer to a plate to rest.","Let pan used for pork cool slightly, then return to medium-high heat. Add remaining garlic and cook until fragrant, 30 seconds. Add soy sauce and ¼ cup water (⅓ cup for 4 servings). Let simmer until reduced, 2-3 minutes. Stir in jam, Sriracha, 1 TBSP butter (2 TBSP for 4), and a squeeze of lime juice to taste. If necessary, simmer over low heat until mixture is thick and glossy. Add pork and turn to coat.","Fluff rice with a fork; stir in lime zest. Divide rice, green beans, and pork between plates. Spoon any remaining sauce over pork. Serve with remaining lime wedges on the side."],"image":"images/recipe_0250.webp","source_file":"Sriracha Apricot Pork Chops with Green Beans and Garlic Rice.pdf"},{"id":"88326e84dd62","title":"Sweet and Sticky Soy Pork Meatloaves with Sesame Broccoli Shingled Potatoes and Horseradish Mayo","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Brown Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Other"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ponzu","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 5, we instruct you to spread the tops of your meatloaves with the soy glaze. We prefer to use a basting brush for the job, but if you don't have one, use the back of a spoon and some artistry to evenly coat!","Wash and dry produce. Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Slice potatoes into ¼-inch-thick rounds. Cut broccoli into bite- size pieces.","In a large bowl, toss potatoes with a large drizzle of oil and a couple big pinches of salt and pepper until thoroughly coated. Add potatoes to one side of a baking sheet in a single overlapping layer (for 4 servings, spread potatoes out across entire sheet; shingle, not stack, the potatoes in a single layer so they're barely overlapping-this helps them cook evenly!). Roast on top rack for 10 minutes (you'll add more to the baking sheet then).","In bowl used for potatoes, gently combine pork, ponzu, scallion whites, garlic, chopped ginger, half the panko, 2 TBSP ketchup, ½ tsp salt, and a pinch of pepper (for 4 servings, use all the panko, 4 TBSP ketchup, and 1 tsp salt). Form into two 1-inch-tall loaves (four loaves for 4). In a small bowl, combine soy sauce, 3 TBSP ketchup, and 1 TBSP brown sugar (for 4, use 6 TBSP ketchup and 2 TBSP brown sugar; if you don't have brown sugar, swap in 1 tsp white sugar for 2 servings, 2 tsp for 4).","trim and thinly slice scallions, separating whites from greens; finely chop whites. Peel and finely chop garlic. Peel and finely chop half the ginger (all for 4 servings).","In bowl used for glaze, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with horseradish paste to taste. Divide meatloaves, potatoes, and broccoli between plates. Drizzle potatoes with horseradish mayo. Garnish potatoes and meatloaves with scallion greens.","toss broccoli on empty side of same sheet with a drizzle of oil, salt, and pepper. Nestle meatloaves among broccoli and brush the tops with soy glaze. Sprinkle meatloaves and broccoli with sesame seeds. Return to oven until veggies are browned and tender and meatloaves are cooked through, 18-20 minutes. Wash out bowl used for glaze. (For 4 servings, toss broccoli and glaze meatloaves on a second sheet; roast on middle rack.).","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0251.webp","source_file":"Sweet and Sticky Soy Pork Meatloaves with Sesame Broccoli Shingled Potatoes and Horseradish Mayo.pdf"},{"id":"95bcdca71ca2","title":"Turkish Chicken and Rice Bowls with Tomato Cucumber Salad and Creamy Lemon Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Basmati Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.25,"unit":"tsp","quantity_text":"¼ tsp","aisle":"Pantry"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"with Tomato Cucumber Salad & Creamy Lemon Sauce","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Dairy & Eggs"}],"instructions":["Look-we know that you (like so many of us) have limited kitchen space. That's why we'll never tell you that you MUST purchase something like a digital scale in order to be successful with our recipes. We do recommend a microplane for zesting the lemon in step 2, however. It's the best tool for the job!","Peel and finely chop garlic. Heat a drizzle of oil in a small pot over medium-high heat. Add half the garlic and cook, stirring, until fragrant, 30 seconds. Stir in rice, ¾ cup water (1½ cups for 4 servings), and a big pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","wash and dry produce. Cut tomato into a small dice. Trim and quarter cucumber lengthwise; thinly slice crosswise. Zest and quarter lemon (for 4 servings, zest one lemon and quarter both).","In a medium bowl, combine tomato, cucumber, half the lemon zest, ¼ tsp sugar (½ tsp for 4 servings), a drizzle of olive oil, salt, pepper, and a big squeeze of lemon juice to taste. Set aside to marinate, stirring occasionally. In a small bowl, combine sour cream, juice from one lemon wedge (two wedges for 4), remaining lemon zest, salt, and pepper. Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Pat chicken dry with paper towels; place in a large bowl. Stir in Turkish Spice, paprika, remaining garlic, juice from two lemon wedges (four wedges for 4 servings), a large drizzle of olive oil, a big pinch of salt, and pepper. Set aside to marinate.","Fluff rice with a fork. (For an extra-rich experience, stir in 1 TBSP butter.) Season with salt and pepper. Divide rice between bowls. Top with chicken and tomato cucumber salad. Drizzle chicken with creamy lemon sauce.","Heat a drizzle of oil in a large pan over medium-high heat. Add marinated chicken in a single layer; cook, stirring occasionally, until browned and cooked through, 4-6 minutes."],"image":"images/recipe_0252.webp","source_file":"Turkish Chicken and Rice Bowls with Tomato Cucumber Salad and Creamy Lemon Sauce.pdf"},{"id":"4546cfd21822","title":"Philly Cheesesteak Pasta Skillet with Green Pepper and Onion","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"}],"instructions":["Can't imagine cheesesteak without a spicy kick? If you've got some on hand, drizzle your finished skillet with hot sauce!","Wash and dry produce. Halve, core, and thinly slice half the green pepper (whole pepper for 4 servings) into strips. Halve, peel, and thinly slice onion. Peel and thinly slice garlic.","Heat a drizzle of oil in a large pan over medium-high heat. Add green pepper and onion; cook, stirring occasionally, until veggies begin to soften, 4-5 minutes.","Stir pasta, stock concentrates, and 2½ cups water (4½ cups for 4 servings) into pan with beef and veggies. Bring to a boil, then cover and reduce to a low simmer. Cook, stirring occasionally, until pasta is al dente and liquid is reduced and saucy, 9-11 minutes. (Add a splash of water if pan becomes too dry.).","Add beef and garlic to pan with veggies. Season generously with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add 1 TBSP flour (2 TBSP for 4 servings); stir to coat.","Reduce heat to low. Sprinkle skillet with remaining pepper jack and cover until cheese melts, 1-2 minutes more. Serve straight from skillet.","Stir in cream cheese, half the pepper jack, and 1 TBSP butter (2 TBSP for 4 servings) until smooth and creamy. Season with salt and pepper to taste. If you've got some on hand, add a pinch of chili flakes from your pantry if desired."],"image":"images/recipe_0253.webp","source_file":"Philly Cheesesteak Pasta Skillet with Green Pepper and Onion.pdf"},{"id":"f09b058ccdd1","title":"Peanut Chicken Stir-Fry Bowls with Garlic Rice and Pickled Veggie Salad","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Strips","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"½ tsp","quantity_text":"1½ tsp","aisle":"Pantry"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Peanut Butter","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Why are we always telling you to pat your chicken dry? Well, since you asked, drying protein with paper towels ensures even browning rather than steaming. Crispy, caramelized edges = major flavor!","Wash and dry produce. Peel and finely chop or grate garlic. Heat a drizzle of oil in a small pot over medium-high heat. Add half the garlic; cook, stirring, until fragrant, 30 seconds. Stir in rice and 1¼ cups water (2¼ cups for 4 servings). Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","quarter lime. In a large bowl, whisk together ponzu, soy sauce, chili sauce, half the peanut butter, a big squeeze of lime juice, and 1 tsp sugar (2 tsp for 4 servings). (Taste the sauce and add more peanut butter if you'd like!) Season with salt. Add a splash of water if sauce is too thick- it should be pourable.","Pat chicken dry with paper towels. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken and season generously with salt and pepper. Cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes. Add remaining garlic; cook, stirring, until fragrant, 30 seconds. Turn off heat.","Trim, peel, and grate carrot on the largest holes of a box grater. Trim and halve cucumber lengthwise; thinly slice crosswise into half-moons. In a small bowl, combine carrot, cucumber, juice from remaining lime wedges, and ½ tsp sugar (1 tsp for 4 servings). Season with salt and pepper.","Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings). Season with salt and pepper. Divide between shallow bowls or plates; top with chicken stir-fry and any remaining sauce from bowl. Add pickled veggie salad (draining first if necessary) next to chicken.","transfer chicken mixture to bowl with peanut sauce; stir until chicken is thoroughly coated. If sauce is too thick, stir in a splash of water."],"image":"images/recipe_0254.webp","source_file":"Peanut Chicken Stir-Fry Bowls with Garlic Rice and Pickled Veggie Salad.pdf"},{"id":"169834ab821f","title":"Tunisian Spiced Chicken with Creamy Garlic Sauce Roasted Carrots and Scallions Couscous","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Olive Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Why add sour cream to your marinade in Step 1? Unlike vinegar-based marinades, which can actually toughen meat before they tenderize, dairy-based marinades can lock in flavor in a flash and help promote deliciously crisp-tender crusts. Winner-winner chicken dinner!","Preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Zest and quarter lemon. Pat chicken dry with paper towels; season all over with salt and pepper. In a medium bowl, combine Tunisian Spice Blend, half the garlic, 1 TBSP sour cream, 1 TBSP olive oil, 1 tsp salt, a squeeze of lemon juice, and pepper (use 2 TBSP sour cream, 2 TBSP olive oil, and 2 tsp salt for 4 servings). Add chicken and turn to coat. Set aside to marinate, turning occasionally (you'll cook the chicken in Step 5).","Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Trim and thinly slice scallions, separating whites from greens. Toss carrots on a baking sheet with a drizzle of olive oil, salt, and a pinch of chili flakes from your pantry if desired. Roast on top rack until golden brown and tender, 20-25 minutes.","Trim green beans if necessary or cut broccoli into bite-size pieces. Swap in green beans or broccoli for carrots; roast 12- 15 minutes for green beans or 15-20 minutes for broccoli.","Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add scallion whites, couscous, and a pinch of salt; cook, stirring, until couscous is toasted, 1-2 minutes. Stir in stock concentrate and ¾ cup water (1½ cups for 4). Bring to a boil, then cover and reduce heat to low. Cook until couscous is tender, 6-8 minutes. Keep covered off heat until ready to serve.","in a small bowl, combine half the scallion greens, remaining sour cream, a pinch of lemon zest, and remaining garlic to taste. Season with salt and pepper. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency.","Fluff couscous with a fork; season with salt, pepper, and lemon zest to taste. Divide chicken, couscous, and carrots between plates. Spoon sauce over chicken and top with remaining scallion greens; sprinkle with chili flakes if desired. Serve with remaining lemon wedges on the side.","Heat a drizzle of olive oil in a large, preferably nonstick, pan over medium heat. Add chicken (allow excess marinade to drip off first) and cook until browned and cooked through, 6-8 minutes per side. (Lower heat if chicken begins to brown too quickly!) Transfer chicken to a cutting board to rest, 1-2 minutes. Once cool enough to handle, thinly slice crosswise."],"image":"images/recipe_0255.webp","source_file":"Tunisian Spiced Chicken with Creamy Garlic Sauce Roasted Carrots and Scallions Couscous.pdf"},{"id":"d63080f0cdbe","title":"Mushroom and Bean Quesdillas with Pepper Jack Pickled Jalapenos and Sour Cream","category":"Veggie","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Want to take your sour cream to the next level? Stir in a squeeze of lime juice along with a pinch of lime zest for a tangy, zesty crema!","Wash and dry produce. Trim and thinly slice mushrooms. Drain and rinse beans. Thinly slice jalapeño into rounds, removing ribs and seeds for less heat. Zest and quarter lime. Finely chop tomato.","Heat a drizzle of oil and 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium heat. Add mushrooms and cook, stirring constantly, until golden brown, 3-4 minutes. Add beans, half the paprika (all for 4), ¼ cup water (½ cup for 4) and a big pinch of salt. Bring to a simmer and cook, stirring occasionally, until water has evaporated and beans are warmed through, 2-3 minutes. Turn off heat; transfer to a medium bowl. Wipe out pan.","Pat diced steak dry with paper towels. Heat a drizzle of oil in a large pan over high heat. Once pan is hot, add steak and season with salt and pepper. Cook, stirring occasionally, until browned and cooked to desired doneness, 2-3 minutes. Turn off heat; transfer to a plate. Wipe out pan.","Place tortillas on a clean work surface. Evenly sprinkle one half of each tortilla with half the cheese. Top with mushroom and bean filling and tomato, then sprinkle with remaining cheese. Fold tortillas in half to create quesadillas.","In a small microwave-safe bowl, combine jalapeño, juice from half the lime, 1 tsp sugar (2 tsp for 4 servings), 1 TBSP water (2 TBSP for 4), and a pinch of lime zest. Microwave for 30 seconds; set aside to pickle, stirring occasionally.","Cut quesadillas into thirds and divide between plates. Serve with pickled jalapeño (draining first), sour cream, and remaining lime wedges on the side.","Melt 1 TBSP butter in pan used for beans over medium heat. (For 4 servings, you may need to work in batches, using 1 TBSP butter for each batch.) Add quesadillas and cook until tortillas are golden brown and cheese melts, 3-5 minutes per side.","EPRC_13.96_EP1756A / EP1756APA06 _MUSHROOM & BEAN QUESADILLAS.indd 2 EPRC_13.96_EP1756A / EP1756APA06 _MUSHROOM & BEAN QUESADILLAS.indd 2 3/8/22 4:12 PM 3/8/22 4:12 PM."],"image":"images/recipe_0256.webp","source_file":"Mushroom and Bean Quesdillas with Pepper Jack Pickled Jalapenos and Sour Cream.pdf"},{"id":"579830145918","title":"Southwest Beef and Black Bean Chili with Sour Cream","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Spice","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Spices"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["The key to the dreamiest chili EVER? Salt and pepper! (We're serious!) Keep a tasting spoon (aka a regular old spoon) handy so you can sample your chili as you cook, seasoning as you go to make sure it's totally customized to your personal preference.","Heat a large drizzle of oil in a medium pot (use a large pot for 4 servings) over medium-high heat. Add onion; season with salt and pepper. Cook, stirring, until softened, 5-7 minutes.","Stir half the Tex-Mex paste (all for 4 servings) into pot with beef mixture. Cook, stirring, until combined and slightly darkened, 1-2 minutes. Stir in beans and their liquid, stock concentrate, ¼ cup water (½ cup water for 4), and 1 TBSP ketchup (2 TBSP for 4). Season generously with salt and pepper. Bring to a simmer and cook until mixture has thickened and beef is cooked through, 8-10 minutes. Turn off heat. Taste and season with salt and pepper.","Add beef to pot with onion; season generously with salt and pepper. Cook, breaking up meat into pieces, until browned, 4-5 minutes (it'll finish cooking in the next step). Add garlic and Southwest Spice; cook, stirring, until fragrant, 30-60 seconds.","EPRC_12.89_EP1565E_SOUTHWEST BEEF & BLACK BEAN CHILI.indd 2 EPRC_12.89_EP1565E_SOUTHWEST BEEF & BLACK BEAN CHILI.indd 2 3/1/22 3:11 PM 3/1/22 3:11 PM."],"image":"images/recipe_0257.webp","source_file":"Southwest Beef and Black Bean Chili with Sour Cream.pdf"},{"id":"1dce8b43ac97","title":"Molto Mozzarella Pork Burgers with Creamy Marinara and Potato Wedges","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["When forming your patties in Step 3, be gentle and try not to overwork the meat. Using a light touch when flattening and shaping will make for juicy and tender results!","Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast on middle rack for 20 minutes (you'll add more to the sheet then). Combine half the garlic, 1 TBSP butter (2 TBSP for 4 servings), and ¼ tsp Italian Seasoning (½ tsp for 4; you'll use more later) in a small microwave-safe bowl; microwave until melted, 30 seconds. Set garlic butter aside.","Adjust rack to middle position and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Peel and finely chop garlic. Halve buns.","Swap in broccoli or green beans for potatoes. Roast until browned and tender, 15-20 minutes for broccoli or 12- 15 minutes for green beans.","Heat a drizzle of oil in a large pan over medium-high heat. Add patties and cook until browned and cooked through, 4-5 minutes per side. In the last 2 minutes of cooking, top patties with cheese; cover to melt cheese. Remove from heat.","In a medium bowl, combine pork, remaining garlic, 2¾ tsp Italian Seasoning, ¾ tsp salt, and pepper (5½ tsp Italian Seasoning and 1½ tsp salt for 4 servings). (Add a pinch of chili flakes here if you like things spicy!) Form pork mixture into two ½-inch-thick patties (four patties for 4), each slightly wider than a burger bun.","Evenly spread bottom buns with as much creamy marinara as you like; top with patties and top buns. Divide burgers and potatoes between plates and serve with any remaining sauce on the side for dipping.","Brush cut sides of buns with garlic butter. Once potatoes have roasted for 20 minutes, remove sheet from oven. Push potatoes to one side of sheet; place buns, cut sides up, on empty side of sheet. Return to middle rack until potatoes are browned and crispy and buns are toasted, 3-5 minutes more. Meanwhile, in a medium bowl, combine marinara, 1 TBSP mayonnaise, and 1 TBSP ketchup (2 TBSP mayonnaise and 2 TBSP ketchup for 4 servings). Season with salt and pepper."],"image":"images/recipe_0258.webp","source_file":"Molto Mozzarella Pork Burgers with Creamy Marinara and Potato Wedges.pdf"},{"id":"dd1b29741c2b","title":"Pepper Jack Shroom Quesadillas with Caramelized Onion Lime Crema and Spicy Pico","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper Jack","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"}],"instructions":["Psst-wanna know our secret to perfect pico? Taste it! In Step 5, try the salsa before adding any jalapeño, then stir in a small sprinkle and taste again. If you love spicy food, you can always add more!","Wash and dry produce. Trim and thinly slice mushrooms (skip if your mushrooms are pre-sliced!). Zest and quarter lime. Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Dice tomato. Finely chop jalapeño, removing ribs and seeds for less heat.","Heat a drizzle of oil in a large pan over medium-high heat. Add mushrooms and season with salt and pepper. Cook, stirring, until browned and tender, 5-7 minutes. (If mushrooms begin to brown too quickly, lower that heat!) Transfer to a plate and set aside. (Keep empty pan handy for Step 4.).","Heat a drizzle of oil in pan used for mushrooms over medium- high heat. Add sliced onion and season with salt and pepper. Cook, stirring, until softened and lightly browned, 8-10 minutes. Add ¼ cup water (⅓ cup for 4 servings) and 1 tsp sugar (2 tsp for 4). Cook, stirring, until onion is caramelized and jammy, 2-3 minutes more. Turn off heat; transfer to plate with mushrooms. Wash out pan.","in a small bowl, combine sour cream, lime zest, and a squeeze of lime juice to taste. Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Pat chicken dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in pan used for veggies over medium-high heat. Add chicken in a single layer; cook, stirring occasionally, until cooked through, 4-6 minutes. Turn off heat; transfer to plate with veggies. Wash out pan.","Evenly sprinkle one half of each tortilla with cheese, then top with veggies; fold tortillas in half to create quesadillas. Heat a drizzle of oil in pan used for onion over medium heat. Add quesadillas and cook until tortillas are browned and cheese melts, 3-5 minutes per side. (For 4 servings, you may need to work in batches, using a drizzle of oil for each batch.) Cut into wedges, divide between plates, and serve with lime crema and spicy pico.","in a second small bowl, combine tomato, chopped onion, juice from remaining lime wedges, and as much chopped jalapeño as you like. Season with salt and pepper."],"image":"images/recipe_0259.webp","source_file":"Pepper Jack Shroom Quesadillas with Caramelized Onion Lime Crema and Spicy Pico.pdf"},{"id":"e791a2f9bc4e","title":"Sweet Potato and Onion Tacos with Pepper Jack Pico de Gallo and Lime Crema","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["In step 4, we instruct you to warm your tortillas in the microwave. If you have a few extra minutes, try charring them over the flames of your gas stove instead for smoky, ~fire-touched~ flavor and a crispier texture. Using tongs and working one at a time, place tortillas directly on the burner until lightly charred on both sides.","Preheat oven to 425 degrees. Wash and dry produce. Cut sweet potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Core, deseed, and thinly slice jalapeño.","Toss sweet potatoes on one side of a baking sheet with a drizzle of oil, half the Southwest Spice, salt, and pepper. Toss sliced onion and jalapeño on empty side with a drizzle of oil, remaining Southwest Spice, salt, and pepper. (For 4 servings, divide everything between 2 sheets.) Roast until everything is browned and tender, 20-25 minutes. (Keep an eye out-jalapeño and onion may finish before sweet potatoes. If so, remove from sheet and continue roasting sweet potatoes.).","wrap tortillas in damp paper towels and microwave until warm and pliable, 30 seconds.","dice tomato. Finely chop cilantro. Quarter lime. In a small bowl, combine chopped onion, tomato, cilantro, and a squeeze of lime juice to taste. Season with salt and pepper. In a separate small bowl, combine sour cream with a squeeze of lime juice to taste. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken in a single layer; cook, stirring occasionally, until browned and cooked through, 4-6 minutes.","Divide tortillas between plates. Fill with roasted sweet potato wedges, jalapeño, and onion. Top with cheese, pico de gallo, and lime crema. Serve with any remaining lime wedges on the side.","EPRC_12.95_EP1529B / EP1529BPA05_SWEET POTATO & ONION TACOS.indd 2 EPRC_12.95_EP1529B / EP1529BPA05_SWEET POTATO & ONION TACOS.indd 2 3/1/22 3:28 PM 3/1/22 3:28 PM."],"image":"images/recipe_0260.webp","source_file":"Sweet Potato and Onion Tacos with Pepper Jack Pico de Gallo and Lime Crema.pdf"},{"id":"ab2fbb64bdc5","title":"Street Cart Chicken Sausage Wraps with Cucumber Salad and Tzatziki Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Mini Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mayonnaise","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Our Turkish Spice Blend is a warming, earthy mix of cumin, garlic powder, coriander, allspice, and a touch of chili flakes. Sensitive to heat? Add a little less of the spice blend in Step 3.","Wash and dry produce. Trim and dice half the cucumber into ¼-inch pieces; grate remaining cucumber over a medium bowl on the large holes of a box grater. Zest and quarter lemon (for 4 servings, zest one lemon and quarter both). Peel and finely chop garlic. Dice tomato into ¼-inch pieces. Halve, peel, and dice onion into ¼-inch pieces.","To bowl with grated cucumber, add sour cream, 3 TBSP mayonnaise (6 TBSP for 4 servings), a squeeze of lemon juice, a pinch of garlic, salt, and pepper; set tzatziki sauce aside. In a second medium bowl, combine diced cucumber, tomato, and 2 TBSP onion (4 TBSP for 4); add Greek vinaigrette, a pinch of lemon zest, salt, and pepper and toss to coat.","Heat a drizzle of oil in a large pan over medium-high heat. Add sausage, Turkish Spice Blend, remaining onion, and remaining garlic. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Remove from heat; stir in a squeeze of lemon juice.","Halve wraps diagonally and divide between plates. Serve with remaining tzatziki sauce, remaining lemon wedges, and any remaining cucumber salad on the side.","Lay tortillas on a cutting board. Spread 2 TBSP tzatziki sauce on the bottom half of each tortilla. Fill bottom half with sausage mixture and as much cucumber salad as you like. Fold up bottom side of each tortilla over filling, then fold over left and right sides toward filling. Roll up tortilla, starting with filled sides, to form wraps. (Don't worry if you have trouble fitting all the salad-it's just as tasty on the side!)."],"image":"images/recipe_0261.webp","source_file":"Street Cart Chicken Sausage Wraps with Cucumber Salad and Tzatziki Sauce.pdf"},{"id":"baeffe6f88cc","title":"Tuscan Herbed Chicken over Creamy Tomato Linguine","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["You may notice that we almost always ask you to reserve a bit of pasta cooking water. Wondering what makes this cloudy water so darn special? It's salty and starchy, and those magical starches help make your sauce silky smooth. Basically, it makes good pasta great, and we'll never leave you with a bowl full of just good.","Bring a large pot of salted water to a boil. Wash and dry produce. Peel garlic; thinly slice two cloves (four cloves for 4 servings) and finely chop remaining clove (two cloves for 4). Dice tomato.","Place chicken in a medium bowl; pat dry with paper towels. Add a large drizzle of olive oil, chopped garlic, half the Tuscan Heat Spice (you'll use the rest later), salt, and pepper; turn chicken to thoroughly coat. Set aside. Once water is boiling, add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water (1 cup for 4 servings), then drain.","Melt 2 TBSP butter (4 TBSP for 4 servings) in same pan over medium heat. Add sliced garlic; cook, stirring, until fragrant, 1 minute. Add tomato, remaining Tuscan Heat Spice, salt, and pepper. Cook, stirring, until softened, 2-3 minutes.","heat a drizzle of olive oil in a large pan over medium heat. Add chicken; cook until browned and cooked through, 6-8 minutes per side. (If chicken begins to brown too quickly, lower the heat!) Turn off heat; transfer chicken to a cutting board. Once cool enough to handle, thinly slice crosswise.","Stir cream cheese, half the Parmesan (save the rest for serving), and half the reserved pasta cooking water into pan with tomato mixture. Bring to a simmer, then stir in drained pasta. (If needed, stir in more reserved pasta cooking water a splash at a time until pasta is coated in a creamy sauce.) Turn off heat; taste and season with salt and pepper."],"image":"images/recipe_0262.webp","source_file":"Tuscan Herbed Chicken over Creamy Tomato Linguine.pdf"},{"id":"39d1b945cdc5","title":"Tangy Teriyaki Meatball Bowls with Rice Pickled Veggies and Spicy Mayo","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"White Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Soy Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Cornstarch","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Brown Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["To peel ginger, break out a spoon! Using the spoon's tip, apply pressure in a downward motion, carving away the skin. Unlike a vegetable peeler, the mighty spoon allows you to get into ginger's knobby nooks. The more you know!","Combine rice, 1¼ cups water (2½ cups for 4 servings), and a big pinch of salt in a small pot. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","Adjust rack to middle position and preheat oven to 450 degrees. Wash and d
