antity_text":"2","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In Step 2, you'll be making a panade, a mixture of a starch and a liquid-here, we're using torn baguette pieces and milk. This easy trick helps keep your meatballs moist and tender. *The more you know!*.","halve baguettes; gently tear small pieces of bread from center of baguettes until you have ¼ cup (½ cup for 4 servings). In a medium bowl, soak torn bread pieces with 2 TBSP milk (4 TBSP for 4); stir until broken up and pasty. Add sausage, chopped onion, remaining garlic powder, ¾ tsp salt (1½ tsp for 4), and pepper. (Add a pinch of chili flakes here if you like things spicy!) Form into 6 1-inch meatballs (12 meatballs for 4).","Adjust racks to middle and top positions; preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Core, deseed, and thinly slice green pepper crosswise. Peel and finely chop garlic. Toss potatoes on one side of a baking sheet with a drizzle of oil, half the garlic powder, salt, and pepper (spread across entire sheet for 4). Roast on middle rack for 10 minutes (you'll add more to the sheet then).","Trim green beans if necessary. Swap in green beans for potatoes but skip roasting (you'll roast in Step 3). Cut broccoli into bite-size pieces. Swap in broccoli for potatoes; roast for 5 minutes (you'll add more to the sheet then).","place meatballs on empty side of sheet. Roast until meatballs are golden brown and cooked through and potatoes are browned, 14-16 minutes more. (For 4 servings, leave potatoes roasting; add meatballs to a second sheet and roast on top rack.) Transfer meatballs and potatoes to a plate; cover to keep warm. wipe off any excess grease from sheet if needed.","heat a drizzle of oil in a large pan over medium- high heat. Add sliced onion and green pepper; season with salt and pepper. Cook, stirring, until browned and tender, 4-6 minutes. Remove from heat.","Add meatballs to opposite side of sheet from seasoned green beans; roast as instructed. Once broccoli has roasted 5 minutes, add meatballs to opposite side of sheet; roast as instructed.","In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) and half the garlic. Add 2 TBSP butter (4 TBSP for 4) and remaining garlic to a separate small microwave-safe bowl; microwave until melted, 1-2 minutes. Brush cut sides of baguettes with garlic butter; arrange, cut sides up, on baking sheet used for meatballs. Bake on top rack until golden brown, 3-5 minutes.","fill bottom halves of baguettes with 3 meatballs each; top with as much pepper and onion as you like. Sprinkle cheese over top. Bake filled baguette halves on top rack until cheese is melted and bubbly, 2-3 minutes. Meanwhile, evenly brush top halves of baguettes with garlic aioli. Remove filled baguette halves from oven; top with top baguette halves. Divide meatball subs and roasted potatoes between plates. If you've got some on hand, serve with ketchup on the side for dipping."],"image":"images/recipe_0165.webp","source_file":"Italian Pork Sausage Meatball Subs with Sauteed Pepper and Onion Mozzarella and Roasted Potatoes.pdf"},{"id":"c5424e59c947","title":"Creamy Tomato Chicken Sausage Cavatappi with Roasted Garlic and Bell Pepper","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"}],"instructions":["How do you know if your pasta water is salty enough? Taste it! (We're serious.) Because your cooking water is the only chance you have to season the pasta itself, it's super important to treat it like you would any other ingredient. The water should taste about as salty as the ocean!","Drizzle each bell pepper half with oil and season with salt and pepper; rub to evenly coat. Place bell pepper halves, cut sides down, on a lightly oiled baking sheet. Place garlic clove in the center of a small piece of foil; drizzle with oil and season with salt and pepper. Cinch into a packet and place on same sheet. Roast on middle rack until bell pepper is lightly charred and garlic is softened, 18-22 minutes.","Adjust rack to middle position and preheat oven to 425 degrees. Bring a large pot of salted water to a boil. Wash and dry produce. Halve bell pepper; remove stem and seeds. Peel garlic.","heat a drizzle of oil in a large pan over medium-high heat. Add sausage and cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add tomato paste, garlic powder, and, if you've got some on hand, a pinch of chili flakes from your pantry if desired; stir to coat. Add ½ cup reserved pasta cooking water (¾ cup for 4 servings). Cook, stirring, until thickened, 2-3 minutes more.","add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve 1 cup pasta cooking water (2 cups for 4 servings), then drain.","Return pan with sausage mixture to low heat. Stir in drained pasta, bell pepper strips, mashed garlic, cream sauce base, and 2 TBSP butter (4 TBSP for 4 servings). If needed, stir in more reserved pasta cooking water a splash at a time until pasta is coated in a creamy sauce. Season with salt and pepper. Divide pasta between bowls and serve.","transfer bell pepper and garlic packet to a cutting board. Once cool enough to handle, thinly slice bell pepper into strips. Remove garlic from foil packet; mash with a fork to form a paste."],"image":"images/recipe_0166.webp","source_file":"Creamy Tomato Chicken Sausage Cavatappi with Roasted Garlic and Bell Pepper.pdf"},{"id":"5b01d00ef833","title":"Loaded Baked Potato Chowder with Bacon Cheddar and Jalapeno","category":"Bacon","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Milk","amount":1.0,"unit":"cup","quantity_text":"1 Cup","aisle":"Dairy & Eggs"}],"instructions":["In Step 5, we recommend mashing the potatoes until almost smooth. Feel free to take this advice or kick it to the curb. In our humble opinion, potato pieces add a nice chunky texture-but a silky smooth chowder is delicious, too! It's all based on preference, so you do you.","Wash and dry produce. Halve, peel, and cut onion into a small dice. Peel and finely chop garlic. Dice potatoes into ½-inch pieces. Finely chop jalapeño until you have 1 TBSP (2 TBSP for 4 servings), removing ribs and seeds for less heat.","Melt 2 TBSP butter (4 TBSP for 4 servings) in a medium pot over medium-high heat. Add onion and garlic; season with salt and pepper. Cook, stirring, until softened, 4-5 minutes. Add 1 TBSP flour (2 TBSP for 4); cook, stirring, until lightly browned, 1 minute.","place bacon in a single layer in a large dry pan over medium heat. Cook, flipping occasionally, until crispy, 8-12 minutes. Turn off heat; transfer to a paper-towel-lined plate. Once cool enough to handle, finely chop.","Slowly stir 1 cup milk (2 cups for 4 servings) into pot a small splash at a time until fully incorporated. Stir in 1½ cups water (2½ cups for 4). Add potatoes and stock concentrate; season generously with salt and pepper. Bring to a boil and cook, stirring occasionally, until potatoes are very tender, 10-12 minutes. (To test, pierce one piece with a fork-it should go through easily!).","Divide chowder between bowls; top with sour cream, remaining chopped bacon, remaining cheese, and as much chopped jalapeño as you like.","reduce heat to low and mash to desired consistency. (We recommend mashing until almost smooth, with some small potato pieces still in there. Hello, texture!) Stir in half the chopped bacon and half the cheese (save the rest of each for serving). Season generously with salt and pepper. (If chowder seems too thick, stir in a splash of warm water.)."],"image":"images/recipe_0167.webp","source_file":"Loaded Baked Potato Chowder with Bacon Cheddar and Jalapeno.pdf"},{"id":"f02e1f03d456","title":"Creamy Mushroom and Pea Cavatappi with Lemon","category":"Veggie","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Base","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Have any fresh herbs in the back of your fridge-say some parsley or chives-just begging to be used? We highly recommend chopping up a handful and sprinkling over your finished dish!","Bring a large pot of salted water to a boil. Wash and dry produce. Trim and thinly slice mushrooms (skip this step if your mushrooms are pre-sliced!). Zest and quarter lemon.","Pat chicken or steak dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken or steak in a single layer; cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes, or until steak is cooked to desired doneness, 3-5 minutes. Turn off heat; transfer to a plate. Wipe out pan.","Stir drained pasta, 1 TBSP butter (2 TBSP for 4 servings), and a squeeze of lemon juice into same pan with sauce until butter is melted and pasta is coated. (If butter isn't melting, return pan to low heat.) Taste and season with salt and pepper.","heat a large drizzle of oil in a large pan over medium-high heat. Add mushrooms and season with salt and pepper. Cook, stirring occasionally, until browned and tender, 5-7 minutes. Reduce heat to low; stir in peas and cook until warmed through, 1-2 minutes. Stir in cream sauce base, stock concentrates, and garlic powder; bring to a simmer and cook until thickened, 1-2 minutes more. Remove from heat.","Divide pasta between bowls and sprinkle with lemon zest to taste. Serve with remaining lemon wedges on the side."],"image":"images/recipe_0168.webp","source_file":"Creamy Mushroom and Pea Cavatappi with Lemon.pdf"},{"id":"b74ff4820745","title":"Honey Garlic Chicken with Brown Butter Mashed Potatoes and Roasted Zucchini","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Garlic","amount":4.0,"unit":"clove","quantity_text":"4 Cloves","aisle":"Produce"},{"name":"Honey","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Why are we always telling you to pat your meat dry? Well, since you asked, drying protein with paper towels ensures even browning rather than steaming. Crispy, caramelized edges = major flavor!","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry all produce. Peel and dice sweet potatoes into ½-inch pieces. Trim and halve zucchini lengthwise; cut crosswise into ½-inch-thick half-moons. Peel garlic; place cloves in the center of a small piece of foil. Add a large drizzle of olive oil and season with salt and pepper. Cinch into a packet.","Place sweet potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15-20 minutes. Drain and set aside. Return empty pot to medium-high heat; add 2 TBSP butter (4 TBSP for 4 servings). Cook, stirring, until foamy and flecked with amber brown bits, about 2 minutes. (Take a whiff-it should smell nutty!) Add drained sweet potatoes; mash until smooth and creamy, stirring in a splash of water if necessary. Season with salt and pepper.","pat chicken dry with paper towels; season all over with salt and pepper. Heat a drizzle of olive oil in a large pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. Turn off heat; transfer to a plate. Wipe out pan. While chicken cooks, in a small bowl, combine honey, stock concentrate, soy sauce, and ¼ cup water (⅓ cup for 4 servings).","toss zucchini on a baking sheet with a drizzle of olive oil, salt, and pepper. Place garlic foil packet on same sheet. Roast on top rack until zucchini and garlic are browned and tender, 15-20 minutes. Transfer roasted garlic to a cutting board.","Swap in asparagus or green beans for zucchini; roast until browned and tender, 10-12 minutes for asparagus or 12-15 minutes for green beans. Transfer to a plate and cover to keep warm. Continue to roast garlic until tender, 5-8 minutes more.","Return chicken to pan with sauce and turn to coat. Divide chicken between plates along with zucchini and mashed sweet potatoes. Top chicken with any remaining sauce and sprinkle with chili flakes if desired.","mash cloves with a fork. Heat pan used for chicken over medium-high heat. Add mashed garlic and honey soy mixture. Bring to a simmer and cook, stirring, until slightly reduced, 2-3 minutes. Turn off heat and stir in 1 TBSP butter (2 TBSP for 4 servings) until melted. (If sauce seems too thick, stir in a splash of water.)."],"image":"images/recipe_0169.webp","source_file":"Honey Garlic Chicken with Brown Butter Mashed Potatoes and Roasted Zucchini.pdf"},{"id":"b5e382339804","title":"Chicken Sausage and Tomato Soup with Couscous and Parmesan","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Sausage Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 1, we instruct you to use any remaining onion however you'd like. You may be wondering, “What the heck can I do with a chunk of leftover onion?!” Glad you asked! Whip up an onion dip, use it in a pico de gallo, or caramelize some to throw in a sandwich. We love upcycling.","Wash and dry produce. Halve, peel, and finely chop onion until you have ¾ cup (1½ cups for 4 servings; use the rest however you'd like). Peel and finely chop garlic. Dice tomato.","Heat a drizzle of oil in a large pot over medium-high heat. Add chopped onion and season with salt and pepper. Cook, stirring, until softened, 4-5 minutes. Add sausage, garlic, and oregano. Cook, breaking up meat into pieces, until sausage is browned and cooked through, 4-6 minutes.","Bring soup to a boil, then stir in couscous. Cook, stirring often, until couscous is al dente, 8-10 minutes. (If soup gets too thick, add a splash or two of water!) Taste and season with salt and pepper.","Add diced tomato and tomato paste to pot with sausage mixture. Cook, stirring, until diced tomato is slightly broken down, 2-3 minutes. Stir in 2½ cups water (4 cups for 4 servings), stock concentrates, and plenty of salt and pepper.","Divide soup between bowls and sprinkle with cheese. (Have any fresh herbs like basil or parsley on hand? Chop 'em up and add on top.)."],"image":"images/recipe_0170.webp","source_file":"Chicken Sausage and Tomato Soup with Couscous and Parmesan.pdf"},{"id":"978a0d3abaef","title":"French Dipped Chopped Beef Sandwhiches with Gouda Potato Wedges and Monterey Jack","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Gouda Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Bread","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome potato wedges? Raid your spice cabinet-we especially love garlic powder, onion powder, or cayenne pepper (or a combo of all three!)-and sprinkle a pinch over your spuds before roasting in step 1.","Wash and dry produce. Bring 2 TBSP butter (4 TBSP for 4 servings) to room temperature. Cut potatoes into ½-inch- thick wedges. Toss on a baking sheet with a drizzle of oil; season generously with salt and pepper. Roast until browned and tender, 20-25 minutes.","halve, peel, and finely dice half the onion (whole onion for 4 servings). Strip thyme leaves from stems; roughly chop leaves until you have 2 tsp (4 tsp for 4). Peel and finely chop garlic.","toast bread; spread one side of each slice with softened butter. Once beef is cooked through, reduce heat to medium. Top beef mixture with cheese. Cover and cook until cheese melts, 1-2 minutes. Turn off heat. Using a slotted spoon, top half the bread slices, buttered sides up, with beef mixture; close sandwiches. Wipe out pan.","Heat a drizzle of oil and 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium-high heat. Add onion and cook, stirring, until softened, 2-3 minutes. Add beef, half the thyme, half the garlic, ¾ tsp salt (1½ tsp for 4), and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes.","Melt 1 TBSP butter (2 TBSP for 4 servings) in same pan over medium-low heat. Add remaining thyme and remaining garlic; cook, stirring, until fragrant, 30 seconds. Add ¼ cup water (½ cup for 4) and stock concentrate. Bring to a simmer; cook, stirring, until warmed through, 30 seconds.","EPRC_38.89_EP3416A / EP3416ASS03_FRENCH DIP CHOPPED BEEF SANDWICHES.indd 2 EPRC_38.89_EP3416A / EP3416ASS03_FRENCH DIP CHOPPED BEEF SANDWICHES.indd 2 8/30/22 4:38 PM 8/30/22 4:38 PM."],"image":"images/recipe_0171.webp","source_file":"French Dipped Chopped Beef Sandwhiches with Gouda Potato Wedges and Monterey Jack.pdf"},{"id":"d63e712b3d13","title":"Lemon Panko Pork Chops with Oven Fries and Zesty Garlic Butter Peas","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["If you don't have a large zip-close bag, mix the panko on a plate in step 4. Instead of shaking everything together, press the sour-cream-coated pork chops into the crumby mix until fully coated.","Toss potatoes on a baking sheet with a drizzle of oil, half the Fry Seasoning (you'll use the rest later), salt, and pepper. Roast on top rack until browned and tender, 20-25 minutes.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry all produce. Peel and finely chop garlic. Zest and quarter lemon (for 4 servings, zest 1 lemon and quarter both). Cut potatoes into ½-inch-thick wedges. In a small bowl, combine mayo, a pinch of garlic, and a pinch of lemon zest to taste. Season with salt and pepper.","Place pork between two large pieces of plastic wrap. Pound with a mallet or heavy-bottomed pan until about ⅓ inch thick. In a large zip-close bag, combine panko, up to half the remaining lemon zest, remaining Fry Seasoning, and 1 tsp salt (2 tsp for 4 servings). Place sour cream in a large bowl; add pork and turn to evenly coat. Place sour-cream-coated pork into bag with panko mixture and seal to close. Shake until pork is evenly coated. (It's okay if not all the panko sticks.).","place 1 tsp garlic (2 tsp for 4 servings) and 1 TBSP butter (2 TBSP for 4) in a medium microwave-safe bowl; microwave until butter has melted, 30 seconds. Stir in peas and season with salt and pepper. Set aside.","microwave bowl with buttery peas until warmed through, 1-2 minutes. Stir in remaining lemon zest and a squeeze of lemon juice to taste. Taste and season with salt. Divide pork, peas, and oven fries between plates. Serve with garlic mayo for dipping. Serve remaining lemon wedges on the side.","Heat a ⅓-inch layer of oil in a large pan over medium-high heat. Once oil is hot enough that a pinch of panko mixture sizzles when added to the pan, add coated pork. Cook until golden brown and cooked through, 3-6 minutes per side. (Lower heat if pork begins to brown too quickly.) Transfer to a paper-towel-lined plate. Season with salt.","Pork is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK21-84.","EPRC_21.84_EP1557A / EP1557APS02_Lemon Panko Pork Chops.indd 2 EPRC_21.84_EP1557A / EP1557APS02_Lemon Panko Pork Chops.indd 2 5/4/21 10:02 AM 5/4/21 10:02 AM."],"image":"images/recipe_0172.webp","source_file":"Lemon Panko Pork Chops with Oven Fries and Zesty Garlic Butter Peas.pdf"},{"id":"52238ce53be4","title":"Chorizo Potato and Pepper Hash with Smoky Red Pepper Crema and a Fried Egg","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Sweet Potato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Dried Chorizo","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cumin","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Pepper Crema","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Produce"}],"instructions":["Don't be intimidated by dried chorizo's tough exterior-this Spanish-style pork sausage is dry cured to intensify its smoky, paprika-laced flavor (and to make it ready-to-eat straight out of the package)! You might spy it out in the wild on cheese boards, but here it's sautéed to crispy perfection to lend its pepperoni-like texture and savory seasoning to potato and pepper hash.","halve chorizo lengthwise; slice crosswise into ¼-inch-thick half-moons. Halve, peel, and dice onion into ½-inch pieces. Core, deseed, and dice bell pepper into ½-inch pieces. Peel and finely chop garlic.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Dice sweet potato and Yukon Gold potatoes into ½-inch pieces. Toss on a baking sheet with a drizzle of oil, half the paprika (save the rest for another use), salt, and pepper. Roast on top rack, tossing halfway through, until tender and crisped, 20-25 minutes.","Heat a drizzle of oil in a medium, preferably nonstick, pan over medium-high heat. Once hot, crack eggs into pan and cover. (For 4 servings, you may want to cook eggs in batches.) Fry eggs to preference. Season with salt and pepper.","Heat a drizzle of oil in a large pan over medium-high heat. Add chorizo, onion, and bell pepper; season with salt and pepper. Cook, stirring occasionally, until chorizo is lightly browned and veggies are softened, 5-6 minutes. Stir in stock concentrate, cumin, and garlic. Cook, stirring frequently, 30 seconds. add roasted potatoes; cook, stirring occasionally, until potatoes are warmed through, 3-4 minutes more. Season with salt (we used ¼ tsp) and pepper. Remove pan from heat.","Add steak to pan along with roasted potatoes. Cook, stirring, until browned and cooked to desired doneness, 3-4 minutes.","EPRC_40.90_EP1642A / EP1642APS06_Chorizo, Potato & Pepper Hash.indd 2 EPRC_40.90_EP1642A / EP1642APS06_Chorizo, Potato & Pepper Hash.indd 2 9/14/21 12:41 PM 9/14/21 12:41 PM."],"image":"images/recipe_0173.webp","source_file":"Chorizo Potato and Pepper Hash with Smoky Red Pepper Crema and a Fried Egg.pdf"},{"id":"44d6fdea202e","title":"Creamy Chicken Sausage and Kale Soup with Potatoes Onion and Italian Seasoning","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Have any fresh herbs in the back of your fridge-say some basil or parsley-just begging to be used? We highly recommend chopping up a handful and sprinkling over your finished soup!","Bring cream cheese to room temperature. Wash and dry produce. Halve, peel, and dice half the onion (whole onion for 4 servings) into ¼-inch pieces. Peel and finely chop garlic. Cut potatoes into small dice. Remove and discard any large stems from half the kale (all for 4); roughly chop into bite-size pieces if needed.","Heat a drizzle of oil in a large pot over medium-high heat. Once pot is hot, add sausage; cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add onion and garlic; cook, stirring, until fragrant, 2 minutes.","Add kale to pot and cook, stirring occasionally, until kale begins to wilt and soup has thickened, 8-10 minutes. While kale cooks, in a small bowl, whisk together sour cream and cream cheese until smooth. Stir sour cream mixture into soup until combined. Taste and season with salt.","Stir stock concentrate, potatoes, half the Italian Seasoning, 5 cups water, and ¾ tsp salt (for 4 servings use all the Italian Seasoning, 7 cups water, and 1½ tsp salt) into pot with sausage mixture. Reduce heat to medium and cook, stirring occasionally, until potatoes are tender and liquid has slightly reduced, 15-18 minutes. Once potatoes are tender, mash with a potato masher or fork (this will help thicken your soup!).","EPRC_8.86_EP1724A_CREAMY CHICKEN SAUSAGE & KALE SOUP.indd 2 EPRC_8.86_EP1724A_CREAMY CHICKEN SAUSAGE & KALE SOUP.indd 2 2/1/22 3:52 PM 2/1/22 3:52 PM."],"image":"images/recipe_0174.webp","source_file":"Creamy Chicken Sausage and Kale Soup with Potatoes Onion and Italian Seasoning.pdf"},{"id":"c8e970c9fe16","title":"Cuban Beef Bowls with Yellow Rice plus Pico de Gallo and Lime Crema","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Turmeric","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["If you only used half the onion in step 2, you may be wondering, “What the heck can I do with a chunk of leftover onion?!” Glad you asked! Caramelize thin slices to top sandwiches, whip up an onion dip, or finely dice it for guac. We LOVE upcycling.","Wash and dry produce. Peel and finely chop or grate garlic. Place rice in a fine-mesh sieve and rinse until water runs clear. Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add half the garlic; cook, stirring, until fragrant, 30 seconds. Stir in rice, half the turmeric, 1 cup water, 1 tsp Southwest Spice, and a big pinch of salt. (For 4, use all the turmeric, 2 cups water, and 2 tsp Southwest Spice; you'll use the rest of the Southwest Spice later.) Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve. Taste and season generously with salt.","finely dice tomato. Halve, peel, and finely dice half the onion (all for 4 servings). Zest and quarter lime (for 4, zest one lime and quarter both). In a small bowl, combine tomato, 2 TBSP diced onion (4 TBSP for 4), juice from half the lime (whole lime for 4), and a pinch of salt and pepper. In a separate small bowl, combine sour cream with a squeeze of lime juice and a pinch of lime zest. (Like things spicy? Stir in some hot sauce if you've got some on hand!) Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt.","Add stock concentrate, half the tomato paste (all for 4 servings), ¼ cup water (½ cup for 4), and a pinch of pepper to pan with beef mixture. Cook, stirring occasionally, until liquid has reduced, 2-3 minutes. Turn off heat and add a squeeze of lime juice. Taste and season with salt and pepper.","Heat a drizzle of oil in a large pan over medium-high heat. Add remaining diced onion and cook, stirring often, until softened, 2-3 minutes. Add beef, remaining Southwest Spice, remaining garlic, and ½ tsp salt (¾ tsp for 4 servings). Cook, breaking up meat into pieces, until browned, 2-3 minutes. (If there's excess grease in your pan, pour it out.).","Pat steak dry with paper towels; thinly slice against the grain. Swap in steak for beef and cook, stirring occasionally, until browned and cooked to desired doneness, 2-3 minutes. (No need to break up meat into pieces.).","Divide rice between bowls. Top with beef mixture and pico de gallo. Drizzle with crema and serve with any remaining lime wedges on the side.","Ground Beef is fully cooked when internal temperature reaches 160 degrees. Steak is fully cooked when internal temperature reaches 145 degrees.","EPRC_3.84_EP1721A / EP1721APU16_CUBAN BEEF BOWLS WITH YELLOW RICE.indd 2 EPRC_3.84_EP1721A / EP1721APU16_CUBAN BEEF BOWLS WITH YELLOW RICE.indd 2 12/28/21 2:39 PM 12/28/21 2:39 PM."],"image":"images/recipe_0175.webp","source_file":"Cuban Beef Bowls with Yellow Rice plus Pico de Gallo and Lime Crema.pdf"},{"id":"020af86a5ebd","title":"Creamy Smothered Pork Chops with Roasted Broccoli and Mashed Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":0.5,"unit":"tbsp","quantity_text":"½ TBSP","aisle":"Pantry"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Ever wonder why we ask you to separate the white parts of scallions from the green ones? Well, the whites are super-oniony and take better to cooking, while the green tops make for a fresh topping or mix-in.","Preheat oven to 425 degrees. Wash and dry produce. Cut broccoli into bite-size pieces. Dice potatoes into ½-inch pieces.","Toss broccoli on a baking sheet with a drizzle of oil and a pinch of salt and pepper. Roast until browned and tender, 15-20 minutes. Meanwhile, place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until softened, 10-12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot.","halve, peel, and thinly slice onion. Trim and thinly slice scallions, separating whites from greens. Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for pork over medium-high heat. Add onion, scallion whites, and a pinch of salt and pepper. If you've got some on hand, add a pinch of chili flakes from your pantry if desired. Cook, stirring, until lightly browned and softened, 5-6 minutes. Add ½ TBSP flour (1 TBSP for 4); cook, stirring, 1 minute.","pat pork dry with paper towels and season all over with half the Fry Seasoning (all for 4 servings), salt, and pepper. Heat a drizzle of oil in a large pan over medium- high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Turn off heat; transfer to a plate to rest. Wipe out pan.","Mash drained potatoes with 3 TBSP butter (6 TBSP for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4). Taste and season generously with salt and pepper. Divide broccoli, mashed potatoes, and pork between plates. Top pork and mashed potatoes with gravy and sprinkle with scallion greens.","Gradually stir stock concentrate and ½ cup plain water (1 cup for 4 servings) into pan until fully incorporated. Bring to a boil and cook until thickened, 1-2 minutes. Remove from heat. Stir in sour cream until melted and combined. Taste and season gravy with pepper. (If gravy is very thick, stir in a splash of water-it should be pourable.)."],"image":"images/recipe_0176.webp","source_file":"Creamy Smothered Pork Chops with Roasted Broccoli and Mashed Potatoes.pdf"},{"id":"9fdf418a8f45","title":"Firehouse Veggie Flatbreads with Spicy Garlic Sauce","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Flatbreads","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ranch Dressing","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["In step 5, you'll be making a roux (aka a flour-thickened sauce). This classic culinary technique is our secret to a luxuriously smooth and creamy sauce. Once the butter melts, make sure to whisk in the flour until thoroughly combined, then slowly whisk in the water until no lumps remain.","Toss green pepper on a baking sheet with a drizzle of oil and half the Frank's Seasoning (you'll use the rest later). Season with salt and pepper. Roast on top rack until softened and lightly browned, 8-10 minutes.","Adjust racks to top and middle positions and preheat oven to 450 degrees. Wash and dry produce. Halve, core, and slice green pepper into ½-inch-thick strips. Halve, peel, and thinly slice onion. Peel and finely chop garlic.","melt 1 TBSP butter in a large pan over medium- high heat. Add onion and season with salt and pepper. Cook, stirring, until softened and lightly browned, 8-10 minutes. Add ¼ cup water and 1 tsp sugar (⅓ cup water and 2 tsp sugar for 4 servings). Cook, stirring, until onion is caramelized and jammy, 2-3 minutes more. Turn off heat; transfer to a small bowl and set aside. Wash out pan.","rub tops of flatbreads with a large drizzle of oil. Place on a second baking sheet. Toast flatbreads on middle rack of oven until golden and crispy at the edges, 7-10 minutes.","Evenly top toasted flatbreads with spicy garlic sauce, roasted green pepper, caramelized onion, and mozzarella. Return flatbreads to oven until cheese melts, 5-8 minutes. Quarter flatbreads and divide between plates. Drizzle with ranch dressing to taste.","Melt 1 TBSP butter (2 TBSP for 4 servings) in same pan over medium heat. Add garlic; cook until fragrant, 30 seconds. Add 1 TBSP flour (2 TBSP for 4) and remaining Frank's Seasoning; whisk constantly until lightly browned, 30 seconds. Reduce heat to medium low; whisk in ½ cup water (1 cup for 4) and cream cheese until melted and combined. Season with salt and pepper to taste. Simmer until thickened, 1-2 minutes. Remove pan from heat and stir in as much Frank's Hot Sauce as you'd like."],"image":"images/recipe_0177.webp","source_file":"Firehouse Veggie Flatbreads with Spicy Garlic Sauce.pdf"},{"id":"1fd18a32335a","title":"Hoisin Pork Sloppy Joes with Pickled Slaw and Potato Wedges","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Black Pepper","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Soy Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Hoisin Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome potato wedges? Raid your spice cabinet-we especially love garlic powder, onion powder, or cayenne pepper (or a combo of all 3!)-and sprinkle a pinch over your spuds before roasting in Step 2.","Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until browned and crispy, 20- 25 minutes. Remove from sheet.","Adjust rack to top position and preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Trim, peel, and grate carrot on the largest holes of a box grater. Trim and halve cucumber lengthwise; thinly slice crosswise into half-moons. Zest and halve lime. Peel and finely chop garlic.","Heat a drizzle of oil in a large pan over medium-high heat. Add pork; cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add garlic; cook, stirring, until fragrant, 1 minute. Season with salt and pepper. Meanwhile, halve buns. Place on sheet used for potatoes; toast in oven until golden brown, 3-5 minutes.","in a small bowl, combine carrot, cucumber, lime zest, juice from whole lime, 1 tsp sugar (2 tsp for 4 servings), and a pinch of salt. Set aside to quick-pickle. In a separate small bowl, combine soy sauce, hoisin, ¼ cup ketchup (½ cup for 4), ¼ cup water (⅓ cup for 4), and as much Sriracha as you'd like.","Stir hoisin mixture into pan with pork. Bring to a simmer and cook until sauce has thickened, 2-3 minutes. Turn off heat and stir in 1 TBSP butter (2 TBSP for 4 servings). Divide buns between plates and fill with pork mixture and slaw. Serve with potato wedges on the side.","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°.","EPRC_50.99_EP1313E / EP1313EPS01_HOISIN PORK SLOPPY JOES.indd 2 EPRC_50.99_EP1313E / EP1313EPS01_HOISIN PORK SLOPPY JOES.indd 2 11/22/22 4:38 PM 11/22/22 4:38 PM."],"image":"images/recipe_0178.webp","source_file":"Hoisin Pork Sloppy Joes with Pickled Slaw and Potato Wedges.pdf"},{"id":"d6f324e63053","title":"Chicken in a Creamy Dijon Pan Sauce with Mashed Sweet Potatoes and Bacon-Studded Brussels Sprouts","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Want to know our trick for the crispiest Brussels sprouts? Before popping 'em in the oven, arrange each one cut side down on the baking sheet. (The flat sides provide more surface area for browning and caramelization!) Pro.","Place sweet potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15-20 minutes. Reserve ½ cup potato cooking liquid, then drain and return sweet potatoes to pot.","Preheat oven to 450 degrees. Wash and dry all produce. Peel and dice sweet potatoes into ½-inch pieces. Trim and halve Brussels sprouts lengthwise. Peel and finely chop garlic.","toss Brussels sprouts on one side of a baking sheet with a drizzle of oil, salt, and pepper. (Line sheet with foil first for easy cleanup!) Add bacon in a single layer to empty side. (For 4 servings, divide sprouts and bacon between 2 sheets.) Roast until Brussels sprouts are browned and tender and bacon is crisp, 15-20 minutes. Transfer bacon to a cutting board. (Keep an eye out-bacon may finish before sprouts. If so, remove from sheet and continue roasting sprouts.).","pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. Turn off heat; transfer to cutting board with bacon. Wash out pan.","Heat a drizzle of oil in same pan over medium heat. Add garlic; cook until fragrant, 30 seconds. Stir in stock concentrate and 2 TBSP water (3 TBSP for 4 servings). Remove pan from heat to cool slightly, then stir in sour cream, mustard, and 1 TBSP butter (2 TBSP for 4) until melted and combined. Season with pepper. (If sauce is too thick, stir in a splash more water.).","Mash sweet potatoes with 2 TBSP butter until smooth, adding splashes of reserved potato cooking liquid. Season with salt and pepper. (If you like your sweet potatoes extra-sweet, add a bit of brown sugar, honey, or maple syrup.) Thinly slice chicken crosswise. Roughly chop bacon. Divide chicken, Brussels sprouts, and mashed sweet potatoes between plates. Top chicken with sauce and Brussels sprouts with bacon.","Bacon is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK11-85.","EPRC_11.85_EP1435_Chicken in a Creamy Dijon Pan Sauce.indd 2 EPRC_11.85_EP1435_Chicken in a Creamy Dijon Pan Sauce.indd 2 2/23/21 11:00 AM 2/23/21 11:00 AM."],"image":"images/recipe_0179.webp","source_file":"Chicken in a Creamy Dijon Pan Sauce with Mashed Sweet Potatoes and Bacon-Studded Brussels Sprouts.pdf"},{"id":"a0f0c0991715","title":"Creamy Smothered Pork Chops with Roasted Carrots and Mashed Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Black Pepper","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":0.5,"unit":"tbsp","quantity_text":"½ TBSP","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["scrape the bottom of your pan with a wooden spoon or spatula in steps 4 and 5! The browned bits left over from the pork chops (aka the fond) will give your gravy a huge flavor boost.","Preheat oven to 425 degrees. Wash and dry produce. Trim, peel, and cut carrots on a diagonal into ¾-inch-thick pieces. Dice potatoes into ½-inch pieces.","Toss carrots on a baking sheet with a drizzle of oil and a pinch of salt and pepper. Roast until browned and tender, 25-30 minutes. Meanwhile, place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15-18 minutes. Reserve ½ cup potato cooking liquid, then drain. Return potatoes to pot. Keep covered off heat until ready to mash.","halve, peel, and thinly slice onion. Trim and thinly slice scallions, separating whites from greens. Mince jalapeño, removing ribs and seeds for less heat. Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for pork over medium- high heat. Add onion, scallion whites, as much jalapeño as you like, and a pinch of salt and pepper. Cook, stirring, until lightly browned and softened, 5-6 minutes. Add ½ TBSP flour (1 TBSP for 4); cook, stirring, 1 minute.","pat pork dry with paper towels and season all over with half the Fry Seasoning (all for 4 servings), salt, and pepper. Heat a drizzle of oil in a large pan over medium heat. Add pork and cook until browned and cooked through, 5-7 minutes per side. Turn off heat; remove from pan and set aside to rest.","Taste and season gravy with pepper. (If gravy is very thick, stir in a splash of water-it should be pourable.) Mash drained potatoes with 1 TBSP butter (2 TBSP butter for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid; taste and season with salt and pepper. Divide carrots, mashed potatoes, and pork between plates. Top pork and mashed potatoes with gravy and sprinkle with scallion greens.","Gradually stir stock concentrate and ½ cup plain water (1 cup for 4 servings) into pan until fully incorporated. Bring to a boil and cook until thickened, 1-2 minutes. Remove from heat. Stir in sour cream until melted and combined.","Pork is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees.","EPRC_8.81_EP1179I / EP1179IPS02_CREAMY SMOTHERED PORK CHOPS.indd 2 EPRC_8.81_EP1179I / EP1179IPS02_CREAMY SMOTHERED PORK CHOPS.indd 2 2/1/22 3:36 PM 2/1/22 3:36 PM."],"image":"images/recipe_0180.webp","source_file":"Creamy Smothered Pork Chops with Roasted Carrots and Mashed Potatoes.pdf"},{"id":"f11a044f4247","title":"Homestyle Pork Chops with Mashed Potatoes plus Roasted Green Beans","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Green Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Psst-want to know our trick for THE creamiest mashed potatoes? Always save a splash of potato cooking liquid before draining. Why? It's super-starchy, so adding a few splashes while mashing helps the potatoes get extra- smooth. Best spuds ever!","Place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10- 12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Mash with sour cream and 1 TBSP butter (2 TBSP for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4). Season with plenty of salt and pepper.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Dice potatoes into ½-inch pieces. Trim green beans if necessary. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens.","pat pork dry with paper towels; season all over with Fry Seasoning (reserve a pinch for step 5), salt, and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. (If pork begins to brown too quickly, lower that heat!) Transfer to a plate.","toss green beans on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until tender and crisped at the edges, 12-15 minutes.","Swap in chicken or steak for pork. Cook chicken until browned and cooked through, 5-6 minutes per side, or cook steak to desired doneness, 3-5 minutes per side.","Heat a drizzle of oil in pan used for pork over medium-high heat. Add garlic and scallion whites; cook until fragrant, 30 seconds. Stir in ¼ cup water (⅓ cup for 4 servings), stock concentrate, and reserved pinch of Fry Seasoning. Cook until liquid has reduced, 2-3 minutes. Remove pan from heat. Season with salt and pepper to taste.","Pork is fully cooked when internal temperature reaches 145°. Chicken is fully cooked when internal temperature reaches 165°. Steak is fully cooked when internal temperature reaches 145°."],"image":"images/recipe_0181.webp","source_file":"Homestyle Pork Chops with Mashed Potatoes plus Roasted Green Beans.pdf"},{"id":"6960ee72bf85","title":"Creamy Penne al Limone with Broccoli plus Parmesan","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Chili Flakes","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Penne Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Base","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cream Cheese","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["You may notice that we pretty much always ask you to reserve a bit of pasta cooking water before draining your pasta. Wondering what makes this cloudy water so darn special? It's salty and starchy, and those magical starches help emulsify your sauce (aka turn it silky smooth). Basically, it makes good pasta great, and we'd never leave you with a bowlful of just good.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Bring a large pot of salted water to a boil. Wash and dry produce. Cut broccoli into bite-size pieces. Halve, peel, and finely chop shallot. Peel and thinly slice garlic. Zest and quarter half the lemon (whole lemon for 4 servings).","reduce heat to medium (water should be at a low simmer); add broccoli to pot. Cook until broccoli is bright green and just tender, 2-3 minutes. Using a slotted spoon, transfer broccoli to a medium bowl (leave water in the pot; it's OK if some broccoli bits remain).","heat a drizzle of oil in a large pan over medium-high heat. Add shallot and garlic; season with salt and pepper. Cook, stirring, until softened, 3-4 minutes. Add garlic powder and cook, stirring, until fragrant, 30-60 seconds more. Reduce heat to low; add cream sauce base, cream cheese, and a pinch of lemon zest. Stir until well combined, then remove from heat. Taste and season with salt and pepper.","Increase heat under pot to high. Once water is boiling, add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water (1 cup for 4 servings), then drain.","Rinse shrimp under cold water and pat dry with paper towels or open package of chicken and drain off any excess liquid. Heat a drizzle of oil in a large pan over medium-high heat. Add shrimp or chicken; season with salt and pepper. Cook, stirring occasionally, until cooked through, 4-6 minutes. Turn off heat; transfer to a plate. Wipe out pan.","Divide pasta between bowls. Top with Parmesan and, if you have some on hand, a pinch of chili flakes from your pantry if desired. Serve with any remaining lemon wedges on the side.","Stir drained pasta, broccoli (draining any excess water first), and a squeeze of lemon juice into pan with sauce, adding splashes of reserved pasta cooking water, until everything is coated in a creamy sauce."],"image":"images/recipe_0182.webp","source_file":"Creamy Penne al Limone with Broccoli plus Parmesan.pdf"},{"id":"3ca0e9ddcb2c","title":"Creamy Smothered Pork Chops with Crispy Home Fries and Roasted Carrots","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Black Pepper","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":0.5,"unit":"tbsp","quantity_text":"½ TBSP","aisle":"Pantry"},{"name":"Cayenne Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["scrape the bottom of your pan with a wooden spoon or spatula in steps 4 and 5! The browned bits left over from the pork chops and onion (aka “the fond”) will give your gravy a huge flavor boost.","Preheat oven to 425 degrees. Wash and dry all produce. Trim, peel, and cut carrots on a diagonal into ¾-inch-thick pieces. Dice potato into ½-inch pieces.","Toss potato on one side of a baking sheet with a large drizzle of oil, half the Fry Seasoning (you'll use the rest in the next step), and a pinch of salt and pepper. Toss carrots on empty side with a drizzle of oil and a pinch of salt and pepper. (For 4 servings, divide veggies between 2 sheets.) Roast until everything is browned and tender, 25-30 minutes.","Before prepping veggies, pat chicken dry with paper towels; season with half the Fry Seasoning, salt, and pepper, then rub with a drizzle of oil. Place skin sides up on a foil-lined baking sheet. Roast on top rack until cooked through, 28-32 minutes.","Toss veggies on a second baking sheet as instructed with oil, remaining Fry Seasoning, salt, and pepper; roast on middle rack.","pat pork dry with paper towels and season all over with remaining Fry Seasoning, salt, and pepper. Heat a drizzle of oil in a large pan over medium heat. Add pork and cook until browned and cooked through, 5-7 minutes per side. Turn off heat; remove from pan and set aside to rest.","halve, peel, and thinly slice onion. Trim and thinly slice scallions, separating whites from greens. Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for pork over medium-high heat. Add onion, scallion whites, and a pinch of salt and pepper. Cook, stirring, until lightly browned and softened, 5-6 minutes. Add ½ TBSP flour (1 TBSP for 4); cook, stirring, 1 minute.","Taste gravy; season with pepper and, if you like things spicy, a pinch of cayenne. (If gravy is very thick, stir in a splash of water-it should be pourable.) Divide roasted veggies and pork between plates. Top pork with gravy and sprinkle with scallion greens.","Gradually stir stock concentrate and ½ cup water (1 cup for 4 servings) into pan until fully incorporated. Boil until thickened, 1-2 minutes. Remove from heat. Stir in sour cream.","Pork is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK20-83."],"image":"images/recipe_0183.webp","source_file":"Creamy Smothered Pork Chops with Crispy Home Fries and Roasted Carrots.pdf"},{"id":"56751e83a113","title":"Firehouse Mac N Cheese with Green Pepper and a Crispy Panko Crust","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Black Pepper","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Milk","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Cheddar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["In step 4, you'll be making a roux (aka a flour-thickened base for sauces). This classic culinary technique is our secret to a luxuriously smooth and creamy mac 'n' cheese. Once the butter melts, make sure to whisk in the flour until thoroughly combined, then slowly whisk in the milk a splash at a time until no lumps remain.","Heat broiler to high. Bring a large pot of salted water to a boil. Wash and dry produce. Halve, core, and finely dice green pepper. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Place 1 TBSP butter (2 TBSP for 4 servings) in a small microwave-safe bowl; microwave until melted, 30 seconds. Stir in panko and Frank's Seasoning. Set aside.","Heat a drizzle of oil in a medium, preferably ovenproof, pan (use a large pan for 4 servings) over medium-high heat. Add green pepper; cook, stirring occasionally, until browned and tender, 4-5 minutes. Add scallion whites and garlic; cook, stirring occasionally, until softened and fragrant, 1 minute. Season with salt and pepper. Turn off heat; transfer to a plate.","Pat diced steak dry with paper towels. In the last 2-3 minutes of cooking green pepper, add steak to pan and season with salt and pepper. Cook, stirring occasionally, until browned and cooked to desired doneness.","Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for veggies over medium heat. Whisk in 1 TBSP flour (2 TBSP for 4) until lightly browned, 1-2 minutes. Slowly whisk in milk and bring to a simmer. Cook, whisking, until thickened, 2-3 minutes. Season generously with salt and pepper. Reduce heat to low. Whisk in cheddar and pepper jack until melted.","add pasta to pot. Cook, stirring occasionally, until al dente, 9-12 minutes. Reserve ½ cup pasta cooking water, then drain.","Stir drained pasta and veggies into pan with cheese sauce. If needed, stir in splashes of reserved pasta cooking water until everything is thoroughly coated in sauce. (If your pan isn't ovenproof, transfer mixture to a baking dish now.) Sprinkle with seasoned panko. Broil until crust is golden brown, 2-3 minutes. (Watch to avoid burning! The broiler is a powerful tool.).","EPRC_13.92_EP1552B / EP1552BPA06_FIREHOUSE MAC 'N' CHEESE.indd 2 EPRC_13.92_EP1552B / EP1552BPA06_FIREHOUSE MAC 'N' CHEESE.indd 2 3/8/22 4:37 PM 3/8/22 4:37 PM."],"image":"images/recipe_0184.webp","source_file":"Firehouse Mac N Cheese with Green Pepper and a Crispy Panko Crust.pdf"},{"id":"e79c34491bac","title":"Honey Ginger Pork Chops with Scallion Rice and Sesame Roasted Carrots","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ponzu Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Honey","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to add a little. je ne sais quoi to this dish? Toast those sesame seeds! This simple step brings out their natural oils and nuttiness-yum. Just heat them in a large, dry pan over medium-high heat and toast, stirring often, until golden brown, 2-3 minutes. Transfer to a small bowl until ready to use.","Preheat oven to 425 degrees. Wash and dry produce. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Peel and finely chop ginger until you have 2 tsp (4 tsp for 4 servings). Toss carrots on a baking sheet with a drizzle of oil and a pinch of salt and pepper. Roast until browned and tender, 20-25 minutes.","heat a drizzle of oil in a small pot over medium-high heat. Add scallion whites; cook until fragrant, 1 minute. Stir in rice to coat, then add 1¼ cups water (2¼ cups for 4 servings) and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","Heat a drizzle of oil in pan used for pork over medium heat. Add garlic and chopped ginger; cook, stirring, until fragrant, 30 seconds. Add ¼ cup water (⅓ cup for 4 servings), soy sauce, ponzu, and honey. Cook, stirring, until thick and syrupy, 2-3 minutes. Remove from heat; stir in 1 TBSP butter (2 TBSP for 4) until melted.","pat pork dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Turn off heat; transfer to a plate. Wash out pan.","Toss roasted carrots with sesame seeds to taste. Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings) and season with salt to taste. Add pork to pan with sauce; turn to coat. Divide pork, rice, and carrots between plates. Drizzle pork with any remaining sauce. Garnish with scallion greens and as many remaining sesame seeds as you'd like.","Pork is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees.","EPRC_43.90_EP1558A / EP1558APS02_Honey Ginger Pork Chops.indd 2 EPRC_43.90_EP1558A / EP1558APS02_Honey Ginger Pork Chops.indd 2 10/5/21 2:45 PM 10/5/21 2:45 PM."],"image":"images/recipe_0185.webp","source_file":"Honey Ginger Pork Chops with Scallion Rice and Sesame Roasted Carrots.pdf"},{"id":"35021fe18b46","title":"Creamy Mushroom Steak with Roasted Potato Rounds and Green Beans","category":"Steak","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ranch Steak","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"}],"instructions":["If you look closely, you'll see that your steak naturally has lines running through it. In order to ensure maximum tenderness, we want you to slice perpendicular to those lines, aka against the grain (as you'll do in step 6). It'll make the end result ten bajillion times better (scientific fact).","Preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ¼-inch-thick rounds. Trim and thinly slice mushrooms. Halve, peel, and finely chop onion until you have ¼ cup (½ cup for 4 servings). Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast for 18-20 minutes (you'll roast the green beans after 8 minutes).","pat steak dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add steak and cook to desired doneness, 3-5 minutes per side. Turn off heat; transfer to a cutting board. Tent with foil to keep warm.","heat a drizzle of oil in pan used for steak over medium-high heat. Add mushrooms and cook, stirring, until browned and tender, 5-7 minutes. Add chopped onion and another drizzle of oil. Cook, stirring, until softened, 1-2 minutes.","toss green beans on a second baking sheet with a drizzle of oil, salt, and pepper. Roast until green beans are tender and potatoes are golden brown and crispy, 10-12 minutes.","Thinly slice steak against the grain. Divide steak, green beans, and potatoes between plates. Spoon mushroom sauce over steak.","Stir stock concentrate and ¼ cup water (⅓ cup for 4 servings) into pan with mushroom mixture. Simmer until slightly thickened, 2-3 minutes. Remove from heat; stir in sour cream and 1 TBSP butter (2 TBSP for 4) until melted. Season generously with pepper."],"image":"images/recipe_0186.webp","source_file":"Creamy Mushroom Steak with Roasted Potato Rounds and Green Beans.pdf"},{"id":"4ff689830f0c","title":"Chicken and Black Bean Enchilada Soup with Sour Cream and Scallions","category":"Chicken","prep_minutes":null,"ready_minutes":15,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Chicken Breast","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["Can't get enough of the heat? If you've got a jalapeño or serrano pepper in your fridge, slice it up and scatter on top of your finished bowls for a spicy spin!","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pot over medium- high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Add scallion whites and cook, stirring, until tender, 1-2 minutes more.","Add beans and their liquid, stock concentrate, enchilada sauce, and ⅓ cup water (½ cup for 4 servings) to pot with chicken. Bring to a boil, then reduce to a simmer; cook for 3 minutes."],"image":"images/recipe_0187.webp","source_file":"Chicken and Black Bean Enchilada Soup with Sour Cream and Scallions.pdf"},{"id":"d661d1384aa5","title":"Hoisin Sriracha Chicken with Ginger Rice and Roasted Carrots","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Hey, EP friend! Did you substitute pork chops for chicken breasts? Easy. Cook through the recipe as instructed, swapping in pork for chicken in steps 4 and 6. In step 4, cook the pork for 4-5 minutes per side.","To peel ginger, break out your spoon! Using the spoon's tip, apply pressure in a downward motion, carving away the skin. Unlike a vegetable peeler, the mighty spoon allows you to get into ginger's knobby nooks.","trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic.","Preheat oven to 425 degrees. Wash and dry all produce. Peel and finely chop ginger. Place rice in a fine-mesh sieve and rinse until water runs clear. Heat a drizzle of oil in a small pot over medium-high heat. Add 1 TBSP ginger (2 TBSP for 4 servings); cook, stirring, until fragrant, 1 minute. Stir in rice, 1 cup water (2 cups for 4), and a pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve.","Toss carrots on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 20-25 minutes. Meanwhile, in a small bowl, combine hoisin, ponzu, ¼ cup water (⅓ cup for 4 servings), and sriracha to taste.","Pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. Turn off heat; transfer to a plate and set aside. Wash out pan.","Heat a drizzle of oil in same pan over medium-high heat. Add scallion whites, garlic, and remaining ginger. Cook, stirring, until fragrant, 30 seconds. Pour in hoisin mixture and simmer until thickened, 1-2 minutes. Remove from heat and stir in 1 TBSP butter (2 TBSP for 4 servings).","Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings) and season with salt and pepper. Divide rice, chicken, and carrots between plates. Drizzle chicken with sauce and sprinkle with scallion greens.","Chicken is fully cooked when internal temperature reaches 165 degrees. Pork is fully cooked when internal temperature reaches 145 degrees. WK23 NJ-81."],"image":"images/recipe_0188.webp","source_file":"Hoisin Sriracha Chicken with Ginger Rice and Roasted Carrots.pdf"},{"id":"98aaaead9f21","title":"Creamy Lemon Herb Chicken with Roasted Sweet Potatoes and Carrots","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Parsley","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"}],"instructions":["Can't get enough of the heat? If you've got some chili flakes or cayenne pepper in your pantry, sprinkle your carrots with a pinch in Step 2 for a spicy spin!","Preheat oven to 425 degrees. Wash and dry produce. Dice sweet potatoes into ½-inch pieces. Trim, peel, and cut carrots on a diagonal into ½-inch pieces.","Toss sweet potatoes on one side of a baking sheet with a drizzle of oil, salt, and pepper. Toss carrots on empty side with a drizzle of oil, salt, and pepper. Roast until browned and tender, 20-25 minutes.","Roast sweet potatoes for 10 minutes; swap in green beans for carrots and roast 12-15 minutes more. Roast sweet potatoes for 5 minutes; swap in broccoli for carrots and roast 15-20 minutes more.","peel and finely chop garlic. Pick parsley leaves from stems; finely chop leaves. Quarter lemon. Pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. Turn off heat; transfer to a cutting board. Wash out pan.","Thinly slice chicken crosswise. Divide chicken, carrots, and sweet potatoes between plates. Drizzle chicken with sauce. Sprinkle with remaining chopped parsley. Serve with remaining lemon wedges on the side.","Heat a drizzle of oil in same pan over medium heat. Add garlic; cook until fragrant, 30 seconds. Add ¼ cup water (⅓ cup for 4 servings) and stock concentrate; simmer until slightly thickened, 2-3 minutes. Remove pan from heat and stir in 1 TBSP butter (2 TBSP for 4) until melted. Stir in sour cream, half the chopped parsley, and a squeeze of lemon juice to taste. Season with salt and pepper."],"image":"images/recipe_0189.webp","source_file":"Creamy Lemon Herb Chicken with Roasted Sweet Potatoes and Carrots.pdf"},{"id":"4f7e51b78b90","title":"Hibachi Style Chicken Stir Fry with Garlic Rice and Special Spicy Sauce","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Black Pepper","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Produce"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Strips","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit
