ry produce. Trim and halve cucumber lengthwise; thinly slice into half-moons. Trim, peel, and grate carrot on the largest holes of a box grater. Peel and finely chop garlic. Peel and finely chop ginger until you have 2 tsp (4 tsp for 4 servings).","In a second medium bowl, combine beef, half the panko, half the garlic, 1 tsp chopped ginger, 1 packet soy sauce, and ½ tsp salt (for 4 servings, use all the panko, 2 tsp ginger, 2 packets soy sauce, and 1 tsp salt). Form into 10-12 1½-inch meatballs (20-24 meatballs for 4). Arrange meatballs on a baking sheet and roast on middle rack until browned and cooked through, 12-15 minutes.","in a medium bowl, combine half the vinegar, ½ tsp white sugar (1 tsp for 4 servings), and a pinch of salt; whisk until sugar is dissolved. Add cucumber and carrot; stir to combine. Set aside to pickle, stirring occasionally, until ready to serve. In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4) and Sriracha to taste (start with a little, then add more if you like things spicy). Add water 1 tsp at a time until it reaches a drizzling consistency.","Fluff rice with a fork; season to taste with salt and pepper and divide between bowls. Add meatballs to pan with sauce; turn to coat. Top rice with meatballs and pickled veggies (draining first) in separate sections. Drizzle meatballs with any remaining sauce from pan and as much spicy mayo as you like.","in a small bowl, whisk together stock concentrate, half the cornstarch, remaining soy sauce, remaining vinegar, 1 TBSP brown sugar, and ¼ cup water (use all the cornstarch, 2 TBSP brown sugar, and ½ cup water for 4 servings) until smooth. Heat a drizzle of oil in a small pan over medium heat. Add remaining garlic and 1 tsp chopped ginger (2 tsp for 4); cook, stirring, until fragrant, 30 seconds (add a pinch of chili flakes from your pantry if you like things spicy). Add soy sauce mixture to pan and cook, stirring, until sauce is thickened, 30-60 seconds. Turn off heat."],"image":"images/recipe_0263.webp","source_file":"Tangy Teriyaki Meatball Bowls with Rice Pickled Veggies and Spicy Mayo.pdf"},{"id":"99d296bc6c3f","title":"Pork Sausage and Roasted Tomato Risotto with Parmesan and Chives","category":"Pork","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Pork Sausage","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Meat & Seafood"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chives","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Arborio Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Want to add a bright touch to your dish? If you've got a lemon on hand, squeeze some fresh juice over your finished risotto in step 6!","Preheat oven to 400 degrees. Wash and dry produce. Cut tomatoes into ½-inch-thick wedges. Halve, peel, and dice onion. Peel and finely chop garlic. Finely chop chives. In a large bowl, combine 4 cups hot water (7 cups for 4 servings), stock concentrate, and a big pinch of salt.","Toss tomatoes on one side of a baking sheet with a drizzle of oil, salt, and pepper. Place sausage on empty side. (For 4 servings, divide between two baking sheets.) Roast until tomatoes are browned and softened and sausage is browned and cooked through, 20-25 minutes for tomatoes and 15-20 minutes for sausage. (Once sausage is done, remove from sheet and continue roasting tomatoes.).","Spread tomatoes out across entire sheet. While tomatoes roast, heat a drizzle of oil in a large pan over medium-high heat. Add chicken sausage; cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Turn off heat; transfer to a plate.","Add ½ cup stock to pan with rice mixture. Cook, stirring, until liquid has mostly absorbed. Repeat with remaining stock-adding ½ cup at a time and stirring until liquid has mostly absorbed- until rice is al dente and mixture is creamy, 25-30 minutes. (Depending on the size of your pan, you may need a little more or a little less liquid.) Turn off heat.","heat a drizzle of oil and 1 TBSP butter in a large pan over medium-high heat. Add onion and season with salt and pepper. Cook, stirring, until softened, 4-5 minutes. Stir in garlic and rice; cook until garlic is fragrant and rice is translucent, 1 minute. Season with salt and pepper.","stir in chopped tomatoes, cheese, half the chives, and 1 TBSP butter (2 TBSP for 4 servings). Taste and season with salt and pepper. Divide between bowls and top with sliced sausage and remaining chives.","transfer to a cutting board. Once cool enough to handle, roughly chop tomatoes and thinly slice sausage into rounds.","Pork Sausage is fully cooked when internal temperature reaches 160 degrees. Chicken Sausage is fully cooked when internal temperature reaches 165 degrees.","EPRC_19.90_EP1429A / EP1429APS04_PORK SAUSAGE & ROASTED TOMATO RISOTTO.indd 2 EPRC_19.90_EP1429A / EP1429APS04_PORK SAUSAGE & ROASTED TOMATO RISOTTO.indd 2 4/19/22 4:06 PM 4/19/22 4:06 PM."],"image":"images/recipe_0264.webp","source_file":"Pork Sausage and Roasted Tomato Risotto with Parmesan and Chives.pdf"},{"id":"a4e7b597fefb","title":"Pork Chops in Creamy Dijon Mushroom Sauce with Crispy Roasted Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Give it a rest! (The cooked pork, that is.) When you let your pork chops stand after cooking (as you will in Step 2), all of their juicy goodness distributes evenly into the meat. The reward? Extra-juicy chops.","Preheat oven to 450 degrees. Wash and dry produce. Dice potatoes into ½-inch pieces. Trim and slice mushrooms into ¼-inch-thick pieces (skip if your mushrooms are pre-sliced). Halve, peel, and thinly slice half the onion (whole onion for 4 servings). Peel and finely chop garlic. Toss potatoes on a baking sheet with a large drizzle of oil, 1 tsp Tuscan Heat Spice (2 tsp for 4; you'll use more later), salt, and pepper. Roast until browned and crispy, 20-25 minutes.","pat pork dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Transfer to a cutting board to rest; tent with foil to keep warm.","Cut broccoli into bite-size pieces if necessary. Swap in broccoli for potatoes. Roast until browned and tender, 12-15 minutes.","Stir stock concentrate and ¼ cup water (⅓ cup for 4 servings) into pan with mushroom mixture. Simmer until slightly thickened, 2-3 minutes. Remove pan from heat; stir in sour cream, mustard, and 1 TBSP butter (2 TBSP for 4) until combined. Season generously with pepper. (If sauce is too thick, add water 1 TBSP at a time until pourable.).","Heat a drizzle of oil in pan used for pork over medium-high heat. Add mushrooms and cook, stirring, until browned and tender, 5-7 minutes. Add sliced onion, garlic, 1 tsp Tuscan Heat Spice (use all the remaining Tuscan Heat Spice for 4 servings), and another drizzle of oil. Cook, stirring, until softened, 1-2 minutes more.","EPRC_4.99_EP1602D / EP1602DSV01_PORK CHOPS IN CREAMY DIJON MUSHROOM SAUCE.indd 2 EPRC_4.99_EP1602D / EP1602DSV01_PORK CHOPS IN CREAMY DIJON MUSHROOM SAUCE.indd 2 1/3/23 4:34 PM 1/3/23 4:34 PM."],"image":"images/recipe_0265.webp","source_file":"Pork Chops in Creamy Dijon Mushroom Sauce with Crispy Roasted Potatoes.pdf"},{"id":"fcba4ba47b9d","title":"Sweet N Spicy Chicken and Pepper Stir Fry over Ginger Rice","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Vegetable Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Want to nail the perfect pot of rice? Once your water boils in step 1, immediately cover the pot with a tight-fitting lid and reduce heat to the lowest setting. Let it simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat for 10 minutes (or more!) while you cook the rest of the meal. This crucial step allows the moisture to redistribute, giving you tender, fluffy grains every time.","Wash and dry all produce. Place rice in a fine-mesh sieve and rinse until water runs clear. Peel and finely chop ginger. Heat a drizzle of oil in a small pot over medium-high heat. Add half the ginger; cook until fragrant, 1 minute. Stir in rice to coat, then add 1 cup water (2 cups for 4 servings) and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve.","core, deseed, and dice green pepper into ¾-inch pieces. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. In a small bowl, whisk together ponzu, chili sauce, 1 tsp cornstarch (2 tsp for 4 servings; you'll use the rest in the next step), 2 tsp sugar (4 tsp for 4), and ¼ cup water (⅓ cup for 4).","Pat chicken dry with paper towels; place in a medium bowl. Season with salt and pepper, then toss with remaining cornstarch. Heat a large drizzle of oil in a large pan over high heat. Add chicken in a single layer and cook, stirring occasionally, until browned and cooked though, 4-6 minutes. Remove from pan and set aside.","Heat a drizzle of oil in same pan over medium- high heat. Add green pepper and season with salt and pepper. Cook, stirring often, until browned and softened, 3-5 minutes. Add another drizzle of oil, scallion whites, garlic, and remaining ginger. Cook, stirring, until fragrant and softened, about 1 minute.","Add cooked chicken and ponzu mixture to pan. Cook, stirring, until thickened, 1 minute. Remove pan from heat and stir in 1 TBSP butter (2 TBSP for 4 servings) until melted. If sauce is too thick, add a splash of water.","Fluff rice with a fork; stir in 1 TBSP butter and a pinch of salt. Divide between bowls or plates and top with chicken stir-fry and scallion greens.","84 Sweet 'n' Spicy Chicken & Pepper Stir-Fry_NJ.indd 2 21.84 Sweet 'n' Spicy Chicken & Pepper Stir-Fry_NJ.indd 2 4/29/20 7:12 AM 4/29/20 7:12 AM."],"image":"images/recipe_0266.webp","source_file":"Sweet N Spicy Chicken and Pepper Stir Fry over Ginger Rice.pdf"},{"id":"4cd2323f7b86","title":"Tzatziki Chicken Sandos with Quick-Pickled Cucumber and Golden Potato Wedges","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Strips","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome roasted potatoes? Raid your spice cabinet for garlic powder, onion powder, or cayenne pepper (or a combo of all three!) and sprinkle a pinch over your spuds before roasting in Step 2.","Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until browned and crispy, 20-25 minutes.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Quarter lemon. Grate half the cucumber on the large holes of a box grater; thinly slice remaining cucumber. Peel and finely chop garlic. Halve, peel, and thinly slice onion. Halve baguettes.","Pat chicken dry with paper towels and season all over with Turkish Spice Blend and a big pinch of salt (add a pinch of chili flakes from your pantry if you like things spicy!). Heat a large drizzle of oil in a large pan over medium-high heat. Add onion and cook, stirring, until just softened, 2-3 minutes. Add chicken and remaining garlic; cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes more. Turn off heat; transfer to a plate. Wipe out pan.","In a small bowl, combine 1 tsp sugar (2 tsp for 4 servings), juice from three lemon wedges (juice from six wedges for 4), and a pinch of salt and pepper. Add sliced cucumber and set aside to pickle, stirring occasionally. In a medium bowl, combine sour cream, grated cucumber, juice from remaining lemon, a small pinch of garlic, and a pinch of salt and pepper.","Fill baguettes with chicken (you may have some left over), pickled cucumber (draining first), and as much tzatziki as you like. Divide sandwiches and potato wedges between plates. Serve with any remaining tzatziki on the side for dipping.","Melt 2 TBSP butter in same pan over medium heat. Place baguettes, cut sides down, in pan. Cook, pressing with the back of a spatula, until golden brown and toasted, 2-4 minutes. (Work in batches for 4 servings, adding an additional 2 TBSP butter between batches.) Lightly season buttered sides with salt."],"image":"images/recipe_0267.webp","source_file":"Tzatziki Chicken Sandos with Quick-Pickled Cucumber and Golden Potato Wedges.pdf"},{"id":"8fe0f583d45d","title":"Tuscan Herbed Chicken Linguine with Creamy Tomato Sauce and Charred Lemon","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Linguine Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Look-we know that you, like so many of us, have limited kitchen space. That's why we'll never tell you that you must purchase something like a mini non-contact infrared thermometer in order to be successful with our recipes. We do recommend a microplane for zesting your lemon in step 1, though. It's the best tool for the job!","Place chicken in a medium bowl and pat dry with paper towels. Toss with a large drizzle of olive oil, chopped garlic, half the Tuscan Heat Spice (you'll use the rest later), salt, and pepper. Set aside. Once water is boiling, add pasta to pot. Cook until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water (¾ cup for 4 servings), then drain.","Bring a large pot of salted water to a boil. Wash and dry all produce. Peel garlic; thinly slice 2 cloves (4 cloves for 4 servings) and finely chop remaining clove (2 cloves for 4). Zest and halve lemon. Finely chop tomato.","Add 2 TBSP butter (4 TBSP for 4 servings) and sliced garlic to same pan over medium- high heat. Cook, stirring, until butter has melted and garlic is fragrant, 1 minute. Add tomato, remaining Tuscan Heat Spice, salt, and pepper. Cook, stirring, until slightly softened, 2-3 minutes.","heat a large pan over medium-high heat. Add lemon halves cut sides down; cook until charred, 3-4 minutes. Remove from pan and set aside. Heat a drizzle of olive oil in same pan over medium-high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Remove from pan and set aside.","Whisk cream cheese, half the reserved pasta cooking water, and half the Parmesan (save the rest for serving) into pan with tomato mixture until cheese melts. Bring to a simmer, then stir in drained pasta, chicken, and lemon zest. Slowly add more reserved pasta cooking water a splash at a time until everything is coated in a creamy sauce. Season generously with salt and pepper.","Divide pasta between bowls and top with remaining Parmesan. Serve with charred lemon halves on the side (and squeeze those babies all over your finished dish)."],"image":"images/recipe_0268.webp","source_file":"Tuscan Herbed Chicken Linguine with Creamy Tomato Sauce and Charred Lemon.pdf"},{"id":"bed4438393b1","title":"Ponzu Chili Beef Bowls with Snap Peas Garlic Ginger Rice and Chili Mayo","category":"Beef","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Want to nail the perfect pot of rice? Once the water boils, immediately cover the pot with a tight-fitting lid and reduce the heat. Simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat while you finish cooking. This allows the moisture to redistribute, giving you tender, fluffy grains.","Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add garlic and half the ginger. Cook, stirring, until fragrant, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4), and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15- 18 minutes. Keep covered off heat until ready to serve.","Heat a drizzle of oil in a large pan over medium-high heat. Add snap peas; cook, undisturbed, until charred on one side, 1-2 minutes. Continue to cook, stirring occasionally, until tender and charred all over, 1-2 minutes more. Transfer to a second small bowl and season with salt and pepper. Cover to keep warm.","trim and remove strings from snap peas by snapping off the stem end with your fingers and gently pulling (like you would a zipper). In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4) with half the chili sauce (you'll use the rest later). Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper. Set aside.","Fluff rice with a fork and season with salt and pepper. Divide rice between bowls. Top with beef and snap peas in separate sections. Drizzle everything with chili mayo.","Heat a drizzle of oil in pan used for snap peas over high heat. Add beef and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-5 minutes. Add remaining ginger; cook until fragrant, 30 seconds. Add ponzu and remaining chili sauce; stir until coated, 1-2 minutes. Remove from heat; season with salt and pepper."],"image":"images/recipe_0269.webp","source_file":"Ponzu Chili Beef Bowls with Snap Peas Garlic Ginger Rice and Chili Mayo.pdf"},{"id":"50329d4ff6dd","title":"Turkey Shepherds Pie topped with Garlic Mashed Potatoes","category":"Turkey","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Celery","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["In step 1, you'll finely dice your carrot, celery, and onion to go into a mirepoix (fancy that!). This classic culinary technique involves sautéing the aforementioned trio of veggies to create a savory flavor base for dishes like shepherd's pie-as well as soups, ragùs, and more!","Wash and dry produce. Dice potatoes into ½-inch pieces. Peel garlic. Finely chop one clove (two cloves for 4 servings); keep remaining garlic whole. Trim, peel, and finely dice carrot. Finely dice celery. Halve, peel, and finely dice half the onion (whole onion for 4).","Place potatoes and whole garlic in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender when pierced with a fork, 10-12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes and garlic to pot. Keep covered off heat until ready to mash.","Add turkey to pan with veggies and season generously with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Stir in 1 TBSP butter (2 TBSP for 4 servings) until melted, then sprinkle with 2 TBSP flour (4 TBSP for 4). Cook, stirring, until lightly browned, 2-3 minutes.","heat a drizzle of oil in a medium pan (use a large pan for 4 servings) over medium-high heat. Add carrot and season with salt and pepper. Cook, stirring, until slightly softened, 2-3 minutes. Add celery, diced onion, and a large drizzle of oil; season with salt and pepper. Cook, stirring, until veggies are just tender, 5-7 minutes. Stir in chopped garlic and half the dried thyme (all for 4). Cook until fragrant, 30 seconds.","Spread mashed potatoes on top of turkey mixture, leaving a 1-inch gap around edge of pan. Divide between plates.","Slowly pour ¾ cup plain water (1½ cups for 4 servings) into pan, stirring, until thoroughly combined. Stir in stock concentrates and season with salt and pepper. Bring to a simmer and cook, stirring, until thickened, 2-3 minutes. (If mixture is too thick, stir in a splash more water.) Meanwhile, mash potatoes and whole garlic with sour cream and 3 TBSP butter (6 TBSP for 4) until smooth, adding splashes of reserved potato cooking liquid (or milk, for extra creaminess) (we used ¼ cup; ½ cup for 4). Taste and season generously with salt and pepper."],"image":"images/recipe_0270.webp","source_file":"Turkey Shepherds Pie topped with Garlic Mashed Potatoes.pdf"},{"id":"36440f44c682","title":"Pepper Jack Stuffed Pub Burgers with Caramelized Onion Potato Wedges and Special Sauce","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Other"},{"name":"Brown Sugar","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["Don't worry if some of the cheese oozes out of your patties while they cook! It'll crisp up and turn toasty- delicious in the pan (hellooo, accidental frico)!","heat a drizzle of oil in a large pan over medium-high heat. Add sliced onion and season with salt and pepper; cook, stirring occasionally, until browned and tender, 7-8 minutes. Add 2 TBSP water (4 TBSP for 4 servings); cook, stirring, until water has evaporated, 1-2 minutes more. Stir in 1 TBSP butter (2 TBSP for 4) until melted. Turn off heat; transfer to a plate and cover to keep warm. Wipe out pan.","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice half the onion (whole onion for 4). Toss potatoes on one side of a baking sheet with a drizzle of oil, 1 tsp Fry Seasoning (2 tsp for 4; you'll use the rest later), salt, and pepper. (For 4, spread potatoes across entire sheet.) Roast on top rack until browned and crispy, 20-25 minutes.","Arrange bacon on a second baking sheet; roast on middle rack until crispy, 15-20 minutes. Transfer to a paper-towel-lined plate.","Heat a drizzle of oil in pan used for onion over medium-high heat. Add stuffed patties and cook to desired doneness, 3-5 minutes per side.","In a small bowl, combine mustard, 3 TBSP ketchup, and 2 tsp brown sugar (6 TBSP ketchup and 4 tsp brown sugar for 4 servings); set aside. (No brown sugar? Swap in 1 tsp white sugar; 2 tsp for 4.) In a large bowl, combine beef, remaining Fry Seasoning, ¾ tsp salt (1 tsp for 4), and pepper in a large bowl. Form beef mixture into two ½-inch-thick rounds (four rounds for 4). Divide half the cheese between centers of each round. Fold edges of meat around cheese, shaping and sealing to create stuffed patties, each a bit wider than a burger bun.","Place stuffed patties on bottom buns; top with onion and remaining cheese. Spread top buns with as much sauce as you like; close buns to form burgers. Divide between plates and serve with potato wedges and any remaining sauce for dipping.","place 1 TBSP butter (2 TBSP for 4 servings) in a small microwave-safe bowl; microwave until melted, 30 seconds. Halve buns and brush melted butter onto cut sides. Remove sheet with potatoes from oven; place buttered buns on empty side of sheet, cut sides down. Return to top rack and toast until buns are golden brown, 3-5 minutes. (For 4, leave potatoes roasting; add buns to a second sheet and toast on middle rack.).","Ground Beef is fully cooked when internal temperature reaches 160°. Bacon is fully cooked when internal temperature reaches 145°."],"image":"images/recipe_0271.webp","source_file":"Pepper Jack Stuffed Pub Burgers with Caramelized Onion Potato Wedges and Special Sauce.pdf"},{"id":"8efd18fc8fc4","title":"One Pan Chicken Fajitas with Green Bell Peppers Pico de Gallo and Lime Crema","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Strips","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"with Green Bell Pepper, Pico de Gallo & Lime Crema","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Produce"}],"instructions":["We love jalapeños for their fresh kick. If you're looking for a milder spice, however, remove the ribs and seeds before chopping (that's where most of the heat lives). Our favorite way to do it? Halve the chile, then use a spoon to scrape out the center.","Wash and dry produce. Dice tomato. Halve, peel, and thinly slice onion; finely chop a few slices until you have 1½ TBSP (3 TBSP for 4 servings). Zest and quarter lime. Finely chop half the jalapeño, removing ribs and seeds if you prefer less heat. (If you like things spicy, thinly slice remaining jalapeño into rounds for garnishing.) Halve, core, and thinly slice bell pepper into strips.","In a small bowl, combine tomato, chopped onion, a squeeze of lime juice, and as much chopped jalapeño as you'd like. Season with salt and pepper.","Heat a drizzle of oil in a large pan over medium-high heat. Add bell pepper; cook, stirring occasionally, until browned and tender, 4-5 minutes. Add sliced onion; cook, stirring occasionally, until softened, 4-5 minutes. (Add a splash of water to help the veggies soften if needed.) Season with salt and pepper. Turn off heat and transfer to a plate.","In a second small bowl, combine sour cream, lime zest, 1 TBSP water (2 TBSP for 4 servings), and a squeeze of lime juice. Season with salt and pepper.","wrap tortillas in damp paper towels and microwave until warm and pliable, 30 seconds. Divide warmed tortillas between plates and fill with chicken, veggies, pico de gallo, and lime crema. (If using, garnish with that sliced jalapeño!) Serve with remaining lime wedges on the side.","pat chicken dry with paper towels; season all over with 2 tsp Southwest Spice (4 tsp for 4 servings; measure-we sent more), salt, and pepper. Heat a drizzle of oil in pan used for veggies over medium-high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes.","Chicken is fully cooked when internal temperature reaches 165 degrees. Steak is fully cooked when internal temperature reaches 145 degrees."],"image":"images/recipe_0272.webp","source_file":"One Pan Chicken Fajitas with Green Bell Peppers Pico de Gallo and Lime Crema.pdf"},{"id":"cc82ea236212","title":"Vietnamese Chicken and Rice Bowls with Pickled Cucumber Spicy Mayo and Peanuts","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"½ tsp","quantity_text":"1½ tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mini Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chicken Breast","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Peanuts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to nail the perfect pot of rice? Once the water boils, immediately cover the pot with a tight-fitting lid and reduce the heat. Simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat while you finish cooking. This allows the moisture to redistribute, giving you tender, fluffy grains.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Wash and dry produce. In a small pot, combine rice, 1¼ cups water (2¼ cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","zest and quarter lime. Peel and finely chop garlic. In a medium bowl, combine ponzu, lime zest, ¾ of the garlic, 1 tsp sugar (2 tsp for 4 servings), a pinch of salt, and pepper. Pat chicken dry with paper towels; add to bowl and toss to combine. Set aside to marinate.","In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with as much Sriracha and remaining garlic as you'd like. Season with salt. In a separate small bowl, combine cucumber, juice from half the lime, ½ tsp sugar (1 tsp for 4), and a pinch of salt. Set aside to quick-pickle.","halve cucumber lengthwise; thinly slice into half-moons. Trim, peel, and grate carrot on the largest holes of a box grater. Roughly chop peanuts.","Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings). Divide rice between bowls and top with chicken, grated carrot, pickled cucumber (draining first), spicy mayo, and peanuts. Serve with remaining lime wedges on the side.","When rice has about 5 minutes left, heat a drizzle of oil in a large pan over medium-high heat. Add chicken (discard any excess marinade); cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Turn off heat.","Swap in beef for chicken; add ponzu mixture to pan. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes.","Chicken is fully cooked when internal temperature reaches 165°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0273.webp","source_file":"Vietnamese Chicken and Rice Bowls with Pickled Cucumber Spicy Mayo and Peanuts.pdf"},{"id":"e9e263b2fefe","title":"Sticky Sweet Soy Pork Meatloaves with Sesame Carrots Shingled Potatoes and Spicy Mayo","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Brown Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":5.0,"unit":"tbsp","quantity_text":"5 TBSP","aisle":"Other"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Carrots","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Produce"},{"name":"Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ponzu","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Soy Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 5, we instruct you to spread the tops of your meatloaves with the soy glaze. We prefer to use a basting brush for the job, but if you don't have one, use the back of a spoon and some artistry to evenly coat!","Wash and dry produce. Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Slice potatoes into ¼-inch-thick rounds. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces.","In a large bowl, toss potatoes with a large drizzle of oil and a couple big pinches of salt and pepper until thoroughly coated. Add potatoes to one side of a baking sheet in a single overlapping layer (for 4 servings, spread potatoes out across entire sheet; shingle, not stack, the potatoes in a single layer so they're barely overlapping-this helps them cook evenly!). Roast on top rack for 5 minutes (you'll add more to the baking sheet then).","trim and thinly slice scallions, separating whites from greens; finely chop whites. Peel and finely chop ginger until you have 1 tsp (2 tsp for 4 servings). Peel and finely chop garlic.","In bowl used for potatoes, gently combine pork, ponzu, scallion whites, ginger, garlic, half the panko, 2 TBSP ketchup, ½ tsp salt, and a pinch of pepper (for 4 servings, use all the panko, 4 TBSP ketchup, and 1 tsp salt). Form into two 1-inch-tall loaves (four loaves for 4). In a small bowl, combine soy sauce, 3 TBSP ketchup, and 1 TBSP brown sugar (for 4, use 6 TBSP ketchup and 2 TBSP brown sugar). (No brown sugar? No problem! Just use 1 tsp white sugar; 2 tsp for 4.).","In bowl used for glaze, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with horseradish paste to taste. Add water, 1 tsp at a time, until mixture reaches a drizzling consistency. Divide meatloaves, potatoes, and carrots between plates. Drizzle potatoes with spicy mayo. Garnish potatoes and meatloaves with scallion greens.","remove sheet from oven. toss carrots on opposite side of sheet with a drizzle of oil, salt, and pepper (for 4 servings, toss carrots on a second sheet). Nestle meatloaves among carrots and brush the tops with soy glaze. Sprinkle meatloaves and carrots with sesame seeds. Return to top rack and roast until veggies are browned and tender and meatloaves are cooked through, 20-25 minutes. (For 4, roast carrots on middle rack.) Wash out bowl used for glaze.","Roast beef meatloaves and veggies for 16-18 minutes; remove meatloaves from sheet and continue to roast veggies for 4-7 minutes more if necessary.","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0274.webp","source_file":"Sticky Sweet Soy Pork Meatloaves with Sesame Carrots Shingled Potatoes and Spicy Mayo.pdf"},{"id":"d0999282ab59","title":"White Bean Tomato Stew with Feta and Garlic Toasts","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrates","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Other"},{"name":"Ciabatta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["PSA: Stew thickness is a personal choice! If you want yours thicker or thinner, simmer for a little more or a little less time (respectively) in Step 3. After all, you're the chef.","Wash and dry produce. Halve, peel, and finely dice onion. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Dice tomato. Drain beans, reserving liquid.","Heat a drizzle of oil in a medium pot over medium heat. Add onion, scallion whites, half the garlic, and a pinch of salt. Cook, stirring occasionally, until softened, 6-8 minutes. Add tomato paste; cook, stirring, until lightly browned, 1-2 minutes. Stir in diced tomato, Italian Seasoning, stock concentrates, reserved bean liquid, and half the beans (you'll add the rest later). Season generously with salt and pepper.","Heat a dry medium pan over medium-high heat. Add bacon; cook, turning occasionally and adjusting heat if browning too quickly, until crispy, 6-10 minutes. Turn off heat; transfer to a paper-towel-lined plate. Once cool enough to handle, roughly chop.","halve ciabatta. In a small microwave-safe bowl, add 1 TBSP butter (2 TBSP for 4 servings) and a pinch of garlic. Microwave until butter is softened, 15-30 seconds. Season with salt and pepper; stir to combine. Toast ciabatta, then spread cut sides with garlic butter. Halve toasts on a diagonal to create triangles.","Stir 1 cup water (2 cups for 4 servings) into pot with bean mixture; bring to a boil, then reduce heat to low. Cook, stirring occasionally, until slightly reduced, 8-10 minutes. Season with ¾ tsp salt (1½ tsp for 4).","Stir half the cheese and remaining beans into stew. Season with salt and pepper to taste. (If stew is too thick, add a splash of water.) Divide stew between bowls and top with remaining cheese and scallion greens. Serve garlic toasts on the side."],"image":"images/recipe_0275.webp","source_file":"White Bean Tomato Stew with Feta and Garlic Toasts.pdf"},{"id":"294ab1696797","title":"Southwest Rajas Quesadillas with Salsa Fresca and Lime Crema","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Poblano","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Mexican Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Curious about rajas? Literally translating to “strips,” rajas typically refers to a creamy roasted poblano dish. In this quick twist on the Mexican classic, we're sautéeing diced poblano along with onion and tomatoes, then stuffing the saucy medley into tortillas for some ridiculously awesome quesadillas.","Wash and dry produce. Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Dice tomatoes. Quarter lime. Core, deseed, and dice poblano.","In a small bowl, combine chopped onion, half the tomatoes, and juice from half the lime. Season with salt and pepper. In a separate small bowl, combine half the sour cream (you'll use the rest in the next step) with a squeeze of lime juice. Season with salt and pepper. Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Place tortillas on a clean work surface; sprinkle one half of each tortilla with Mexican cheese. Top with veggie filling, then sprinkle with pepper jack. Fold tortillas in half to create quesadillas.","Heat a drizzle of oil in a large pan over medium-high heat. Add poblano, sliced onion, and a big pinch of salt. Cook, stirring occasionally, until browned and tender, 7-8 minutes. Stir in Southwest Spice, remaining tomatoes, and 2 TBSP water. Cook, stirring occasionally, until tomatoes are softened and mixture is thick and saucy. (If veggie mixture seems dry, add up to 2 TBSP more water.) Turn off heat; stir in remaining sour cream. Season with salt and pepper.","Cut quesadillas into wedges. Drizzle with lime crema and top with salsa fresca. Serve with any remaining lime wedges on the side.","Wash out pan used for veggie filling; return to medium-high heat with a drizzle of oil. Add quesadillas; cook until tortillas are golden brown and cheeses are melted, 2-4 minutes per side. (Depending on the size of your pan, you may need to work in batches.) Turn off heat."],"image":"images/recipe_0276.webp","source_file":"Southwest Rajas Quesadillas with Salsa Fresca and Lime Crema.pdf"},{"id":"c0f7f0328f53","title":"Supreme Italian Sausage Biscuit Skillet with Bell Pepper Marinara and Mozz","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Pork Sausage","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Marinara","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Biscuits","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["Worried about butter splattering in your microwave in step 2? (We've all been there.) Cover your bowl with a damp paper towel, then proceed without worry!","In a large microwave-safe bowl, add garlic and 2 TBSP butter (4 TBSP for 4 servings); microwave until butter has melted and garlic is fragrant, 30 seconds. Toss biscuits in garlic butter to coat; season with salt and pepper.","Adjust rack to top position and preheat oven to 400 degrees. Wash and dry produce. Peel and finely chop garlic. Remove biscuits from packaging; quarter biscuits. Halve, core, and thinly slice bell pepper into strips. Halve, peel, and thinly slice half the onion (whole onion for 4 servings). Remove sausage from casing; discard casing.","Transfer sausage and veggie mixture to bowl with garlic butter biscuits. Stir to combine, making sure biscuits are evenly dispersed. Transfer to pan used for sausage and spread out in an even layer. (If your pan isn't ovenproof, transfer mixture to a baking dish.) Bake until biscuits are puffed and golden brown, 15-18 minutes.","Heat a drizzle of oil in a medium, preferably ovenproof, pan (use a large, preferably ovenproof, pan for 4 servings) over medium-high heat. Add bell pepper; cook, stirring occasionally, until browned and tender, 4-5 minutes. Add sausage and sliced onion; season generously with salt and pepper. Cook, breaking up meat into pieces, until sausage is browned and cooked through and onion is softened, 4-6 minutes. Turn off heat.","remove pan from oven. Heat broiler to high. Spread marinara sauce over top, then sprinkle with mozzarella. Broil until cheese has melted, 2-3 minutes. (Watch to avoid burning. The broiler is a powerful tool!) Let skillet cool slightly. Divide between plates or serve family-style, straight from the pan."],"image":"images/recipe_0277.webp","source_file":"Supreme Italian Sausage Biscuit Skillet with Bell Pepper Marinara and Mozz.pdf"},{"id":"54b9794f8499","title":"Mushroom and Pepper Jack Quesadillas with Caramelized Onion Lime Crema and Spicy Pico","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"}],"instructions":["Psst-wanna know our secret to perfect pico? Taste it! In step 5, try the mixture before adding any jalapeño, then stir in a small sprinkle and taste again. If you love spicy food, you can always add more!","Wash and dry all produce. Trim and thinly slice mushrooms. Zest and quarter lime. Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Dice tomato. Finely chop as much jalapeño as you'd like in your pico, removing ribs and seeds for less heat.","Heat a drizzle of oil in a large pan over medium- high heat. Add mushrooms and season with salt and pepper. Cook, stirring, until browned and tender, 5-7 minutes. (If mushrooms begin to brown too quickly, lower that heat!) Transfer to a plate and set aside.","Heat another drizzle of oil in pan used for mushrooms over medium-high heat. Add sliced onion and season with salt and pepper. Cook, stirring, until softened and lightly browned, 8-10 minutes. Add ¼ cup water (⅓ cup for 4 servings) and 1 tsp sugar (2 tsp for 4). Cook, stirring, until onion is caramelized and jammy, 2-3 minutes more. Turn off heat; transfer to plate with mushrooms. Wash out pan.","in a small bowl, combine sour cream, lime zest, and a squeeze of lime juice to taste. Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Evenly sprinkle one half of each tortilla with cheese, then mushrooms and caramelized onion; fold tortillas in half to create quesadillas. Heat a drizzle of oil in pan used for onion over medium heat. Add quesadillas and cook until tortillas are browned and cheese melts, 3-5 minutes per side. (For 4 servings, work in batches.) Cut into wedges, divide between plates, and serve with lime crema and spicy pico.","in a second small bowl, combine tomato, chopped onion, juice from remaining lime wedges, and as much chopped jalapeño as you'd like. Season with salt and pepper."],"image":"images/recipe_0278.webp","source_file":"Mushroom and Pepper Jack Quesadillas with Caramelized Onion Lime Crema and Spicy Pico.pdf"},{"id":"ecd0799f42ae","title":"Sesame Pork Rice Bowls with Creamy Slaw and Spicy Mayo","category":"Pork","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Dressing","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Hot Sauce","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Ever wonder why we ask you to separate the white parts of scallions from the green ones? Well, the whites are super oniony and take better to cooking, while the green tops make for a fresh topping or mix-in.","In a small pot, combine rice, 1¼ cups water (2¼ cups for 4 servings), and a big pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15- 18 minutes. Keep covered off heat until ready to serve. Taste and season with more salt.","Heat a drizzle of oil in a large pan over medium-high heat. Add pork and season with ½ tsp salt (1 tsp for 4 servings) and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. (If there's excess grease in your pan, pour it out.).","in a medium bowl, combine cabbage and carrot mix, half the scallion greens, half the sesame dressing, and 1 TBSP mayonnaise (2 TBSP for 4 servings). Set aside.","In a small bowl, whisk together 1 TBSP mayonnaise (2 TBSP for 4 servings), 1 tsp hot sauce (2 tsp for 4), and 1 tsp ketchup (2 tsp for 4). Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4) and season with salt and pepper. Divide rice between bowls and top with pork mixture and slaw. Drizzle with spicy mayo and garnish with remaining scallion greens.","Add scallion whites to pan with pork; cook until scallion whites are just tender, 2-3 minutes. Stir in ponzu, soy sauce, chili sauce, and remaining sesame dressing. Cook, stirring, until thickened, 1-2 minutes. Turn off heat. Taste and season with salt and pepper."],"image":"images/recipe_0279.webp","source_file":"Sesame Pork Rice Bowls with Creamy Slaw and Spicy Mayo.pdf"},{"id":"b8e96d908b25","title":"One Pan Sweet Chili Turkey Lettuce Wraps with Lime Cilantro and Peanuts","category":"Turkey","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Carrots","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Produce"},{"name":"Baby Lettuce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ground Turkey","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Peanuts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Leave the turkey alone for the first few minutes of cooking-this will help the meat develop a nice sear. Then you'll have some magically crispy caramelized bits in your lettuce wraps.","Wash and dry produce. Trim, peel, and finely dice carrots. Halve, peel, and finely dice onion. Peel and finely chop garlic. Quarter lime. Trim and discard root end from lettuce; separate leaves. Finely chop cilantro.","Heat a large drizzle of oil in a large pan over medium-high heat. Add carrot and onion; season with salt and pepper. Cook, stirring, until tender and lightly browned, 5-7 minutes. Add garlic and cook, stirring, until fragrant, about 30 seconds. Transfer veggies to a plate.","Return veggies to pan with turkey. Stir in sweet soy glaze, chili sauce, ponzu, and 1 TBSP butter (2 TBSP for 4 servings). Cook, stirring, until turkey mixture is thoroughly coated, 2-3 minutes. Remove from heat. Stir in a squeeze of lime juice to taste.","Add another drizzle of oil to same pan. Add turkey and season with salt and pepper. Using a spatula, press turkey into an even layer. Cook, undisturbed, until browned on bottom, 3-4 minutes. Break up meat into pieces and cook until cooked through, 2-4 minutes more.","Divide lettuce leaves between plates; fill with turkey mixture. Garnish with peanuts and cilantro. Serve with remaining lime wedges on the side. (Alternatively, serve lettuce leaves, turkey mixture, peanuts, and cilantro in separate bowls, then let everyone assemble their own wraps!).","Ground Turkey is fully cooked when internal temperature reaches 165°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0280.webp","source_file":"One Pan Sweet Chili Turkey Lettuce Wraps with Lime Cilantro and Peanuts.pdf"},{"id":"175d3ada5dc5","title":"Pork Sausage Stuffed Peppers with Pepper Jack","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Peppers","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pork Sausage","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"}],"instructions":["Be careful when handling the bell peppers in step 6! We recommend using tongs to hold those hot-from-the-oven peps in place while stuffing them.","Preheat oven to 425 degrees. Wash and dry produce. Halve bell peppers lengthwise; remove stems and seeds. Halve, peel, and finely chop onion. Peel and finely chop garlic.","Place bell pepper halves, cut sides down, on a baking sheet; drizzle each half with olive oil and rub to evenly coat. Season with salt and pepper. Roast until softened and lightly browned, 18-22 minutes.","remove sausage from casing; discard casing. Add sausage and garlic to pan with onion. Cook, breaking up meat into pieces, until browned and cooked through, 4-5 minutes. Add tomato paste and couscous; stir to coat.","heat a drizzle of oil in a large, preferably ovenproof, pan over medium-high heat. Add onion and season with salt and pepper. Cook, stirring, until softened, 4-5 minutes.","Remove baking sheet with bell pepper halves from oven. fill bell pepper halves with as much filling as will fit, keeping remaining filling in pan. Nestle stuffed peppers in pan with remaining filling. (If your pan isn't ovenproof, transfer remaining filling and stuffed peppers to a baking dish now.) Evenly top with cheese. Return to oven until cheese is melted and lightly browned, 4-5 minutes. (Watch to avoid burning.) Divide stuffed peppers and remaining filling between plates.","Stir 2 cups water (3 cups for 4 servings) and a big pinch of salt and pepper into pan. Bring to a boil and cook, stirring often, until couscous is tender and mixture has thickened, 8-10 minutes. (If water evaporates before couscous is tender, add a splash more.) Taste and season with salt and pepper. Turn off heat.","Pork Sausage is fully cooked when internal temperature reaches 160 degrees. Chicken Sausage is fully cooked when internal temperature reaches 165 degrees.","EPRC_10.87_EP1215 / EP1215APS04_PORK SAUSAGE STUFFED PEPPERS.indd 2 EPRC_10.87_EP1215 / EP1215APS04_PORK SAUSAGE STUFFED PEPPERS.indd 2 2/15/22 2:06 PM 2/15/22 2:06 PM."],"image":"images/recipe_0281.webp","source_file":"Pork Sausage Stuffed Peppers with Pepper Jack.pdf"},{"id":"84db9648ed8d","title":"Roasted Garlic Dijon Butter Steak with Brussels Sprouts and Mashed Sweet Potatoes","category":"Steak","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Garlic","amount":4.0,"unit":"clove","quantity_text":"4 Cloves","aisle":"Produce"},{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chives","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["Want to know our trick for the crispiest Brussels sprouts? Before popping 'em in the oven, arrange each one cut side down on the baking sheet. The flat sides provide more surface area for browning and caramelization!","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Place sweet potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15- 20 minutes. Drain and set aside. (Keep empty pot handy for step 5.).","Adjust rack to top position and preheat oven to 450 degrees. Cut 2 TBSP butter (4 TBSP for 4 servings) into ½-inch cubes and place in a small microwave-safe bowl; bring to room temperature. Wash and dry produce. Peel and dice sweet potatoes into ½-inch pieces. Trim and halve Brussels sprouts lengthwise.","finely chop chives. Pat steak dry with paper towels and season generously with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add steak and cook to desired doneness, 3-5 minutes per side. Turn off heat; transfer to a cutting board to rest. Tent with foil to keep warm.","toss Brussels sprouts on a baking sheet with a large drizzle of olive oil, salt, and pepper. Peel garlic; place cloves in the center of a small piece of foil. Drizzle with olive oil, season with salt and pepper, and cinch into a packet. Place on same sheet. Roast on top rack until everything is browned and tender, 15-20 minutes. Once garlic is done, open packet and let cloves cool slightly.","Mash roasted garlic cloves with a fork until smooth. Add to bowl with cubed softened butter (if butter is not yet softened, microwave for 5-10 seconds) along with mustard, half the chives, salt, and pepper. (Psst-make sure the garlic has cooled before adding so that the butter doesn't melt!) Slice steak against the grain. Divide steak, Brussels sprouts, and mashed sweet potatoes between plates. Top sweet potatoes with remaining chives and dollop steak with roasted garlic Dijon butter.","Melt 2 TBSP butter (4 TBSP for 4 servings) in pot used for sweet potatoes over medium heat. Cook, stirring, until butter is foamy and flecked with amber brown bits, 1-2 minutes. (Take a whiff-it should smell deliciously nutty!) Return drained sweet potatoes to pot and mash with sour cream until smooth and creamy. Season with salt and pepper."],"image":"images/recipe_0282.webp","source_file":"Roasted Garlic Dijon Butter Steak with Brussels Sprouts and Mashed Sweet Potatoes.pdf"},{"id":"c42a29c82067","title":"Steak N Gravy Pasta Skillet with Monterey Jack Cheese","category":"Steak","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Diced Steak","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Dried Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Have any fresh herbs in the back of your fridge-say some chives or parsley-just begging to be used? We highly recommend chopping up a handful and sprinkling over your finished dish!","Heat a drizzle of oil in a large pan over medium-high heat. Pat diced steak dry with paper towels. Add steak to hot pan; season generously with salt and pepper. Cook, stirring occasionally, until browned and cooked through, 3-4 minutes. Transfer to a plate.","Stir in 2½ cups water (5 cups for 4 servings), beef stock concentrate, mushroom stock concentrates, and pasta; season with salt and pepper. Increase heat to medium high. Bring to a boil, then reduce heat to low and cover with a lid. Cook, stirring occasionally, until pasta is al dente, 9-11 minutes. (If pasta seems dry, add a splash of water.).","In pan used to cook steak, heat 2 TBSP butter (4 TBSP butter for 4 servings) and onion over medium heat; cook, stirring occasionally, until browned and softened, 4-6 minutes. Add garlic and half the thyme (we sent more); cook until fragrant, 30-60 seconds more. Season with salt and pepper. Add 2 TBSP flour (4 TBSP for 4); stir to coat.","Stir in steak, cream cheese, and sour cream until smooth and creamy. Taste and season with salt and pepper."],"image":"images/recipe_0283.webp","source_file":"Steak N Gravy Pasta Skillet with Monterey Jack Cheese.pdf"},{"id":"f8660a916fde","title":"Melty Mushroom and Onion Quesadillas with Savory Crema and Pico de Gallo","category":"Veggie","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Fry Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Have any fresh cilantro, hot sauce, or guacamole (look at you!) hanging out in your fridge?? Serve any (or all; we fully support your culinary vision) atop your quesadillas!","Wash and dry produce. Trim and thinly slice mushrooms (skip if your mushrooms are pre-sliced!). Halve, peel, and thinly slice onion; finely chop a few slices until you have 2 TBSP (4 TBSP for 4 servings). Dice tomato. Quarter lime. Reserve ½ tsp Fry Seasoning (1 tsp for 4) in a small bowl.","Heat a large drizzle of oil in a large pan over medium-high heat. Add mushrooms, sliced onion, and remaining Fry Seasoning; season with salt and pepper. Cook, stirring, until beginning to brown, 4-6 minutes. Stir in stock concentrate and a splash of water; cook, stirring, until mushrooms are tender and saucy, 1-2 minutes more. (If mushrooms begin to brown too quickly, lower that heat!) Turn off heat; transfer to a plate. Wipe out pan.","Pat chicken or steak dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken or steak; cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes, or until steak reaches desired doneness, 3-5 minutes. Turn off heat; transfer to a plate. Wipe out pan.","Evenly sprinkle one half of each tortilla with pepper jack, then top with veggies and Monterey Jack; fold tortillas in half to create quesadillas.","add sour cream to bowl with reserved Fry Seasoning; stir to combine. Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper. In a medium bowl, combine diced onion, tomato, a squeeze of lime juice, salt, and pepper.","Heat a large drizzle of oil in pan used for veggies over medium heat. Add quesadillas and cook until tortillas are browned and cheese melts, 3-5 minutes per side. (For 4 servings, you may need to work in batches, using a large drizzle of oil for each batch.) Cut into wedges, divide between plates, and serve with savory crema, pico de gallo, and remaining lime wedges on the side."],"image":"images/recipe_0284.webp","source_file":"Melty Mushroom and Onion Quesadillas with Savory Crema and Pico de Gallo.pdf"},{"id":"c4e4c1837fe6","title":"Pork Chili Loaded Sweet Potatoes with Pepper Jack and Southwest Crema","category":"Pork","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Why do we ask you to prick your sweet potatoes all over with a fork in step 1? Not only does this shorten their cook time, it prevents steam from building up and causing the spuds to look like flat tires. Most importantly, it helps ensure a deliciously fluffy interior, and who doesn't want that??","Wash and dry produce. Using a fork, prick sweet potatoes all over. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens.","In a small bowl, combine sour cream and ¼ tsp Southwest Spice Blend (½ tsp for 4 servings; you'll use the rest later). Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","heat a drizzle of oil in a large pan over medium-high heat. Add pork and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add garlic, scallion whites, and remaining Southwest Spice Blend. Cook, stirring, until fragrant, 30 seconds.","Wrap each sweet potato in damp paper towels and place on a microwave-safe plate. Microwave, flipping halfway through, until tender and easily pierced with a fork, about 5 minutes. (For 4 servings, microwave potatoes in batches. Cook time will depend on potato size. For smaller potatoes, check after 5 minutes. For larger potatoes, continue to microwave in 1-minute intervals.) remove from microwave and let cool slightly.","Halve sweet potatoes lengthwise; fluff insides with a fork. Top each half with ½ TBSP butter and sprinkle with salt. Divide sweet potatoes between plates; evenly top with pork chili and cheese. Drizzle with crema (and, if you've got some on hand, hot sauce if desired!). Sprinkle with scallion greens.","Stir tomato paste, stock concentrate, and ⅓ cup water (½ cup for 4 servings) into pan with pork mixture. Cook, stirring, until thickened, 1-2 minutes. Season with salt and pepper.","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0285.webp","source_file":"Pork Chili Loaded Sweet Potatoes with Pepper Jack and Southwest Crema.pdf"},{"id":"c7ef2df7d66e","title":"Spiced Chickpea and Couscous Bowls with Smoky Carrots Creamy Lemon Sauce and Feta","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Chickpeas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Carrots","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Dairy & Eggs"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["When prepping your chickpeas (aka garbanzo beans), you'll wanna get them as dry as possible to help them roast to crispy perfection. (The more moisture there is on the surface, the more likely they are to steam.) After draining and rinsing the 'banzos, place them on a layer of paper towels and pat dry while gently rolling them around to remove any excess water.","Toss chickpeas on a baking sheet with a large drizzle of oil, Turkish Spice, salt, and pepper. Place garlic foil packet on same sheet. Toss carrots and onion on a separate sheet with a large drizzle of olive oil, paprika, salt, and pepper.","Adjust racks to top and bottom positions and preheat oven to 425 degrees. Wash and dry produce. Drain and rinse chickpeas; pat dry with paper towels. Peel garlic; place two cloves (four cloves for 4 servings) in the center of a small piece of foil with a drizzle of olive oil. Cinch into a packet. (Reserve remaining garlic for step 4.) Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Halve, peel, and cut onion into ½-inch-thick wedges.","zest and quarter lemon (for 4 servings, zest one lemon and quarter both). Finely chop remaining garlic clove (remaining two cloves for 4). In a small bowl, combine sour cream, a squeeze of lemon juice, and as much lemon zest and chopped garlic as you like. Season with salt and pepper. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency.","Roast chickpeas and garlic foil packet on top rack and veggies on bottom rack until chickpeas are crispy, garlic is softened, and veggies are tender, 20-25 minutes. (It's natural for chickpeas to pop a bit while roasting! They may finish first-if so, remove from sheet and continue roasting garlic and veggies.) Transfer roasted garlic to a cutting board.","Pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken in a single layer; cook, stirring occasionally, until browned and cooked through, 4-6 minutes.","Mash roasted garlic with a fork until smooth; stir into couscous. Taste and season with salt and pepper. Divide couscous, chickpeas, and veggies between bowls in separate sections. Drizzle with creamy lemon sauce and sprinkle with cheese. Pick cilantro leaves from stems and sprinkle over finished bowls. Serve with remaining lemon wedges on the side.","Melt 1 TBSP butter (2 TBSP for 4 servings) in a medium pot over medium-high heat. Add couscous; cook, stirring, until toasted, 1 minute. Stir in ¾ cup water (1½ cups for 4), stock concentrate, and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until couscous is tender, 6-8 minutes. Drain any excess liquid if necessary. Keep covered off heat.","EPRC_12.92_EP1442B / EP1442BPA05_SPICED CHICKPEA & COUSCOUS BOWLS.indd 2 EPRC_12.92_EP1442B / EP1442BPA05_SPICED CHICKPEA & COUSCOUS BOWLS.indd 2 3/1/22 3:19 PM 3/1/22 3:19 PM."],"image":"images/recipe_0286.webp","source_file":"Spiced Chickpea and Couscous Bowls with Smoky Carrots Creamy Lemon Sauce and Feta.pdf"},{"id":"bdb058e7c218","title":"Spicy Black Bean and Pepper Quesadillas with Smoky Red Pepper Crema","category":"Veggie","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cheese Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Tex-Mex Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Pepper Crema","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Black Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Can't get enough heat? If you've got a jalapeño or serrano pepper in your fridge, slice it up and scatter on top of your finished quesadillas for an even spicier spin!","Heat a large drizzle of oil in a large pan over medium-high heat. Add green pepper; cook, stirring, until beginning to brown, 2-3 minutes. Add 2 TBSP water (4 TBSP for 4 servings) and cook, stirring, until softened, 2-3 minutes more.","Pat chicken dry with paper towels. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken or beef; season with salt and pepper. Cook, stirring frequently, until browned and cooked through, 4-6 minutes. Turn off heat; transfer to a plate and cover to keep warm. Wipe out pan.","Place tortillas on a clean work surface; sprinkle one half of each tortilla with Mexican cheese blend. Top with veggie filling, then sprinkle with Monterey Jack. Fold tortillas in half to create quesadillas. Wash out pan.","reduce heat to medium and add beans, Tex-Mex paste, and ¼ cup water (⅓ cup for 4 servings). Cook, stirring, until thickened, 2-3 minutes. Taste and season with salt and pepper, if desired.","Return pan used for veggie filling to medium heat with a large drizzle of oil. Add quesadillas and cook until tortillas are browned and cheese is melted, 3-5 minutes per side. Transfer to a cutting board. (Depending on the size of your pan, you may need to work in batches.).","Chicken is fully cooked when internal temperature reaches 165°. Ground
