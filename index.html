 sour cream and serve with garlic bread."],"image":"images/recipe_0060.webp","source_file":"Broccoli Cheddar Bisque with Garlic Bread.pdf","fpid":"FP-0060","version":"1.2"},{"id":"097bb3c772c5","title":"Lemony Feta Pork Burgers","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Dried Oregano","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["Heat the oven to 425°F. Cut the potatoes into wedges and toss with oil, salt, pepper, and oregano.","Roast the potatoes for 20–25 minutes, turning once, until crisp and tender.","Combine the pork with lemon zest, garlic, oregano, salt, and pepper. Shape into patties.","Cook the patties in an oiled skillet for 4–6 minutes per side, until the center reaches 160°F.","Mix sour cream with lemon juice and crumbled feta.","Toast the buns and assemble the burgers with feta sauce and any included vegetables. Serve with the potatoes."],"image":"images/recipe_0061.webp","source_file":"Lemony Feta Por cipe_0063.webp","source_file":"Smothered Pork Chops with Roasted Carrots and Mashed Potatoes.pdf","fpid":"FP-0063","version":"1.2"},{"id":"f0da7a323f16","title":"Cherry-Chili Pork Chops with Roasted Vegetables","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Dice the potatoes and slice the carrots.","Toss the vegetables separately with oil, salt, and pepper. Roast for 25–30 minutes, until browned and tender.","Pat the pork chops dry and season both sides with salt and pepper.","Cook the pork in an oiled skillet for 4–5 minutes per side, until the center reaches 145°F. Transfer to a plate.","Cook the garlic in the same skillet for 30 seconds. Add cherry jam, chili seasoning, vinegar, stock concentrate, and water.","Simmer until glossy, whisk in butter, and return the pork to the pan. Serve with the roasted vegetables."],"image":"images/recipe_0064.webp","source_file":"Chili Cherry Pork Chops with Roasted Potatoes and Carrots.pdf","fpid":"FP-0064","version":"1.2"},{"id":"cd81b16930f9","title":"Cheesy Steak and Caramelized Onion Sandwiches","category":"Steak","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Black Pepper","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Produce"},{"name":"Butter","amount":5.0,"unit":"tsp","quantity_text":" emon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Bacon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Warm the water or stock in a saucepan and keep it at a gentle simmer.","Cook the bacon in a wide skillet until crisp. Add diced tomato, sugar, salt, pepper, and a splash of water and cook until jammy.","Season the chicken and cook in a separate skillet for 4–6 minutes per side, until the center reaches 165°F. Rest, then slice.","Melt butter in a wide pan and toast the rice for 1 minute.","Add warm liquid about ½ cup at a time, stirring often and allowing each addition to absorb before adding more.","When the rice is creamy and tender, stir in cheese, lemon zest, lemon juice, and butter. Top with chicken, tomato-bacon jam, and parsley."],"image":"images/recipe_0066.webp","source_file":"Lemon Herb Risotto with Chicken and Tomato Bacon Jam.pdf","fpid":"FP-0066","version":"1.2"},{"id":"460cb9fa727f","title":"Mediterranean Meatball Couscous Bowls","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Carrots","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Hot Sauce","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Slice the carrots, dice the tomato and cucumber, and mince the garlic.","Toss the carrots with oil, salt, and pepper and roast for 15 minutes.","Mix the beef with breadcrumbs, oregano, half the garlic, water, salt, and pepper. Shape into meatballs.","Add the meatballs to the sheet pan and roast for 12–15 minutes more, until cooked through.","Toast the couscous and remaining garlic in butter. Add water and stock concentrate, cover, and cook until tender.","Mix grated cucumber with sour cream and lemon. Serve the meatballs over carrot couscous with tomato-cucumber salad and sauce."],"image":"images/recipe_0067.webp","source_file":"Mediterranean Meatball Bowls with Roasted Carrot Couscous Tzatziki Style Sauce and Israeli Salad.pdf","fpid":"FP-0067","version":"1.2"},{"id":"bf54f61d2ec4","title":"Mushroom and Bacon Stuffed Potatoes","category":"Bacon","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Cook the bacon in a wide skillet until crisp. Transfer it to paper towels and reserve a little of the drippings.","Prick the potatoes with a fork, rub with oil, and microwave until tender, turning halfway through.","Cook the sliced onion and mushrooms in the bacon drippings until browned and tender.","Add the garlic, sugar, stock concentrate, and a splash of water. Cook until the vegetables are jammy.","Split the potatoes and fluff the centers with butter, salt, and pepper.","Top with the mushroom mixture, bacon, and mozzarella. Broil for 2–3 minutes, until the cheese is melted and browned."],"image":"images/recipe_0068.webp","source_file":"Garlicky Mushroom and Bacon Stuffed Potatoes with Caramalized Onion and Mozzarella.pdf","fpid":"FP-0068","version":"1.2"},{"id":"4cd53350ceb9","title":"Cheesy Corn Chowder with Jalapeño","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Corn","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Milk","amount":1.0,"unit":"cup","quantity_text":"1 Cup","aisle":"Dairy & Eggs"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Cheddar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Hot Sauce","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"}],"instructions":["Dice the onion and potatoes, mince the garlic and jalapeño, drain the corn, and chop the cilantro.","Melt butter in a large pot. Cook the onion and jalapeño until softened.","Add the garlic and Mexican seasoning and stir for 30 seconds. Sprinkle in the flour and cook for 1 minute.","Gradually stir in the milk, then add the corn, potatoes, stock concentrate, water, salt, and pepper.","Simmer gently for 12–15 minutes, until the potatoes are tender and the chowder has thickened.","Lower the heat and stir in cream cheese, cheddar, and cilantro. Serve with sour cream and extra jalapeño."],"image":"images/recipe_0069.webp","source_file":"Easy Cheesy Corn Chowder with Jalapeno Cilantro and Sour Cream.pdf","fpid":"FP-0069","version":"1.2"},{"id":"53e33f26e87a","title":"Creamy Dijon Chicken with Zucchini","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Heat the oven to 450°F. Dice the potatoes and slice the zucchini and scallions.","Toss the potatoes with oil, Italian seasoning, salt, and pepper. Roast for 20–25 minutes.","Cook the zucchini in an oiled skillet until browned and tender, then transfer to a plate.","Season the chicken and cook in the same skillet for 5–6 minutes per side, until the center reaches 165°F. Rest, then slice.","Cook the scallion whites and garlic briefly. Stir in stock concentrate and water.","Remove from the heat and whisk in sour cream, Dijon, and butter. Serve the sauce over the chicken with potatoes and zucchini."],"image":"images/recipe_0070.webp","source_file":"Creamy Dijon Chicken with Zucchini and Herby Potatoes.pdf","fpid":"FP-0070","version":"1.2"},{"id":"6d3f3a827e21","title":"Tunisian Beef and Apricot Tagine","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Carrots","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Dried Apricots","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sliced Almonds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Slice the carrots and scallions, mince the garlic, and chop the dried apricots.","Cook the carrots in oil over medium-high heat until lightly browned.","Add the beef and cook, breaking it into small pieces, until browned. Stir in the garlic and Tunisian seasoning.","Add the couscous, stock concentrate, and water directly to the skillet. Cover and simmer until the couscous is tender.","Stir in the apricots and scallion whites and cook until warmed through.","Toast the almonds in a dry skillet. Serve the tagine topped with almonds and scallion greens."],"image":"images/recipe_0071.webp","source_file":"Tunisian Spiced Beef and Apricot Tagine with Toasted Couscous Carrots and Almonds.pdf","fpid":"FP-0071","version":"1.2"},{"id":"b0e16d141973","title":"Sweet Chili Pork Tacos with Cabbage Slaw","category":"Pork","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Peanuts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Coleslaw Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ponzu Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Cornstarch","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Zest and quarter the lime, mince the garlic, and roughly chop the peanuts.","Toss part of the cabbage with lime juice, sugar, salt, pepper, and lime zest.","Mix the sour cream with garlic, lime juice, and enough water to make a thin crema.","Cook the pork in an oiled skillet until browned, breaking it into small pieces.","Stir in the remaining cabbage, ponzu, sweet chili sauce, and the cornstarch mixture. Cook until glossy and thickened.","Warm the tortillas and fill with pork, slaw, lime crema, and peanuts."],"image":"images/recipe_0072.webp","source_file":"Sweet Chili Pork Tacos with Cabbage Slaw Zesty Crema and Peanuts.pdf","fpid":"FP-0072","version":"1.2"},{"id":"87af19a76297","title":"Chipotle-Honey Chicken with Brussels Sprouts","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Heat the oven to 425°F. Dice the sweet potatoes and toss them with oil, chipotle seasoning, salt, and pepper.","Roast for 5 minutes, then add the halved Brussels sprouts with oil, salt, and pepper.","Continue roasting for 15–20 minutes, until both vegetables are browned and tender.","Season the chicken and cook in an oiled skillet for 4–6 minutes per side, until the center reaches 165°F.","Stir together honey, chipotle seasoning, stock concentrate, butter, and a splash of water in the skillet.","Simmer until glossy, return the chicken to coat, and serve with the roasted vegetables."],"image":"images/recipe_0073.webp","source_file":"Chipotle Honey Chicken with Brussels Sprouts and Smoky Roasted Sweet Potatoes.pdf","fpid":"FP-0073","version":"1.2"},{"id":"3f871e8b7df4","title":"Chicken Sausage Orzotto with Roasted Tomatoes","category":"Chicken","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Sausage Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Heat the oven to 425°F. Cut the tomatoes into wedges, dice the onion, and wrap the garlic cloves in an oiled foil packet.","Roast the tomatoes and garlic for 15–20 minutes, until soft and lightly browned.","Cook the chicken sausage and onion in a wide skillet until the sausage is browned and the onion is tender.","Stir in the orzo and cook for 1 minute. Add stock and water a little at a time, stirring often.","Continue cooking until the orzo is tender and creamy.","Mash the roasted garlic and stir it into the orzotto with butter and Parmesan. Top with roasted tomatoes."],"image":"images/recipe_0074.webp","source_file":"Chicken Sausage Orzotto with Roasted Tomatoes and Parmesan.pdf","fpid":"FP-0074","version":"1.2"},{"id":"9d2834e6217b","title":"Smashed Burgers with Chipotle Aioli","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"}],"instructions":["Heat the oven to 450°F. Cut the potatoes into wedges and toss with oil, salt, and pepper.","Roast the potatoes for 20–25 minutes, until crisp and golden.","Cook the sliced onion in oil until softened. Add sugar and water and continue cooking until caramelized.","Mix the mayonnaise, ketchup, garlic, and chipotle seasoning to make the aioli.","Place portions of beef in a very hot skillet and press firmly into thin patties. Cook until crisp, flip, and finish to desired doneness.","Toast the buns and assemble with chipotle aioli, smashed burgers, and caramelized onion. Serve with the wedges."],"image":"images/recipe_0075.webp","source_file":"Super Smashed Burgers with Caramelized Onion Chipotle Aioli and Potato Wedges.pdf","fpid":"FP-0075","version":"1.2"},{"id":"c87e026030e6","title":"Tortelloni with Chicken Sausage Bolognese","category":"Chicken","prep_minutes":null,"ready_minutes":15,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tortelloni","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Bring a pot of salted water to a boil. Slice the scallions and mince the garlic.","Cook the tortelloni until they float and are tender. Reserve 1 cup pasta water, then drain.","Cook the chicken sausage and scallion whites in an oiled skillet, breaking the sausage into small pieces.","Add the garlic and cook for 30 seconds. Stir in the tomato sauce ingredients and a splash of pasta water.","Simmer until slightly thickened, then add butter.","Fold in the tortelloni and toss gently until coated. Finish with scallion greens."],"image":"images/recipe_0076.webp","source_file":"Tortelloni with Chicken Sausage Bolognese plus Scallions.pdf","fpid":"FP-0076","version":"1.2"},{"id":"69e7bcdb31f2","title":"Southwest Zucchini Tacos with Kiwi Salsa","category":"Veggie","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Hot Sauce","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Kiwi","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cilantro","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Heat the oven to 425°F. Dice the zucchini, onion, and bell pepper.","Toss the vegetables with oil, Southwest seasoning, salt, and pepper. Roast for 18–20 minutes.","Peel and dice the kiwi. Combine it with tomato, a little onion, cilantro, lime juice, salt, and pepper.","Mix the sour cream with lime juice and enough water to make a crema.","Warm the tortillas until soft and pliable.","Fill with roasted vegetables and Monterey Jack. Top with kiwi salsa, lime crema, and hot sauce."],"image":"images/recipe_0077.webp","source_file":"Southwest Pepper and Zucchini Tacos with Kiwi Salsa Monterey Jack and Lime Crema.pdf","fpid":"FP-0077","version":"1.2"},{"id":"057b54488d0d","title":"Spicy Penne with Chicken Sausage Meatballs","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Ketchup","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Other"}],"instructions":["Heat the oven to 425°F and bring a pot of salted water to a boil. Dice the onion and mince the garlic.","Mix the sausage with breadcrumbs and milk. Shape into meatballs and arrange on a lightly oiled sheet pan.","Roast the meatballs for 10–12 minutes, until browned and fully cooked.","Cook the penne until al dente. Reserve ½ cup pasta water, then drain.","Cook the onion and garlic in oil until softened. Add the red sauce ingredients, cream cheese, peas, butter, and pasta water.","Add the penne and meatballs and toss until coated. Season with chili flakes or hot sauce to taste."],"image":"images/recipe_0078.webp","source_file":"Spicy Penne and Chicken Sausage Meatballs with Creamy Red Sauce and Peas.pdf","fpid":"FP-0078","version":"1.2"},{"id":"d8c3adbff2c2","title":"Cranberry-Glazed Pork Chops","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cranberry Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Dice the potatoes and trim the green beans.","Toss the potatoes with oil, salt, and pepper and roast for 12 minutes.","Add the green beans with a little oil and seasoning and continue roasting until both are tender.","Season the pork chops and cook in an oiled skillet for 4–6 minutes per side, until the center reaches 145°F.","Transfer the pork to a plate. Add cranberry jam, stock ingredients, butter, and a splash of water to the skillet.","Simmer until smooth and glossy, then return the pork to the pan and turn to coat. Serve with the vegetables."],"image":"images/recipe_0079.webp","source_file":"Cranberry Glazed Pork Chops with Crispy Potatoes and Green Beans.pdf","fpid":"FP-0079","version":"1.2"},{"id":"3bcbe85e23c4","title":"Spiced Chicken with Roasted Tomatoes and Mashed Potatoes","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"}],"instructions":["Heat the oven to 425°F. Halve the tomatoes and wrap the garlic cloves in an oiled foil packet.","Toss the tomatoes with olive oil, Tuscan seasoning, salt, and pepper. Roast with the garlic for 20–25 minutes.","Boil the potatoes in salted water until tender, then drain.","Season the chicken with the remaining spice blend and cook in an oiled skillet for 4–6 minutes per side, until the center reaches 165°F.","Mash the potatoes with roasted garlic, butter, sour cream, and enough cooking water to make them creamy.","Serve the chicken with mashed potatoes and roasted tomatoes, spooning any tomato juices over the top."],"image":"images/recipe_0080.webp","source_file":"Spiced Chicken and Roasted Tomatoes with Creamy Mashed Potatoes.pdf","fpid":"FP-0080","version":"1.2"},{"id":"aa2a2b9b1448","title":"Tuscan Sausage Meatballs with Creamy Tomato Linguine","category":"Pork","prep_ me":"Pitas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Diced Steak","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Prepare the vegetables, sauce, and bread while heating a skillet or grill pan.","Cook the meat or vegetables until browned and fully cooked, seasoning as directed.","Stir in the sauce ingredients and simmer until the filling is thick enough to hold on the bread.","Toast, grill, or warm the bread until lightly crisp.","Assemble with the cooked filling, cheese, sauce, and fresh toppings.","Serve immediately with the roasted potatoes, wedges, salad, or other prepared side."],"image":"images/recipe_0149.webp","source_file":"Carne Asada Style Steak Pitas with Tomato Salsa and Southwest Crema.pdf","fpid":"FP-0149","version":"1.3"},{"id":"ac2d225f0663","title":"Beef Bolognese Linguine","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Linguine Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Milk","amount":0.5,"unit":"cup","quantity_text":"½ Cup","aisle":"Dairy & Eggs"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Bring a large pot of salted water to a boil and prepare the vegetables, garlic, and herbs.","Cook the pasta until al dente. Reserve about ½ cup of the cooking water, then drain.","Brown the meat or sauté the vegetables in a wide skillet until fully cooked and lightly caramelized.","Add the garlic, seasonings, tomatoes, cream, or stock ingredients and simmer until the sauce begins to thicken.","Add the drained pasta and toss well, using reserved pasta water as needed to create a smooth sauce.","Finish with cheese, butter, herbs, or lemon and serve immediately."],"image":"images/recipe_0150.webp","source_file":"Beef Bolognese over Linguine.pdf","fpid":"FP-0150","version":"1.3"},{"id":"9fe56bf32c00","title":"Smoky Paprika Pork Chops with Grean Beans and Sour Cream Mashed Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Psst-want to know our trick for THE creamiest mashed potatoes? Always save a splash of potato cooking liquid before draining. Why? It's super-starchy, so adding a few splashes while mashing helps the potatoes get extra-smooth. Best spuds ever!","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry all produce. Dice potatoes into ½-inch pieces. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens.","Place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Mash with sour cream and 1 TBSP butter (2 TBSP for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4). Season with plenty of salt and pepper.","pat pork dry with paper towels; season all over with paprika (reserve a pinch for step 5), salt, and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. (If pork begins to brown too quickly, lower that heat!) Transfer to a plate.","toss green beans on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until tender and crisped at the edges, 12-15 minutes.","Heat a drizzle of oil in pan used for pork over medium-high heat. Add garlic and scallion whites; cook until fragrant, 30 seconds. Stir in ¼ cup water (⅓ cup for 4 servings), stock concentrate, and reserved pinch of paprika. Cook until liquid has reduced, 2-3 minutes. Remove pan from heat. Season with salt and pepper to taste."],"image":"images/recipe_0151.webp","source_file":"Smoky Paprika Pork Chops with Grean Beans and Sour Cream Mashed Potatoes.pdf"},{"id":"266450511248","title":"Lemon Garlic Chicken with Potato and Roasted Bell Pepper Hash","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Black Pepper","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Produce"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"}],"instructions":["In step 5, you'll be layering lemon slices atop your seared chicken. In addition to imparting a deliciously tart flavor, the slices help insulate the chicken, keeping it nice and juicy as it roasts. Next time, try this (ridiculously simple) trick on roasted fish, like salmon or trout!","Toss potatoes on a baking sheet with a large drizzle of oil, half the Italian Seasoning (you'll use more in the next step), salt, and pepper. Roast on top rack until golden brown, 18- 20 minutes.","Adjust racks to top and middle positions and preheat oven to 425 degrees. Wash and dry all produce. Dice potatoes into ½-inch pieces. Peel and finely chop garlic. Zest lemon; thinly slice one half into rounds. (For 4 servings, zest and halve 1 lemon; thinly slice remaining lemon into rounds.) Core, deseed, and dice bell pepper into ½-inch pieces.","Pat chicken dry with paper towels; season with remaining Italian Seasoning, salt, and pepper. Heat a drizzle of oil in a large, preferably ovenproof, pan over medium-high heat. Add chicken and cook until browned, 2-3 minutes per side (it'll finish cooking in the next step). Transfer chicken to a plate. Add bell pepper to same pan; season with salt and pepper. Cook until slightly softened, 1-2 minutes. Remove pan from heat. (If your pan isn't ovenproof, transfer bell pepper to a baking dish now.).","in a medium bowl, whisk together mustard, garlic, juice from lemon half, 1 tsp Italian Seasoning (you'll use the rest in the next step), 1 tsp sugar, and 2 TBSP olive oil. (For 4 servings, use 2 tsp Italian Seasoning, 2 tsp sugar, and 4 TBSP olive oil.) Season with salt and pepper.","Divide chicken between plates. (Feel free to remove and discard the lemon rounds, or keep them on for extra presentation points!) transfer potatoes to pan (or baking dish) with bell pepper; stir to combine. Add potato and pepper hash to serving plates with chicken. Garnish with lemon zest to taste.","Place chicken on top of bell pepper, then drizzle with lemon garlic vinaigrette. Top each piece of chicken with lemon rounds and 1 TBSP butter. Roast on middle rack until chicken is cooked through, 12-14 minutes."],"image":"images/recipe_0152.webp","source_file":"Lemon Garlic Chicken with Potato and Roasted Bell Pepper Hash.pdf"},{"id":"c221e9f3ca00","title":"French Onion Chicken with Roasted Carrots and Mashed Potatoes","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Why do we ask you to cut your carrots on a diagonal in Step 1? The sharp angles of these bias cuts (in chefspeak) won't make the veggies taste any different, but they do make for a striking, restaurant-style presentation. Pinkies up!","Toss carrots on a baking sheet with a drizzle of oil, salt, and pepper. Roast on middle rack until browned and tender, 20-25 minutes.","Adjust rack to middle position and preheat oven to 425 degrees. Wash and dry produce. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces. Dice potatoes into ½-inch pieces. Halve, peel, and thinly slice onion.","Swap in green beans or broccoli for carrots. Roast until browned and tender, 12-15 minutes for green beans or 15-20 minutes for broccoli.","heat a drizzle of oil in a large pan over medium-high heat. Add onion; cook, stirring occasionally, until lightly browned and softened, 8-10 minutes. Sprinkle with 1 tsp sugar (2 tsp for 4 servings), then stir in stock concentrate and 2 TBSP water (4 TBSP for 4). Season with salt and pepper. Cook until caramelized and jammy, 2-3 minutes more. Turn off heat; transfer to a small bowl. Wash out pan.","place potatoes in a medium pot with a large pinch of salt and enough water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid (1 cup for 4 servings), then drain. Return potatoes to pot and mash with 3 TBSP butter (6 TBSP for 4) and sour cream until smooth and creamy, adding splashes of potato cooking liquid (we used ¼ cup; ½ cup for 4). Season with plenty of salt and pepper.","Pat chicken dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in same pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. In the last 1-2 minutes of cooking, top with caramelized onion and cheese. Cover pan until cheese melts. (If your pan doesn't have a lid, cover with a baking sheet!)."],"image":"images/recipe_0153.webp","source_file":"French Onion Chicken with Roasted Carrots and Mashed Potatoes.pdf"},{"id":"87fc8684faa3","title":"Caramelized Onion Burgers with Dijon Aioli and Potato Wedges","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Potato Buns","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Want to give these already-awesome potato wedges even more flavorful flair? Raid your spice cabinet-we especially love garlic powder, onion powder, or cayenne pepper (or a combo of all three!)-and sprinkle a pinch of your seasoning pick over your spuds before roasting in Step 2.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice onion. Peel and finely chop garlic. Halve buns.","Toss potatoes on a baking sheet with a large drizzle of oil, salt, and pepper. Roast until browned and crispy, 20-25 minutes. Transfer to a plate. Meanwhile, form beef into two ½-inch-thick patties (four patties for 4 servings), each slightly wider than a burger bun. Season all over with salt and pepper.","Add bacon to a large dry pan in a single layer; heat over medium-high heat. Cook, turning occasionally, until crispy, 6-10 minutes. Turn off heat; transfer bacon to a paper-towel- lined plate. Wipe out pan.","Heat a drizzle of oil in a large pan over medium-high heat. Add onion and a pinch of salt and pepper. Cook, stirring occasionally, until softened and lightly browned, 8-10 minutes. Add 1 tsp sugar and ¼ cup water (2 tsp sugar and ⅓ cup water for 4 servings). Cook, stirring, until caramelized and jammy, 2-3 minutes more. Turn off heat; transfer to a small bowl. Wipe out pan.","in a second small bowl, combine mustard, 2 TBSP mayonnaise (4 TBSP for 4 servings), and a pinch of garlic. Season with salt and pepper; stir until very smooth. (Use a whisk here if you've got one!).","place 1 TBSP butter (2 TBSP for 4 servings) in a third small microwave-safe bowl; microwave until melted, 30 seconds. Brush onto cut sides of buns. Place buns, cut sides up, on sheet used for potatoes. Toast in oven until golden, 3-5 minutes. Divide toasted buns between plates and fill with patties, caramelized onion, and Dijon aioli. Serve burgers with potato wedges on the side.","Heat a drizzle of oil in pan used for onion over medium-high heat. Add patties and cook to desired doneness, 3-5 minutes per side.","Ground Beef is fully cooked when internal temperature reaches 160°. Bacon is fully cooked when internal temperature reaches 145°."],"image":"images/recipe_0154.webp","source_file":"Caramelized Onion Burgers with Dijon Aioli and Potato Wedges.pdf"},{"id":"36795901a852","title":"Saucy Cherry Balsamic Pork Chops with Roasted Potatoes and Green Beans","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Brown Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Green Beans","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cherry Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["If the cherry jam doesn't immediately dissolve when you add it to the pan, break up any clumps into smaller pieces with your spatula. Eventually, they'll melt into a deliciously sticky-sweet sauce.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Toss potatoes on one side of a baking sheet with a drizzle of oil, salt, and pepper (for 4 servings, spread potatoes out across entire sheet). Roast on middle rack for 8 minutes. Once the potatoes have roasted 8 minutes, remove from oven. toss green beans on empty side of sheet with a drizzle of oil, salt, and pepper. (For 4, leave potatoes roasting; toss green beans on a separate sheet and roast on top rack.) Roast until potatoes are golden and crispy and green beans are lightly browned and tender, 12-15 minutes more.","Adjust rack to middle position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Trim green beans if necessary. Peel and finely chop garlic.","Heat a drizzle of oil in pan used for pork over medium heat. Add garlic and cook, stirring, until fragrant, 30 seconds. Stir in vinegar, jam, stock concentrate, soy sauce, ¼ cup water, 1 TBSP ketchup, and 1 tsp brown sugar (use ½ cup water, 2 TBSP ketchup, and 2 tsp brown sugar for 4 servings). Cook, stirring, until sauce has thickened, 2-3 minutes. Turn off heat; stir in 1 TBSP butter (2 TBSP for 4) until melted. Taste and season with salt and pepper.","pat pork dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. Turn off heat; transfer to a plate. Wipe out pan."],"image":"images/recipe_0155.webp","source_file":"Saucy Cherry Balsamic Pork Chops with Roasted Potatoes and Green Beans.pdf"},{"id":"ebcf3af7e1f1","title":"Crispy Italian Chciken with Garlic Butter Couscous and Zucchini","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":2.0,"unit":"½ tbsp","quantity_text":"2½ TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Did you substitute green beans for zucchini? In step 5, heat a drizzle of oil in a large pan over medium-high heat. Add green beans and ¼ cup water (⅓ cup for 4); season with salt and pepper. Cook, stirring, until water has evaporated and green beans are tender, 6-7 minutes. (If necessary, add another splash of water to help soften.).","In step 3, we instruct you to spread sour cream onto your chicken. Our favorite tool for the job is a basting brush, but if you don't have one, use the back of a spoon! #LIFEHACK.","Place ½ TBSP butter (1 TBSP for 4 servings) in a small microwave-safe bowl; microwave until melted, 30 seconds. Stir in half the panko (all the panko for 4) and 2 tsp Italian Seasoning (4 tsp for 4; you'll use the rest later). Season with salt and pepper.","Preheat oven to 450 degrees. Wash and dry produce. Lightly coat a baking sheet with olive oil. Trim and halve zucchini lengthwise; cut crosswise into ½-inch-thick half-moons. Peel and finely chop garlic.","Pat chicken dry with paper towels; season all over with salt and pepper. Place on prepared baking sheet. Spread sour cream onto tops of chicken, then mound with seasoned panko, pressing to adhere (no need to coat the undersides). Roast until chicken is golden brown and cooked through, 12-15 minutes. (If you'd like a darker crust on your chicken, heat broiler to high. Broil chicken until deeply browned, 2-3 minutes more-just watch to avoid burning!).","melt 1 TBSP butter in a medium pot over medium-high heat. Add garlic and cook until fragrant, 30 seconds. Add couscous and cook until toasted, 1-2 minutes. Stir in stock concentrate, ¾ cup water (1½ cups for 4 servings), and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until couscous is tender, 6-8 minutes. Drain any excess liquid if necessary. Keep covered off heat until ready to serve.","heat a drizzle of oil in a large pan over medium-high heat. Add zucchini; season with remaining Italian Seasoning, salt, and pepper. Cook, stirring, until browned and tender, 4-7 minutes. Turn off heat.","Fluff couscous with a fork; stir in 1 TBSP butter (2 TBSP for 4 servings) and season with salt and pepper. Divide couscous, chicken, and zucchini between plates."],"image":"images/recipe_0156.webp","source_file":"Crispy Italian Chciken with Garlic Butter Couscous and Zucchini.pdf"},{"id":"21942796ea36","title":"Chicken Parm with Monterey Jack Zucchini and Garlic Bread","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Ciabatta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 4, you'll pound your chicken nice and thin between 2 pieces of plastic wrap. (Psst-you could also use a big zip-top bag.) Think of this process as your weeknight stress reliever and (more importantly) your ticket to fast, even cooking and crispy edges! That's a win-win-win.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Heat a drizzle of oil in a large pan over medium-high heat. Add zucchini and season with 1 tsp Italian Seasoning (2 tsp for 4 servings), salt, and pepper. (You'll use the rest of the Italian Seasoning later.) Cook, stirring often, until browned and tender, 4-7 minutes. Turn off heat; transfer to a plate. Wipe out pan. Tent with foil to keep warm.","Adjust rack to top position. Preheat oven to 425 degrees. Wash and dry produce. Trim and slice zucchini crosswise into ½-inch-thick rounds. Peel and finely chop garlic. Halve ciabatta.","Swap in green beans for zucchini; cook 5-6 minutes (if green beans haven't softened, add 1-2 TBSP water and cook a bit longer).","In a shallow dish, combine panko with remaining Italian Seasoning. Season with salt (we used 1 tsp; 2 tsp for 4 servings) and pepper; set aside. Pat chicken dry with paper towels; place between 2 large pieces of plastic wrap. Pound with a rolling pin or mallet until chicken is about ½ inch thick. Season all over with salt and pepper. (If your chicken is already ½ inch thick, skip the pounding!) Brush chicken all over with sour cream. Working with one piece at a time, press chicken into panko mixture, coating all over. Heat a ⅓-inch layer of oil in pan used for zucchini over medium-high heat. Once oil is shimmering and hot enough that a pinch of panko mixture sizzles when added to the pan, add coated chicken. Cook until crust is golden brown and chicken is cooked through, 3-5 minutes per side.","place garlic and 2 TBSP butter (4 TBSP for 4 servings) in a small microwave-safe bowl. Microwave until melted and fragrant, 30 seconds. Brush onto cut sides of ciabatta, then season with salt and pepper. Place cut sides up on a baking sheet. Toast on top rack until lightly golden, 3-5 minutes. Transfer to a cutting board. Once cool enough to handle, halve each piece on a diagonal to create triangles.","Transfer cooked chicken to baking sheet used for ciabatta. Spread tops of chicken with marinara and sprinkle with cheese. Return to oven until cheese melts and begins to brown, 3-4 minutes. (Watch to avoid burning.)."],"image":"images/recipe_0157.webp","source_file":"Chicken Parm with Monterey Jack Zucchini and Garlic Bread.pdf"},{"id":"ab3fcc5a367d","title":"Chicken and Green Bell Pepper Fajitas with Pico de Gallo and Lime Crema","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["We love jalapeños for their fresh kick. If you're looking for a milder spice level, however, remove the ribs and seeds before chopping (that's where most of the heat lives). Our favorite way to do it? Halve the pepper, then use a spoon to completely scrape out the middle.","Wash and dry produce. Dice tomato. Halve, peel, and thinly slice onion; finely chop a few slices until you have 1½ TBSP (3 TBSP for 4 servings). Zest and quarter lime. Finely chop half the jalapeño, removing ribs and seeds if you prefer less heat. (If you like things spicy, thinly slice remaining jalapeño into rounds for garnishing.) Halve, core, and thinly slice bell pepper into strips.","In a small bowl, combine tomato, chopped onion, a squeeze of lime juice, and as much chopped jalapeño as you'd like. Season with salt and pepper.","Heat a drizzle of oil in a large pan over medium-high heat. Add bell pepper; cook, stirring occasionally, until browned and tender, 4-5 minutes. Add sliced onion; cook, stirring occasionally, until softened, 4-5 minutes. (If needed, add a splash of water to help veggies soften.) Season with salt and pepper. Turn off heat and transfer to a plate.","In a second small bowl, combine sour cream, lime zest, 1 TBSP water (2 TBSP for 4 servings), and a squeeze of lime juice. Season with salt and pepper.","wrap tortillas in damp paper towels and microwave until warm and pliable, 30 seconds. Divide tortillas between plates and fill with chicken, veggies, pico de gallo, and lime crema. (If using, garnish with that sliced jalapeño!) Serve with remaining lime wedges on the side.","pat chicken dry with paper towels; season all over with 2 tsp Southwest Spice Blend (4 tsp for 4 servings; measure), salt, and pepper. Heat a drizzle of oil in pan used for veggies over medium-high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes."],"image":"images/recipe_0158.webp","source_file":"Chicken and Green Bell Pepper Fajitas with Pico de Gallo and Lime Crema.pdf"},{"id":"a8d8c8ecba98","title":"Crispy Chickpea Couscous Bowls with Cucumber Salad Hummus and Lemon Crema","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Olive Oil","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chickpeas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Couscous","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Hummus","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Almonds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["When prepping your chickpeas (aka garbanzo beans), you'll wanna get them as dry as possible to help them roast to crispy perfection. (The more moisture there is on the surface, the more likely they are to steam.) After draining and rinsing the 'banzos, place them on a layer of paper towels and pat dry while gently rolling them around to remove any excess water.","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Toss green pepper and onion wedges on a baking sheet with a large drizzle of olive oil, 1 tsp Tunisian Spice Blend (2 tsp for 4 servings), salt, and pepper. Toss chickpeas on a separate sheet with a large drizzle of olive oil, 1 tsp Tunisian Spice Blend (2 tsp for 4; you'll use more later), salt, and pepper. Roast veggies on bottom rack and chickpeas on top rack, stirring halfway through, until veggies are tender and chickpeas are crispy, 18- 20 minutes for veggies and 25-30 minutes for chickpeas.","Adjust racks to bottom and top positions and preheat oven to 425 degrees. Wash and dry produce. Halve, deseed, and slice green pepper into ½-inch-thick strips; halve strips crosswise. Halve, peel, and cut onion into ½-inch-thick wedges; finely chop a wedge or two until you have 2 TBSP (3 TBSP for 4 servings). Drain and rinse chickpeas; pat dry with paper towels. Peel and finely chop garlic. Zest and quarter lemon. Trim and halve cucumber lengthwise; slice crosswise into ¼-inch-thick half- moons.","heat a drizzle of olive oil in a medium pot over medium-high heat. Add couscous and garlic; cook, stirring, until couscous is lightly toasted, 1-2 minutes. Stir in stock concentrate, ¾ cup water (1½ cups for 4 servings), and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until couscous is tender, 6-8 minutes. Keep covered off heat until ready to serve.","in a small bowl, combine hummus, ½ tsp Tunisian Spice Blend (1 tsp for 4 servings; measure), and a large drizzle of olive oil. In a separate small bowl, combine sour cream and juice from two lemon wedges (four wedges for 4). Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Pat chicken or steak dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium- high heat. Add chicken or steak; cook, stirring occasionally, until chicken is browned and cooked through, 4-6 minutes, or until steak reaches desired doneness, 3-5 minutes.","Fluff couscous with a fork; stir in lemon zest and 1 TBSP butter (2 TBSP for 4 servings). Divide couscous between bowls. Top with roasted veggies and chickpeas. Drizzle with as much crema as you like. Add cucumber salad to one side of each bowl. Dollop spiced hummus in the center of each bowl. Garnish with almonds.","In a medium bowl, combine cucumber, chopped onion, juice from remaining lemon, 2 tsp olive oil (4 tsp for 4 servings), and ½ tsp sugar (1 tsp for 4). Season with salt and pepper to taste."],"image":"images/recipe_0159.webp","source_file":"Crispy Chickpea Couscous Bowls with Cucumber Salad Hummus and Lemon Crema.pdf"},{"id":"4561c053c867","title":"Mediterranean Roasted Veggie Sandwhiches with Feta Creamy Hummus and Lemon Herb Potatoes","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Cooking Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Hummus","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Ciabattas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"}],"instructions":["Look-we know that you, like so many of us, have limited kitchen space. That's why we'll never say that you MUST purchase something like a digital scale in order to be successful with our recipes. We do, however, recommend a microplane for zesting your lemon in Step 1. It's the best tool for the job!","Toss potatoes on a baking sheet with a large drizzle of oil, half the Italian Seasoning (you'll use the rest in the next step), salt, and pepper. Roast on top rack until browned and crispy, 20-25 minutes.","Adjust racks to top and middle positions and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Halve bell pepper; remove stem and seeds. Trim and halve zucchini crosswise; cut each half lengthwise into ½-inch-thick planks. Zest and quarter lemon. Peel and finely chop garlic.","in a small bowl, combine hummus, sour cream, half the cheese (save the rest for serving), 1 TBSP olive oil (2 TBSP for 4 servings), and a squeeze of lemon juice. Season with salt and pepper to taste.","place bell pepper halves, cut sides up, on one side of a second baking sheet; drizzle each half with oil and rub to evenly coat. Season with salt and pepper. Toss zucchini on empty side with a drizzle of oil, remaining Italian Seasoning, salt, and pepper. Roast on middle rack until browned and tender, 18-20 minutes.","Pat chicken dry with paper towels. Season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium heat. Add chicken and cook until browned and cooked through, 6-8 minutes per side. (If chicken starts to brown too quickly, lower that heat!) Turn off heat; transfer chicken to a plate.","Spread cut sides of toasted ciabattas with creamy hummus; top with roasted bell pepper, remaining cheese, and as much zucchini as you like. Halve on a diagonal. Toss potatoes with lemon zest to taste. Divide sandwiches and potatoes between plates.","Place garlic and 2 TBSP butter (4 TBSP for 4 servings) in a second small microwave-safe bowl. Microwave until sizzling and fragrant, 30 seconds. Halve ciabattas; brush cut sides with garlic butter and season with salt and pepper. When potatoes have 3-5 minutes left, add ciabattas, cut sides up, to same sheet and toast until golden. (For 4, toast bread in batches if necessary.)."],"image":"images/recipe_0160.webp","source_file":"Mediterranean Roasted Veggie Sandwhiches with Feta Creamy Hummus and Lemon Herb Potatoes.pdf"},{"id":"9b71173f1ec3","title":"Sweet Soy Ramen Stir Fry with Snap Peas Bella Pepper and a Fried Egg","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"½ tsp","quantity_text":"1½ tsp","aisle":"Pantry"},{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Peas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Soy Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cornstarch","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Noodles","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["In step 4, we instruct you to use ¾ of the ramen noodles. Need some inspo for the extra? Cook until tender, then stir them into your favorite soup, or chill and toss with some vinaigrette (try rice vinegar + soy sauce + sesame oil) to make a cold noodle salad as a side dish! You really can't go wrong.","Heat a drizzle of oil in a large pan over medium-high heat. Add snap peas, bell pepper, salt, and a pinch of sugar; cook, stirring occasionally, until slightly tender, 5-6 minutes. Add a splash of water and cook until evaporated, 1 minute. (If veggies are not yet tender, add another splash of water and cook 1-2 minutes more.) Add scallion whites, ginger, garlic, and ¼ tsp salt (½ tsp for 4 servings); cook, stirring, until fragrant, 30-60 seconds. Turn off heat.","Bring a medium pot of salted water to a boil. Wash and dry produce. Trim and remove strings from snap peas by snapping off the stem end with your fingers and gently pulling (like you would a zipper); slice crosswise into ½-inch pieces. Core, deseed, and dice bell pepper into ½-inch pieces. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop ginger and garlic.","Pat chicken dry with paper towels and season all over with salt and pepper. cook through this step as instructed, adding chicken to pan with snap peas and bell pepper; cook, stirring occasionally, until veggies are slightly tender and chicken is browned and cooked through, 5-6 minutes.","in a small bowl, whisk together soy sauce, chili sauce, vinegar, half the cornstarch, 1½ tsp brown sugar (or white sugar), and ¼ cup water. (For 4 servings, use all the cornstarch, 3 tsp brown or white sugar, and ½ cup water.).","add ¾ of the noodles to pot (save the rest for another use). Cook, stirring occasionally, until tender, 1-2 minutes. Drain and thoroughly rinse under cold water for at least 30 seconds. (This stops the cooking and helps prevent sticky noodles!) Transfer noodles to a large bowl; toss with a drizzle of oil and ¼ tsp salt (½ tsp for 4 servings). Return pan with veggies to medium-high heat; stir in sauce. Cook, stirring, until sauce has thickened, 2-3 minutes. Add veggies and sauce to bowl with noodles. Toss to coat. (If needed, stir in water a splash at a time until everything is coated in sauce.) Taste and season with salt and pepper.","Divide noodles between bowls. Top with fried eggs and scallion greens. (Like things spicy? Drizzle with Sriracha if you've got some on hand!).","Heat a drizzle of oil in a medium, preferably nonstick, pan over medium heat. Once hot, crack eggs into pan and cover. (For 4 servings, you may want to cook eggs in batches.) Fry eggs to preference. Lightly season with salt and pepper.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Chicken is fully cooked when internal temperature reaches 165 degrees.","EPRC_12.96_EP1684A / EP1684APA05_SWEET SOY RAMEN STIR-FRY.indd 2 EPRC_12.96_EP1684A / EP1684APA05_SWEET SOY RAMEN STIR-FRY.indd 2 3/1/22 3:34 PM 3/1/22 3:34 PM."],"image":"images/recipe_0161.webp","source_file":"Sweet Soy Ramen Stir Fry with Snap Peas Bella Pepper and a Fried Egg.pdf"},{"id":"897a49968895","title":"Sweet Ponzu Beef Bowls with Pickled Cucumbers and Wasabi Aioli","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Mayonnaise","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":2.0,"unit":"¼ tsp","quantity_text":"2¼ tsp","aisle":"Pantry"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ponzu Sauce","amount":4.0,"unit":"unit","quantity_text":"4","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Want to nail the perfect pot of rice? Once your water boils in step 1, immediately cover the pot with a tight-fitting lid and reduce heat to the lowest setting. Let it simmer until no water remains (resisting the urge to peek!). Finally, let the pot sit off heat for 10 minutes (or more!) while you cook the rest of the meal. This crucial step allows the moisture to redistribute, giving you tender, fluffy grains every time.","wash and dry all produce. Peel and finely chop garlic. Zest and quarter lime (for 4 servings, zest 1 lime and quarter both). Trim and halve cucumber lengthwise; thinly slice crosswise into half-moons. Halve, peel, and dice onion. Trim, peel, and grate carrot. Trim and thinly slice scallions, separating whites from greens.","Place rice in a fine-mesh sieve and rinse until water runs clear. Add to a small pot with 1 cup water (2 cups for 4 servings) and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve.","In a medium bowl, combine cucumber, juice from half the lime, ¼ tsp sugar (½ tsp for 4 servings), and a pinch of salt. Set aside to quick-pickle, stirring occasionally, until ready to serve. In a small bowl, combine mayonnaise, a pinch of garlic, a squeeze of lime juice, and as much wasabi as you'd like (start with a little, then taste and add more from there if desired). Season with salt and pepper.","heat a drizzle of oil in a large pan over medium-high heat. Add onion and scallion whites; cook, stirring, until softened, 4-5 minutes. Add beef, remaining garlic, and 2 tsp sugar (4 tsp for 4 servings). Cook, breaking up meat into pieces, until beef is browned and cooked through, 4-5 minutes. Stir in ponzu. Turn off heat; taste and season with salt and pepper.","Fluff rice with a fork and stir in lime zest and 1 TBSP butter; season with salt. Divide between bowls. Arrange beef, grated carrot, and pickled cucumber (draining first) on top. Top with scallion greens and a squeeze of lime juice. Drizzle with wasabi mayo."],"image":"images/recipe_0162.webp","source_file":"Sweet Ponzu Beef Bowls with Pickled Cucumbers and Wasabi Aioli.pdf"},{"id":"cf8154e886d7","title":"Creamy Buffalo Chicken and Bacon Pasta with Scallions and Tomato","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Linguine Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Cream Cheese","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["How do you know if your pasta water is salty enough? Taste it! (We're serious.) Because your cooking water is the only chance you have to season the pasta itself, it's super important to treat it like you would any other ingredient. The water should taste about as salty as the ocean!","Bring a large pot of salted water to a boil. Wash and dry produce. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Dice tomato into ½-inch pieces. Once water is boiling, add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve ¾ cup pasta cooking water (1½ cups for 4 servings), then drain.","melt 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium-high heat. Add half the panko (all for 4), ¼ tsp Frank's Seasoning (½ tsp for 4), and a pinch of salt and pepper. Cook, stirring occasionally, until evenly toasted and golden brown, 1-2 minutes. Turn off heat; transfer to a small bowl. Wipe out pan.","Pat chicken dry with paper towels; season all over with ½ tsp Frank's Seasoning (1 tsp for 4 servings), salt, and pepper. Heat pan with reserved bacon fat over medium-high heat. Once pan is hot, add chicken and cook until browned and cooked through, 4-6 minutes per side. (Lower heat if chicken begins to brown too quickly.) Transfer chicken to a plate; cover with foil to keep warm.","Add bacon to same pan in a single layer; heat over medium-high heat. Cook, turning occasionally, until crispy, 6-10 minutes. Turn off heat; transfer bacon to a paper-towel-lined plate. Once cool enough to handle, roughly chop. discard all but a thin layer of bacon fat from pan.","Add drained pasta and half the chopped bacon to pan with sauce; toss until pasta is well coated, 20-30 seconds. Remove pan from heat. Slice chicken crosswise. Divide pasta between bowls and top with chicken. Sprinkle with remaining tomato, remaining chopped bacon, scallion greens, and toasted panko. Drizzle with Frank's Hot Sauce.","Melt 1 TBSP butter (2 TBSP for 4 servings) in pan used for chicken over medium-high heat. Add scallion whites and garlic; cook until fragrant and tender, 1-2 minutes. Stir in 1 TBSP flour (2 TBSP for 4) and reserved pasta cooking water, then stir in cream cheese and half the tomato. Season with remaining Frank's Seasoning and a big pinch of salt; stir to combine."],"image":"images/recipe_0163.webp","source_file":"Creamy Buffalo Chicken and Bacon Pasta with Scallions and Tomato.pdf"},{"id":"9b1bf89d2153","title":"Creamy Dijon Chicken with Zucchini and Couscous","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Breasts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Dijon Mustard","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Did you substitute broccoli florets for couscous? In step 1, cut broccoli into bite-size pieces and finely chop just 1 garlic clove. In step 2, toss zucchini and broccoli on a baking sheet with a large drizzle oil, 2 tsp Italian Seasoning, salt, and pepper. Roast until browned and tender, 12-15 minutes. Skip step 3; add broccoli to plates in step 6.","Why are we always telling you to pat your meat dry, as you will in step 1? Well, since you asked, drying protein with paper towels ensures even browning rather than steaming. Crispy, caramelized edges = major flavor!","Toss zucchini on a baking sheet with a large drizzle of olive oil, 1 tsp remaining Italian Seasoning (2 tsp for 4 servings; we sent more), salt, and pepper. Roast until browned and tender, 12-15 minutes.","Preheat oven to 450 degrees. Wash and dry all produce. Trim and halve zucchini lengthwise; slice crosswise into ½-inch-thick half-moons. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Pat chicken dry with paper towels and season all over with half the Italian Seasoning (you'll use more in the next step), salt, and pepper.","melt 1 TBSP butter (2 TBSP for 4 servings) in a medium pot over medium-high heat. Add couscous and half the garlic; cook until toasted and fragrant, 1-2 minutes. Stir in ¾ cup water (1½ cups for 4) and a big pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until tender, 6-8 minutes. Keep covered off heat until ready to serve.","heat a drizzle of oil in a large pan over medium-high heat. Add chicken and cook until browned and cooked through, 5-6 minutes per side. (Lower heat if chicken begins to brown too quickly!) Turn off heat; transfer to a cutting board to rest for 5 minutes. Wash out pan.","Heat a drizzle of oil in same pan over medium heat. Add scallion whites and remaining garlic; cook until fragrant, 30 seconds. Stir in stock concentrate and 2 TBSP water (3 TBSP for 4 servings). Remove pan from heat to cool slightly, then stir in sour cream, mustard, and 1 TBSP butter (2 TBSP for 4) until melted and combined. Season with pepper. (If sauce is too thick, stir in another splash of water.).","Fluff couscous with a fork and season with salt and pepper. Divide chicken, couscous, and zucchini between plates. Drizzle chicken with sauce and sprinkle with scallion greens."],"image":"images/recipe_0164.webp","source_file":"Creamy Dijon Chicken with Zucchini and Couscous.pdf"},{"id":"8410073513dd","title":"Italian Pork Sausage Meatball Subs with Sauteed Pepper and Onion Mozzarella and Roasted Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Milk","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mix","amount":6.0,"unit":"oz","quantity_text":"6 oz","aisle":"Other"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Baguettes","amount":2.0,"unit":"unit","qu
