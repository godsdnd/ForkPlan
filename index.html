op garlic. Drain corn. Drain and rinse black beans. Halve tortillas.","Coat one side of a large piece of aluminum foil with nonstick cooking spray. Cover baking dish tightly with aluminum foil, coated side down, and place on a baking sheet. Bake on middle rack until cheese melts and filling is hot and bubbling, 10-12 minutes. uncover tortilla bake.","Stir corn, black beans, and crushed tomatoes into beef mixture until combined. Season with 1½ tsp salt (3 tsp for 8 servings) and pepper. Spread one-third of the beef mixture in an 8-by-8- inch baking dish in an even layer (use a 9-by-13-inch baking dish for 8). Arrange four tortilla halves in a single layer over the beef mixture, then top with one packet of cheese (eight tortilla halves and two packets of cheese for 8). Repeat two more times with remaining beef mixture, tortillas, and cheese.","Sprinkle tortilla bake with scallion greens. Let cool for at least 5 minutes, then divide between plates or serve family style directly from baking dish.","Ground Beef is fully cooked when internal temperature reaches 160°. When reheating leftovers, be sure they reach 165° as measured with a food thermometer."],"image":"images/recipe_0213.webp","source_file":"Cheesy Tex-Mex Beef Tortilla Bake with Black Beans and Corn.pdf"},{"id":"937435ce400a","title":"Gooey Bacon and Fig Grilled Cheese Sandwhiches with Carrot Fries","category":"Bacon","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"optional","aisle":"Other"}],"instructions":["Ready for your 20-second lesson on flipping a fully loaded grilled cheese? First, use your largest nonstick pan (more surface area = more room to land). Once the first side is golden brown, shove the spatula underneath the sandwich while securing the top with your hand, then flip in one fell swoop. This'll keep all the goodness nestled inside where it belongs.","Trim, peel, and cut carrots into long thin sticks, like fries. (Ours were 3 inches long and ⅓ inch wide.) Toss on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 15-20 minutes.","Preheat oven to 425 degrees. Bring 2 TBSP butter (4 TBSP for 4 servings) to room temperature. Wash and dry all produce. Add bacon to a large pan in a single layer; heat over medium-high heat. Cook, turning occasionally, until crispy, 6-10 minutes. Turn off heat; transfer bacon to a paper-towel-lined plate. Wipe out pan.","Place sandwiches in pan used for bacon; heat over medium heat. (For 4 servings, you'll need to work in batches or use a second pan.) Cook until bread is golden brown and cheese has melted, 5-6 minutes per side. (If sandwiches begin to brown too quickly, lower that heat!) Transfer to a cutting board.","in a small bowl, mix together cream cheese and mozzarella until thoroughly combined (if cream cheese is very cold, microwave until softened, 5-10 seconds). Season with salt and pepper. Assemble sandwiches with bread, cheese mixture, jam, and bacon. Spread outsides of sandwiches with softened butter (if butter is not yet softened, microwave for 5-10 seconds).","Halve sandwiches on a diagonal; divide between plates. Serve carrot fries on the side, with ketchup for dipping if desired.","89 Gooey Bacon & Fig Grilled Cheese Sandwiches_NJ.indd 2 20.89 Gooey Bacon & Fig Grilled Cheese Sandwiches_NJ.indd 2 4/22/20 7:46 AM 4/22/20 7:46 AM."],"image":"images/recipe_0214.webp","source_file":"Gooey Bacon and Fig Grilled Cheese Sandwhiches with Carrot Fries.pdf"},{"id":"a25917fb947a","title":"Hoisin-Glazed Meatloaves with Chili Butter Mashed Sweet Potatoes and Roasted Zucchini","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Chili Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Hoisin Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"}],"instructions":["Don't let its size fool you: our little chili pepper packs a big punch! If you're spice- sensitive (note: this does not equal bland), hold off on adding the chili when mashing your sweet potatoes in step 5. Taste the spuds, then add as much or as little chili as you like (or none at all).","Place bread in a medium bowl with 3 TBSP water (6 TBSP for 4 servings). Let absorb, then break up with your hands until pasty. Add beef, chopped onion, garlic, salt (we used ¾ tsp kosher salt; 1½ tsp for 4), and pepper. Mix to combine, then form into two 1-inch-tall loaves (four loaves for 4). Place on one side of a baking sheet. Bake for 5 minutes (you'll add the zucchini then).","Preheat oven to 450 degrees. Wash and dry all produce. Halve, peel, and finely chop onion until you have 2 TBSP (4 TBSP for 4 servings; use the rest however you'd like). Peel and finely chop garlic. Peel and dice sweet potatoes into ½-inch pieces. Trim and halve zucchini lengthwise; slice crosswise into ½-inch-thick half-moons.","place sweet potatoes in a medium pot with a pinch of salt and enough water to cover by 2 inches. Bring to a boil and cook until tender when pierced with a fork, 15-20 minutes. Reserve ½ cup potato cooking liquid, then drain and return sweet potatoes to pot. While sweet potatoes cook, in a small bowl, combine hoisin and 2 TBSP ketchup (4 TBSP for 4 servings).","remove sheet from oven. toss zucchini on empty side with a drizzle of oil, salt, and pepper (we recommend using tongs for the job). Spoon or brush hoisin mixture onto tops of meatloaves. Return to oven until meatloaves are cooked through, glaze is tacky, and zucchini is browned and tender, 15-20 minutes more.","finely chop chili. Mash sweet potatoes with 2 TBSP butter (4 TBSP for 4 servings) and a pinch of chili (start with a little, then taste and add more from there if desired). Add splashes of reserved potato cooking liquid until smooth and creamy. Season with salt and pepper."],"image":"images/recipe_0215.webp","source_file":"Hoisin-Glazed Meatloaves with Chili Butter Mashed Sweet Potatoes and Roasted Zucchini.pdf"},{"id":"306ffb3ed924","title":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Broccoli","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["In step 2, you'll be making a panade, meaning here a mixture of bread and water. (Psst-if you've got some, you can replace the water with the same amount of milk!) This easy trick helps keep your meatballs moist and tender. ~The more you know~!","In a medium bowl, soak bread with 3 TBSP water (6 TBSP for 4 servings); break up with your hands until pasty. Stir in beef, chopped garlic, 2 TBSP onion (4 TBSP for 4), ½ tsp salt (1 tsp for 4), and plenty of pepper; form into 1-inch balls. Place on one side of a baking sheet along with garlic foil packet. Toss broccoli on empty side with a large drizzle of oil, salt, and pepper. (For 4, divide everything between 2 sheets.) Bake until meatballs are cooked through, broccoli is tender, and garlic is soft, 14-16 minutes.","Preheat oven to 450 degrees. Wash and dry all produce. Peel garlic; finely chop 1 clove (2 cloves for 4 servings) and wrap remaining cloves in a small piece of foil. Halve, peel, and finely chop onion. Cut broccoli florets into bite-size pieces, if necessary. Dice potatoes into ½-inch pieces.","place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender when pierced with a fork, 12-15 minutes. Drain and return potatoes to pot. Cover until ready to mash.","melt 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium heat. Add remaining onion and a pinch of salt and pepper. Cook, stirring, until lightly browned, 8-10 minutes. Add 1 TBSP flour (2 TBSP for 4); stir until lightly browned, about 1 minute. Slowly stir in ¾ cup water (1½ cups for 4) and stock concentrate. Simmer until thickened, 2-4 minutes. Season with salt and pepper. Reduce heat to low.","Transfer roasted garlic to a cutting board; mash cloves with a fork until smooth. Add to pot with potatoes along with sour cream and 2 TBSP butter (4 TBSP for 4 servings). Mash until smooth and creamy, adding splashes of water (or milk, for an extra-rich experience) as necessary. Season with salt and pepper.","Add meatballs to pan with gravy and stir to coat. (If gravy is too thick, stir in a splash of warm water.) Divide mashed potatoes and roasted broccoli between plates. Top potatoes with meatballs and gravy."],"image":"images/recipe_0216.webp","source_file":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Broccoli.pdf"},{"id":"691affbd3846","title":"Easy Chicken Fajitas with Zesty Sour Cream","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Strips","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Want more heat on your feisty fajitas than just the jalapeño? These would also taste great drizzled with your favorite hot sauce!","Heat a drizzle of oil in a large pan over medium-high heat. Add bell pepper and cook, stirring, until slightly softened, 3-4 minutes. Add onion and cook, stirring, until browned and tender, 5-6 minutes more. Season with salt and pepper. Turn off heat; transfer to a plate and set aside.","Wash and dry all produce. Halve, core, and thinly slice bell pepper into strips. Halve, peel, and thinly slice onion. Zest and quarter lime.","Heat a large drizzle of oil in pan used for veggies over high heat. Add chicken in a single layer. Sprinkle with remaining Southwest Spice and season with salt and pepper. Cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Turn off heat.","in a small bowl, combine sour cream, lime zest, a squeeze of lime juice, ½ tsp Southwest Spice (1 tsp for 4 servings; you'll use the rest in the next step), and 1 tsp water (2 tsp for 4). Season with salt and pepper.","Thinly slice jalapeño into rounds, removing ribs and seeds if you prefer less heat. Divide tortillas between plates and fill with chicken and veggies. Drizzle with zesty sour cream and top with as many jalapeño slices as you'd like. Serve with remaining lime wedges on the side."],"image":"images/recipe_0217.webp","source_file":"Easy Chicken Fajitas with Zesty Sour Cream.pdf"},{"id":"e35889a6dc1f","title":"Crispy Katsu Pork Chops with Tangy Lime Slaw Roasted Potato Rounds and Sriracha Mayo","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"more for frying)","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Other"},{"name":"Mayonnaise","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Olive Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Coleslaw Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Katsu Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"}],"instructions":["Katsu is a beloved Japanese dish of panko-fried cutlets topped with a tangy-sweet sauce. The pork chop version is called tonkatsu.","in a medium bowl, whisk together juice from half the lime, 2 TBSP mayonnaise, 2 tsp katsu sauce, 1 tsp sugar, a drizzle of olive oil, and a pinch of lime zest. (For 4 servings, use 4 TBSP mayonnaise, 4 tsp katsu sauce, and 2 tsp sugar.) Taste and season with salt and pepper. Add coleslaw mix and scallions; toss to combine.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ¼-inch-thick rounds. Zest and quarter lime. Trim and thinly slice scallions. Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until browned and tender, 20- 25 minutes.","In a small bowl, combine soy sauce, remaining katsu sauce, 1 TBSP ketchup (2 TBSP for 4 servings), salt, and a big pinch of pepper. Set soy-katsu sauce aside. In a separate small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4) with as much Sriracha as you like. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency.","Place ¼ cup flour (½ cup for 4 servings) in a shallow dish. Crack one egg (two eggs for 4) into a separate shallow dish; beat with 2 TBSP water (4 TBSP for 4). Place panko in a third shallow dish. Season all three dishes generously with salt and pepper. Pat pork dry with paper towels. Place between 2 large pieces of plastic wrap; pound with a mallet or heavy-bottomed pan until pork is about ⅓ inch thick. Season all over with salt and pepper. Working one piece at a time, press pork into seasoned flour until fully coated. Gently shake off excess, then dip both sides into beaten egg. Let excess egg drip off, then press into seasoned panko until fully coated. (For less mess, use tongs to dip and transfer!).","Divide pork, potatoes, and lime slaw between plates. Top pork with as much soy-katsu sauce as you like. Drizzle potatoes with as much Sriracha mayo as you like. Serve with any remaining soy-katsu sauce and Sriracha mayo for dipping and remaining lime wedges on the side.","Heat a ¼-inch layer of oil in a large pan over medium-high heat. Once oil is hot enough that a pinch of panko sizzles when added to the pan, add coated pork. Cook until golden brown and cooked through, 3-4 minutes per side. (For 4 servings, cook in batches, adding more oil between batches.) Transfer to a paper-towel-lined plate and season with salt and pepper.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Pork is fully cooked when internal temperature reaches 145°. Chicken is fully cooked when internal temperature reaches 165°."],"image":"images/recipe_0218.webp","source_file":"Crispy Katsu Pork Chops with Tangy Lime Slaw Roasted Potato Rounds and Sriracha Mayo.pdf"},{"id":"08b85b00848d","title":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Brussels Sprouts","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Sprouts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"with Roasted Garlic Mashed Potatoes & Brussels Sprouts","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Produce"}],"instructions":["In step 2, you'll be making a panade, meaning here a mixture of bread and water. (Psst-if you've got some, you can replace the water with the same amount of milk!) This easy trick helps keep your meatballs moist and tender. The more you know!","Preheat oven to 450 degrees. Wash and dry produce. Trim and halve Brussels sprouts lengthwise. Peel garlic; finely chop 1 clove (2 cloves for 4 servings) and wrap remaining cloves in a small piece of foil. Halve, peel, and finely chop onion. Dice potatoes into ½-inch pieces.","Toss Brussels sprouts on one side of a baking sheet with a drizzle of oil, salt, and pepper. Roast for 10 minutes (you'll add more to the baking sheet then). Meanwhile, in a medium bowl, soak bread with 3 TBSP water (6 TBSP for 4 servings); break up with your hands until pasty. Stir in beef, chopped garlic, 2 TBSP chopped onion (4 TBSP for 4), salt (we used ½ tsp; 1 tsp for 4), and plenty of pepper; form into 1-inch balls. Once Brussels sprouts have roasted 10 minutes, place meatballs on empty side of sheet along with garlic foil packet. (For 4, divide everything between 2 sheets.) Roast until meatballs are cooked through, Brussels sprouts are browned and tender, and garlic is softened, 10-12 minutes.","melt 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium heat. Add remaining onion and a pinch of salt and pepper. Cook, stirring, until lightly browned, 8-10 minutes. Add 1 TBSP flour (2 TBSP for 4); stir until lightly browned, 1 minute. Slowly stir in ¾ cup water (1½ cups for 4) and stock concentrate. Simmer until thickened, 2-4 minutes. Season with salt and pepper. Reduce heat to low.","place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 12-15 minutes. Drain and return potatoes to pot. Keep covered off heat until ready to mash.","Add meatballs to pan with gravy and stir to coat. (If gravy is too thick, stir in a splash of warm water.) Divide mashed potatoes and roasted Brussels sprouts between plates. Top potatoes with meatballs and gravy.","transfer roasted garlic to a cutting board; mash with a fork until smooth. Add to pot with drained potatoes, along with sour cream and 2 TBSP butter (4 TBSP for 4 servings). Mash until smooth and creamy, adding splashes of water (or milk, for an extra-rich experience). Season with salt and pepper."],"image":"images/recipe_0219.webp","source_file":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Brussels Sprouts.pdf"},{"id":"3b2ade753239","title":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Green Beans","category":"Beef","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"White Bread","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Butter","amount":4.0,"unit":"tbsp","quantity_text":"4 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"with Green Beans & Roasted Garlic Mashed Potatoes","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Produce"}],"instructions":["In Step 2, you'll be making a panade, meaning here a mixture of bread and water. (Psst-if you've got some, you can replace the water with the same amount of milk!) This easy trick helps keep your meatballs moist and tender. The more you know!","Preheat oven to 450 degrees. Wash and dry produce. Peel garlic; finely chop one clove (two cloves for 4 servings) and wrap remaining cloves in a small piece of foil. Halve, peel, and finely chop half the onion (whole onion for 4). Trim green beans if necessary. Dice potatoes into ½-inch pieces.","In a medium bowl, soak bread with 3 TBSP water (6 TBSP for 4 servings); break up with your hands until pasty. Stir in beef, chopped garlic, 2 TBSP chopped onion (4 TBSP for 4), salt (we used ½ tsp; 1 tsp for 4), and plenty of pepper. Form into 1-inch balls; place on one side of a baking sheet along with garlic foil packet. Toss green beans on empty side with a large drizzle of oil, salt, and pepper. (For 4, divide everything between 2 sheets.) Roast until meatballs are cooked through, garlic is softened, and green beans are tender, 10-12 minutes.","melt 1 TBSP butter (2 TBSP for 4 servings) in a large pan over medium heat. Add remaining chopped onion and a pinch of salt and pepper. Cook, stirring, until lightly browned, 8-10 minutes. Add 1 TBSP flour (2 TBSP for 4); stir until lightly browned, 1 minute. Slowly stir in ¾ cup water (1½ cups for 4) and stock concentrate. Simmer until thickened, 2-4 minutes. Season with salt and pepper. Reduce heat to low.","place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Keep covered off heat until ready to mash.","Add meatballs to pan with gravy and stir to coat. (If gravy is too thick, stir in a splash of warm water.) Divide mashed potatoes and green beans between plates. Top potatoes with meatballs and gravy.","transfer roasted garlic to a cutting board; mash with a fork until smooth. Add garlic to pot with drained potatoes, along with sour cream and 3 TBSP butter (6 TBSP for 4 servings). Mash until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; use milk instead for extra richness!). Season with salt and pepper."],"image":"images/recipe_0220.webp","source_file":"Gravy Lovers Meatballs with Roasted Garlic Mashed Potatoes and Green Beans.pdf"},{"id":"d9b37bb6e9d8","title":"Farmers Markey Linguine with Lemon and Parmesan","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mushrooms","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Linguine Pasta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Chives","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to give this dish a spicy kick? If you've got some on hand, sprinkle your finished pasta with a pinch of chili flakes.","Preheat oven to 450 degrees. Wash and dry produce. Trim and halve zucchini lengthwise; cut crosswise into ¾-inch-thick half-moons. Cut tomato into ½-inch-thick wedges. Trim and quarter mushrooms (skip if your mushrooms are pre-sliced!). Peel garlic.","Toss zucchini, tomato, and mushrooms on a baking sheet with a large drizzle of olive oil, salt, and pepper. Place garlic cloves in the center of a small piece of foil and drizzle with olive oil. Cinch into a packet and place on same sheet. (For 4 servings, divide veggies between 2 sheets.) Roast until browned and tender, 15-20 minutes for garlic and 20-25 minutes for veggies. Once garlic is done, transfer to a cutting board and mash cloves with a fork until smooth.","Heat pot with pasta over medium-high heat. Add mashed garlic, cream cheese, lemon zest, half the chives, and 2 TBSP butter (4 TBSP for 4 servings). Stir to combine, then add Parmesan. Stir in splashes of reserved pasta cooking water until pasta is coated in a creamy sauce. Stir in roasted veggies and a squeeze of lemon juice. Season with salt and pepper.","bring a large pot of salted water to a boil. Zest and quarter lemon. Thinly slice chives. Once water is boiling, add pasta to pot. Cook, stirring occasionally, until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water, then drain and return pasta to pot. Toss with a drizzle of olive oil.","pat chicken dry with paper towels; season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Cook chicken until browned and cooked through, 5-6 minutes per side. Transfer to a cutting board."],"image":"images/recipe_0221.webp","source_file":"Farmers Markey Linguine with Lemon and Parmesan.pdf"},{"id":"0873f6d56ebb","title":"Lemon Thyme Chicken Linguine with Sauteed Zucchini","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Dried Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["You may notice that we pretty much always ask you to reserve a bit of pasta cooking water before draining your pasta. Wondering what makes this cloudy water so darn special? It's salty and starchy, and those magical starches help emulsify your sauce (aka turn it silky smooth). Basically, it makes good pasta great, and we'd NEVER leave you with a bowl full of just good.","add pasta to pot. Cook until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water, then drain.","Bring a large pot of salted water to a boil. Wash and dry all produce. Trim and quarter zucchini lengthwise; cut crosswise into ½-inch-thick pieces. Peel and finely chop garlic. Zest and quarter lemon.","heat a drizzle of olive oil in a large pan over medium-high heat. Add zucchini and cook, stirring occasionally, until browned and softened, 7-8 minutes. Season with salt and pepper. Transfer to a plate.","pat chicken dry with paper towels. Season with salt, pepper, and half the thyme (all the thyme for 4 servings). Once zucchini is done, heat a drizzle of olive oil in same pan over medium-high heat. Add chicken and cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Add garlic and cook until fragrant, 1 minute. Reduce heat under pan to low.","Stir pasta, zucchini, cream cheese, sour cream, stock concentrate, half the lemon zest, a squeeze of lemon juice, ¼ cup pasta cooking water (⅓ cup for 4 servings), and 2 TBSP butter (4 TBSP for 4) into pan with chicken until thoroughly combined. Turn off heat; season with salt and pepper. (If sauce seems too thick, add more reserved pasta cooking water a splash at a time until everything is coated in a creamy sauce.).","Divide pasta between bowls. Top with as much remaining lemon zest as you'd like. Serve with remaining lemon wedges on the side."],"image":"images/recipe_0222.webp","source_file":"Lemon Thyme Chicken Linguine with Sauteed Zucchini.pdf"},{"id":"8cc75a86c5b1","title":"Lemony Chickpea and Feta Bowls with Garlic Rice Cucumber Salad and Zesty Sauce","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Chickpeas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cucumber","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Vinaigrette","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Feta Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Hey friend, just wanted to let you know that it's possible (and totally natural) for chickpeas to pop a bit while roasting. What can you do to help? Pat the chickpeas as dry as you can with paper towels after rinsing in step 2. You'll be glad you gave them a little extra TLC-the crispy treasures are worth the effort.","Preheat oven to 425 degrees. Wash and dry produce. Peel and finely chop garlic. Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add garlic and cook, stirring, until fragrant, 30 seconds. Add rice, 1¼ cups water (2¼ cups for 4), and a big pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","drain and rinse chickpeas; pat dry with paper towels. Halve, peel, and thinly slice ¼ of the onion; cut remaining onion into ½-inch-thick wedges. Toss chickpeas and onion wedges on a baking sheet with a large drizzle of olive oil, 2 tsp Turkish Spice Blend (4 tsp for 4 servings), salt, and pepper. (For 4, you may need to divide chickpeas and onion wedges between two sheets.) Roast until chickpeas are lightly crispy and onion is tender, 18-20 minutes.","pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken in a single layer and cook, stirring occasionally, until browned and cooked through, 4-6 minutes.","In a small bowl, combine sour cream with lemon zest. Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper. To bowl with sliced onion, add cucumber, tomato, and as much vinaigrette as you like. Toss to combine; taste and season with salt and pepper.","zest and quarter lemon. Trim and quarter cucumber lengthwise; slice crosswise into ½-inch-thick pieces. Dice tomato. In a medium bowl, toss as much sliced onion as you like with a squeeze of lemon juice and a pinch of salt. (You'll build your salad in this bowl in the next step, so use as much onion as you like. After all, you're the chef!).","Fluff rice with a fork and season with salt and pepper; divide between bowls. Top with roasted chickpeas and onion wedges and cucumber salad in separate sections. Garnish with cheese and drizzle with lemon sauce. Serve with remaining lemon wedges on the side."],"image":"images/recipe_0223.webp","source_file":"Lemony Chickpea and Feta Bowls with Garlic Rice Cucumber Salad and Zesty Sauce.pdf"},{"id":"a297cadd0480","title":"Chicken Sausage Parm Sandwhiches with Roasted Potato Wedges","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Black Pepper","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Produce"},{"name":"Sugar","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Ciabattas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome potato wedges? Raid your spice cabinet-we especially love garlic powder, onion powder, or paprika (or a combo of all three!)-and sprinkle a pinch over your spuds before roasting in step 1.","Preheat oven to 425 degrees. Place 2 TBSP butter (4 TBSP for 4 servings) in a small bowl; bring to room temperature. Wash and dry produce. Halve, peel, and thinly slice half the onion (whole onion for 4 servings). Cut potatoes into ½-inch-thick wedges; toss on a baking sheet with a drizzle of oil, salt, and pepper. Roast until golden and crispy, 20-25 minutes.","heat a drizzle of oil in a medium pan (use a large pan for 4 servings) over medium-high heat. Add sausage and cook, breaking up meat into pieces, until lightly browned, 3-4 minutes. Add as much sliced onion as you like; cook, stirring occasionally, until onion is softened and sausage is browned and cooked through, 4-5 minutes more.","remove sheet from oven and push potatoes to one side of baking sheet. Halve ciabattas; spread cut sides with softened butter. Place on empty side of sheet, cut sides up. Top bottom buns with sausage mixture and mozzarella. Toast in oven until bread is golden and cheese melts, 1-2 minutes.","Reduce heat to medium. Stir marinara, cream cheese, ½ tsp sugar (1 tsp for 4 servings), and a pinch of salt into pan with sausage mixture until thoroughly combined. Stir in ¼ cup water (½ cup for 4); simmer, stirring occasionally, until sauce has slightly reduced, 1-2 minutes. (If mixture seems dry, add a splash more water.) Remove from heat.","Close sandwiches and halve on a diagonal; divide between plates along with potato wedges. If you've got some on hand, serve with ketchup on the side for dipping.","EPRC_17.86_EP1744A / EP1744ASS03_CHICKEN SAUSAGE PARM SANDWICHES.indd 2 EPRC_17.86_EP1744A / EP1744ASS03_CHICKEN SAUSAGE PARM SANDWICHES.indd 2 4/5/22 4:36 PM 4/5/22 4:36 PM."],"image":"images/recipe_0224.webp","source_file":"Chicken Sausage Parm Sandwhiches with Roasted Potato Wedges.pdf"},{"id":"b1107c8a7b38","title":"Crispy Ginger Pork Rolls with Cabbage Carrots and Chili Lime Drizzle","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ponzu Sauce","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Soy Sauce","amount":3.0,"unit":"unit","quantity_text":"3","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Coleslaw Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Chili Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Wanna know our easy trick for picture-perfect rolls? Weave a toothpick into the seam side of each tortilla roll after assembling in Step 4 (like you would a safety pin). This will help the rolls stay intact and keep all that glorious filling (mostly) inside the tortillas. Just remove before eating!","Adjust rack to middle position and preheat oven to 425 degrees. Line a baking sheet with foil and brush lightly with oil. Wash and dry produce. Peel and finely chop ginger until you have 1 tsp (2 tsp for 4 servings). Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens; finely chop whites. Quarter lime. Crack two eggs (four eggs for 4) into a small bowl and whisk until combined and frothy; whisk in stock concentrate, soy sauce, ponzu, and ½ tsp sugar (1 tsp for 4).","Heat a drizzle of oil in a large, preferably nonstick, pan over medium-high heat. Add pork and ½ tsp salt (1 tsp for 4 servings) and cook, breaking up meat into pieces, until beginning to brown, 3-4 minutes. Add coleslaw mix, ginger, garlic, and scallion whites; cook, stirring, until coleslaw mix is just softened, 2-3 minutes more.","Place tortillas on a clean work surface and drizzle with oil; rub to coat both sides. Place a small amount of pork filling on one half of each tortilla; season lightly with salt. (It's OK if all the filling doesn't fit! Serve any remaining filling on the side.) Roll up tortillas, starting with filled sides, to create open-ended rolls. Place, seam sides down, on prepared baking sheet. Bake on middle rack until golden brown and crispy, 8-12 minutes.","Push pork mixture to one side of pan. Add egg mixture to empty side and cook, stirring, until eggs begin to set. Stir pork mixture and egg mixture to combine and cook, stirring, until eggs are scrambled to preference and pork is cooked through, 1-2 minutes more. Turn off heat.","In a second small bowl, combine chili sauce with 2 TBSP mayonnaise and a squeeze of lime juice (use 4 TBSP mayonnaise and a big squeeze of lime juice for 4 servings). Divide rolls between plates and drizzle with chili lime sauce. Sprinkle with scallion greens and serve with remaining lime wedges on the side.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0225.webp","source_file":"Crispy Ginger Pork Rolls with Cabbage Carrots and Chili Lime Drizzle.pdf"},{"id":"ab2b5b5a7b9b","title":"Creole Chicken Sausage Jambalaya with Jasmine Rice","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Sausage Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Hot Sauce","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Celery","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["If your pan doesn't have a lid, no problem! Use the bottom of a baking sheet or a piece of foil in step 4 to help keep the jambalaya warm instead.","Wash and dry produce. Peel and finely chop or grate garlic. Dice tomato into ½-inch pieces. Heat a drizzle of oil in a large pan over medium-high heat. Add sausage and cook, breaking up meat into pieces, until browned, 2-3 minutes (it'll finish cooking in the next step).","Add garlic, tomato, and 2½ tsp Blackening Spice (5 tsp for 4 servings-you'll use the rest later) to pan with sausage. Cook, stirring often, until fragrant, 1 minute. Stir in rice, stock concentrate, 1¾ cups water (3½ cups for 4), and ¾ tsp salt (1½ tsp for 4). Bring to a boil; cook, stirring occasionally, 3-4 minutes. Cover pan with lid and reduce heat to low. Cook until rice is tender, 15-18 minutes. (If mixture seems dry, add a splash more water.).","Heat a drizzle of oil in a medium pan over medium-high heat. Add onion, bell pepper, celery, remaining Blackening Spice, ¾ tsp salt (1¼ tsp for 4 servings), and a pinch of pepper. Cook, stirring occasionally, until softened, 8-10 minutes. Keep covered off heat.","halve, peel, and finely dice half the onion (whole onion for 4 servings). Core, deseed, and dice bell pepper into ½-inch pieces. Thinly slice celery on a diagonal.","stir half the veggies into pan with rice. If you've got some on hand, season with hot sauce from your pantry if desired. Taste and season with salt and pepper. Divide jambalaya between bowls and top with remaining veggies."],"image":"images/recipe_0226.webp","source_file":"Creole Chicken Sausage Jambalaya with Jasmine Rice.pdf"},{"id":"3edfec422797","title":"Creamy Tomato and Bacon Risotto with Fresh Parsley","category":"Bacon","prep_minutes":null,"ready_minutes":45,"servings":2,"ingredients":[{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Parsley","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Tomatoes","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Sugar","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"}],"instructions":["Our trick for achieving a bomb.com risotto? Start with hot broth! (That's why we mean it when we say to use simmering tomato broth in Step 4.) Using hot liquid helps the rice release its natural starches, yielding a creamy, dreamy finished dish.","Place bacon on a baking sheet in a single layer. Roast on middle rack until crispy, 15-20 minutes. (Check often to avoid burning!) Transfer bacon to a paper-towel-lined plate. Once bacon is cool enough to handle, roughly chop.","Adjust rack to middle position and preheat oven to 425 degrees. Wash and dry produce. Halve, peel, and dice onion into ¼-inch pieces. Peel and finely chop garlic. Finely chop parsley. In a medium pot, combine 5 cups water and 1 cup crushed tomatoes (you'll use the rest later); bring to a simmer. (For 4 servings, use a large pot, 10 cups water, and 2 cups crushed tomatoes.).","Add garlic and rice to pan with onion; cook, stirring, until rice is translucent and garlic is fragrant, 1-2 minutes. Add stock concentrate, 1 cup simmering tomato broth, 1 tsp sugar, and 1 tsp salt (2 cups tomato broth, 2 tsp sugar, and 2 tsp salt for 4 servings); stir until liquid has mostly absorbed. Repeat with remaining tomato broth-adding ½ cup at a time and stirring until liquid has mostly absorbed-until rice is al dente and mixture is creamy, 25-30 minutes. (Depending on the size of your pan, you may need a little more or a little less liquid for the risotto. Add water. If you prefer your risotto a little more al dente, cook for less time.).","heat a drizzle of oil in a medium pan (large pan for 4 servings) over medium-high heat. Add onion and season with salt and pepper. Cook, stirring occasionally, until lightly browned and tender, 4-5 minutes.","stir in half the parsley, half the bacon, 2 TBSP butter (4 TBSP for 4 servings), and ¼ cup crushed tomatoes (½ cup for 4; measure-we sent more!) until butter is melted. Taste and season with salt and pepper."],"image":"images/recipe_0227.webp","source_file":"Creamy Tomato and Bacon Risotto with Fresh Parsley.pdf"},{"id":"e5d6094c52a7","title":"Hearty Steak Shepherds Pie with Mashed Potatoes and Fresh Thyme","category":"Steak","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Hey, EP friend! Did you substitute chicken breast strips for diced steak? Cook through the recipe as instructed, swapping in chicken for steak in steps 3 and 6. In step 3, cook the chicken until browned and cooked through, 4-6 minutes.","Have any cheese on hand-say, cheddar or Monterey Jack? Grate some up (if it's not pre-shredded) and fold into your mashed potatoes in step 5 for extra richness.","Place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender when pierced with a fork, 12-15 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Keep covered off heat until ready to mash.","Wash and dry all produce. Dice potatoes into ½-inch pieces. Trim, peel, and dice carrots into ¼-inch pieces. Halve, peel, and dice onion. Pick thyme leaves from stems; roughly chop leaves until you have 1 TBSP (2 TBSP for 4 servings).","pat diced steak dry with paper towels. Heat a large drizzle of oil in a medium pan (use a large pan for 4 servings) over high heat. Add steak and cook, stirring occasionally, until browned and cooked to desired doneness, 2-3 minutes. Season with salt and pepper. Turn off heat; transfer to a plate. Wipe out pan.","Heat a drizzle of oil in same pan over medium-high heat. Add carrots and onion; cook, stirring, until softened, 7-8 minutes. Season with salt and pepper. Add 1 TBSP butter and 2 tsp chopped thyme (2 TBSP butter and 4 tsp thyme for 4 servings). Once butter has melted, add 2 TBSP flour (4 TBSP for 4). Cook, stirring, until lightly browned, 2-3 minutes.","Slowly add 1 cup plain water (1½ cups for 4 servings) to pan with veggies, stirring, until thoroughly combined. Add stock concentrates and season with salt and pepper. Simmer until thickened, 1-2 minutes. If mixture is too thick, stir in a splash more water. Meanwhile, mash potatoes with sour cream and 1 TBSP butter (2 TBSP for 4). Add splashes of reserved potato cooking liquid (or milk, for extra creaminess) as necessary until smooth. Taste and season with salt and pepper.","Stir steak into pan with veggies until thoroughly combined. Spread mashed potatoes on top of steak mixture, leaving a 1-inch gap around edge of pan. Sprinkle with as much remaining chopped thyme as you'd like, then divide between plates.","Steak is fully cooked when internal temperature reaches 145 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK30 NJ-82."],"image":"images/recipe_0228.webp","source_file":"Hearty Steak Shepherds Pie with Mashed Potatoes and Fresh Thyme.pdf"},{"id":"da9081f87b4e","title":"Figgy Thyme Pork Chops with Garlic Mashed Potatoes and Roasted Veggies","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Carrots","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Produce"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Fig Jam","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["To save time on thyme prep, pinch the stem near the top with one hand, then pull down with your other hand against the direction the leaves grow. The leaves should pop right off like ~magic~!","dice potatoes into ½-inch pieces. (For a smoother texture, peel potatoes first.) Place potatoes and garlic cloves in a medium pot and enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 15-20 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes and garlic to pot. Keep covered off heat until ready to mash.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Trim, peel, and cut carrots on a diagonal into 1-inch-thick pieces. Halve, peel, and cut onion into ½-inch-thick wedges. Strip thyme leaves from stems; roughly chop leaves until you have 1 tsp (2 tsp for 4 servings). Reserve remaining whole sprigs for step 4. Peel garlic. Toss carrots and onion on a baking sheet with a large drizzle of oil, chopped thyme, salt, and pepper. Roast on top rack until browned and tender, 25-30 minutes.","Trim and halve Brussels sprouts lengthwise. Toss Brussels sprouts and onion on a baking sheet with a large drizzle of oil, chopped thyme, salt, and pepper. Roast on top rack until browned and tender, 15-20 minutes.","Heat a drizzle of oil in pan used for pork over medium heat. Add stock concentrate, ¼ cup water (⅓ cup for 4 servings), and reserved whole thyme sprigs. Bring to a simmer and cook until slightly thickened, 3-4 minutes. Turn off heat; stir in jam and 1 TBSP butter (2 TBSP for 4) until combined. Discard thyme sprigs.","pat pork dry with paper towels and season with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-6 minutes per side. Turn off heat; transfer to a cutting board. Wipe out pan.","Heat pot with drained potatoes and garlic over medium-low heat. Add sour cream and 2 TBSP butter (3 TBSP for 4 servings); mash until smooth, adding splashes of reserved potato cooking liquid. Season generously with salt and pepper.","EPRC_41.83_EP1543A / EP1543ASS07_Figgy Thyme Pork Chops.indd 2 EPRC_41.83_EP1543A / EP1543ASS07_Figgy Thyme Pork Chops.indd 2 9/21/21 1:06 PM 9/21/21 1:06 PM."],"image":"images/recipe_0229.webp","source_file":"Figgy Thyme Pork Chops with Garlic Mashed Potatoes and Roasted Veggies.pdf"},{"id":"debec00f0a59","title":"Chicken Sausage Penne with Pink Sauce plus Zucchini and Melty Mozz","category":"Chicken","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"}],"instructions":["Can't imagine a bowl of pasta without a kick? If you've got some on hand, add a pinch of chili flakes along with the garlic and Italian Seasoning in step 4 for a spicy spin.","Heat a drizzle of oil in a large, preferably ovenproof, pan over high heat. Add zucchini and season with salt and pepper. Cook, stirring, until browned and tender, 4-5 minutes. Turn off heat; remove from pan and set aside.","Adjust rack to top position and heat broiler to high. Bring a medium pot of salted water to a boil. Wash and dry all produce. Trim and quarter zucchini lengthwise; slice crosswise into ¼-inch-thick pieces. Peel and finely chop garlic.","add pasta to pot. Cook until al dente, 9-11 minutes. Reserve ½ cup pasta cooking water, then drain.","heat a drizzle of oil in pan used for zucchini over medium-high heat. Add sausage; cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add garlic and Italian Seasoning; cook, stirring, until fragrant, 30 seconds. Stir in tomato paste until thoroughly coated.","Slowly stir 1 cup plain water (1½ cups for 4 servings) into pan with sausage mixture until combined. Reduce heat to medium. Simmer, stirring often, until sauce is thickened, 3-5 minutes. Season with salt and pepper. Stir in cream cheese and 1 TBSP butter (2 TBSP butter for 4) until melted.","Stir in drained pasta and zucchini. If needed, add a few splashes of reserved pasta cooking water until everything is thoroughly coated in sauce. Taste and season with salt and pepper. (If your pan isn't ovenproof, transfer pasta mixture to a baking dish.) Sprinkle with mozzarella and broil until cheese is melted and lightly browned, 2-3 minutes. (Watch to avoid burning. The broiler is a powerful tool!) Let cool slightly, then divide between plates.","86 Chicken Sausage Penne with Pink Sauce_NJ.indd 2 12.86 Chicken Sausage Penne with Pink Sauce_NJ.indd 2 2/26/20 10:05 AM 2/26/20 10:05 AM."],"image":"images/recipe_0230.webp","source_file":"Chicken Sausage Penne with Pink Sauce plus Zucchini and Melty Mozz.pdf"},{"id":"77a4ee84ee1a","title":"Italian Chciken Sausage and Orzo Soup with Garlic Bread","category":"Chicken","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Ciabatta","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to give this recipe a hearty twist and up your daily dose of veggies while you're at it? Stir a few handfuls of spinach or chopped kale into your soup at the end of step 4-the greens will wilt and get extra-tender in the broth. *Chef's kiss!*.","Preheat oven to 400 degrees. Wash and dry produce. Trim and thinly slice scallions, separating whites from greens. Trim, peel, and halve carrot lengthwise; cut crosswise into ¼-inch- thick half-moons. Peel and finely chop garlic. Halve ciabatta lengthwise.","Heat a large drizzle of oil in a large pot over medium-high heat. Add scallion whites and carrot; season with salt and pepper. Cook, stirring occasionally, until slightly softened, 3-4 minutes.","Bring soup to a boil, then reduce to a simmer. Cook, stirring often, until orzo is al dente, 8-9 minutes. (If soup gets too thick, add a splash of water!) Taste and season with salt and pepper if desired.","Add sausage to pot with veggies. Cook, breaking up meat into pieces, until browned and cooked through, 5 minutes. Stir in ½ cup orzo (1 cup for 4 servings; measure-we sent more), stock concentrates, 2½ cups water (5 cups for 4), and plenty of salt and pepper.","place garlic and 2 TBSP butter (3 TBSP for 4 servings) in a small microwave-safe bowl. Microwave until butter has melted and garlic is sizzling, 20-30 seconds. Brush garlic butter onto cut sides of ciabatta. Place, cut sides up, on a baking sheet. Toast in oven until golden, 10 minutes. Halve garlic bread on a diagonal.","EPRC_13.86_EP1561A_ITALIAN CHICKEN SAUSAGE & ORZO SOUP.indd 2 EPRC_13.86_EP1561A_ITALIAN CHICKEN SAUSAGE & ORZO SOUP.indd 2 3/8/22 3:32 PM 3/8/22 3:32 PM."],"image":"images/recipe_0231.webp","source_file":"Italian Chciken Sausage and Orzo Soup with Garlic Bread.pdf"},{"id":"860d28dc6844","title":"Italian Pork Sausage Gnocchi Bake with Creamy Tomato Sauce and Mozzarella","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Roma Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Sausage","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Gnocchi","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mozzarella","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Have any fresh herbs in the back of your fridge-say some basil or parsley-just begging to be used? We highly recommend chopping up a handful and sprinkling over your finished dish!","Heat broiler to high. Bring a medium pot of salted water to a boil. Wash and dry produce. Halve, peel, and finely chop onion. Peel and finely chop garlic. Dice tomato. Remove sausage from casing; discard casing.","Heat a drizzle of oil in a medium, preferably ovenproof, pan over medium-high heat (use a large pan for 4 servings). Add onion and season with salt and pepper. Cook, stirring, until softened, 4-5 minutes.","break up gnocchi with your hands to separate. Once water is boiling, add gnocchi to pot. Cook, stirring occasionally, until tender, 3-4 minutes. Reserve 1 cup pasta cooking water, then drain.","Add sausage, garlic, and Italian Seasoning to pan. Cook, breaking up meat into pieces, until sausage is browned and cooked through, 4-5 minutes. Stir in diced tomato and tomato paste; season with salt and pepper. Cook, stirring, until tomato is slightly softened, 2-3 minutes.","Taste and season gnocchi mixture with salt and pepper. (If your pan isn't ovenproof, transfer mixture to a baking dish now.) Evenly sprinkle with mozzarella. Broil until cheese is browned and sauce is bubbly, 2-3 minutes. (Watch to avoid burning. The broiler is a powerful tool!) Divide between plates.","stir ½ cup reserved pasta cooking water (¾ cup for 4 servings), cream cheese, and 1 TBSP butter (2 TBSP for 4) into pan with sausage mixture until thoroughly combined. Add gnocchi; stir to coat. (If sauce is too thick, add another splash or two of pasta cooking water.).","Pork Sausage is fully cooked when internal temperature reaches 160 degrees. Chicken Sausage is fully cooked when internal temperature reaches 165 degrees.","EPRC_30.90_EP1406 / EP1406APS04_Italian Pork Sausage Gnocchi Bake.indd 2 EPRC_30.90_EP1406 / EP1406APS04_Italian Pork Sausage Gnocchi Bake.indd 2 7/6/21 12:00 PM 7/6/21 12:00 PM."],"image":"images/recipe_0232.webp","source_file":"Italian Pork Sausage Gnocchi Bake with Creamy Tomato Sauce and Mozzarella.pdf"},{"id":"1b6934e40dd1","title":"Melty Mozz Tomato Jam and Zucchini Panini with Herby Potato Wedges and Balsamic Ketchup","category":"Veggie","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Olive Oil","amount":5.0,"unit":"tsp","quantity_text":"5 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Ketchup","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Other"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Vinegar","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Shallot","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ciabattas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Zucchini","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Mozzarella","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"}],"instructions":["Ready for your 20-second lesson on flipping panini? First, use your largest pan (more surface area = more room to land). Once the first side is golden, shove the spatula underneath the sandwich while securing the top with your hand, then flip in one fell swoop. This'll keep all the goodness nestled inside where it belongs!","Preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Halve, peel, and thinly slice shallot. Finely dice tomato. Trim and slice zucchini into ¼-inch- thick rounds. Peel and finely chop garlic. Halve ciabattas. In a small bowl, combine 3 TBSP ketchup with 1 tsp vinegar (6 TBSP ketchup and 2 tsp vinegar for 4 servings; you'll use more vinegar later).","Toss potatoes on a baking sheet with a drizzle of olive oil, half the Italian Seasoning (you'll use the rest later), salt, and pepper. Roast until browned and tender, 20-25 minutes.","pat chicken dry with paper towels and season all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken in a single layer; cook, stirring occasionally, until browned and cooked through, 4-6 minutes. Turn off heat; transfer to a plate. Wipe out pan.","toss zucchini in a medium bowl with a drizzle of olive oil, remaining Italian Seasoning, salt, and pepper. Once tomato jam is done, heat a drizzle of olive oil in same pan over medium-high heat. Add zucchini in a single layer; cook until golden brown and just tender, 2-4 minutes per side. Turn off heat; transfer to a plate. Wipe out pan.","heat a drizzle of olive oil in a large pan over medium heat. Add shallot and season with salt and pepper. Cook, stirring, until softened, 2-3 minutes. Add tomato, 1 TBSP vinegar (2 TBSP for 4 servings; measure), 2 TBSP water (4 TBSP for 4), and ½ tsp sugar (1 tsp for 4). Season with salt and pepper. Cook, stirring and breaking up tomato, until mixture is thickened and jammy, 4-5 minutes more. Turn off heat; transfer to a second small bowl. Wash out pan.","Heat a drizzle of olive oil in pan used for zucchini over medium heat. Add sandwiches (for 4 servings, you may need to work in batches or use a second pan) and press down with a spatula or heavy-bottomed pan. Cook, pressing occasionally, until bread is toasted and cheese melts, 2-4 minutes per side. (If pan seems dry when flipping, add another drizzle of olive oil.) Halve panini on a diagonal; divide between plates. Serve potato wedges on the side with balsamic ketchup for dipping.","in a third small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with as much garlic as you like. Season with salt and pepper. Spread top cut sides of ciabattas with garlic mayo; spread bottom cut sides with tomato jam. Fill ciabattas with even layers of zucchini and cheese."],"image":"images/recipe_0233.webp","source_file":"Melty Mozz Tomato Jam and Zucchini Panini with Herby Potato Wedges and Balsamic Ketchup.pdf"},{"id":"69b4a96b6a41","title":"Fried Tomato and Cheesy Spinach Sandwiches with Crispy Potato Wedges and Aioli","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Egg","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Flour","amount":0.25,"unit":"cup","quantity_text":"¼ cup","aisle":"Pantry"},{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Ciabattas","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Tomatoes","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Produce"},{"name":"Seasoning","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Spinach","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Monterey Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Mayonnaise","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Pantry"}],"instructions":["When dredging your tomatoes (aka dipping into the flour, egg, and panko), utilize both hands! Use one hand for coating the tomatoes in flour and the other for dipping in the egg then panko mixtures. This will prevent dreaded breaded fingertips (the HORROR!) and make the whole process a lot less messy.","place ¼ cup flour (½ cup for 4 servings) in a shallow dish. Crack one egg (two eggs for 4) into a second shallow dish; beat with 2 TBSP water (4 TBSP for 4). Combine panko and 1½ tsp Italian Seasoning (3 tsp for 4; you'll use more later) in a third shallow dish. Season all three dishes generously with salt and pepper.","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Slice tomatoes into ½-inch-thick rounds. Roughly chop spinach; place in a large bowl with a drizzle of oil, salt, and pepper. Peel and finely chop garlic. Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until browned and crispy, 20-25 minutes.","Add bacon to a large pan in a single layer; heat over medium-high heat. Cook, turning occasionally, until crispy, 6-10 minutes. Turn off heat; transfer bacon to a paper- towel-lined plate. Wash out pan.","Heat a ⅓-inch layer of oil in a large pan over medium-high heat. Once oil is hot enough that a pinch of panko sizzles when added to pan, add coated tomatoes. (Cook in batches if needed.) Cook until golden brown, 1-2 minutes per side. (Lower heat if panko begins to burn!) Transfer to a paper-towel-lined plate. Season with salt to taste.","Working one slice at a time, press tomatoes into flour until fully coated. Shake off excess, then dip both sides into egg mixture. Let excess egg drip off, then press into seasoned panko until fully coated.","Spread cut sides of bottom halves of ciabattas with as much aioli as you like. Top with 3-4 tomato slices (or as many as will fit) and top halves of ciabattas. Halve sandwiches; divide between plates along with potato wedges. Serve with any remaining aioli on the side for dipping.","Halve ciabattas crosswise; divide cheese and spinach between cut sides of top halves. When potatoes have 1-2 minutes left, push to one side of sheet. (For 4 servings, leave potatoes roasting; add ciabattas to a second sheet and roast on middle rack.) Add ciabattas, cut sides up, to same sheet. Return to oven until spinach is slightly wilted and cheese melts. Meanwhile, in a small bowl, combine mayonnaise, garlic, and ¼ tsp Italian Seasoning (½ tsp for 4). Season with salt and pepper.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Bacon is fully cooked when internal temperature reaches 145°.","EPRC_33.92_EP3388A / EP3388APA01_FRIED TOMATO AND CHEESY SPINACH SANDWICHES.indd 2 EPRC_33.92_EP3388A / EP3388APA01_FRIED TOMATO AND CHEESY SPINACH SANDWICHES.indd 2 7/26/22 4:22 PM 7/26/22 4:22 PM."],"image":"images/recipe_0234.webp","source_file":"Fried Tomato and Cheesy Spinach Sandwiches with Crispy Potato Wedges and Aioli.pdf"},{"id":"3bd924c5328b","title":"Sweet Ginger Chicken Stir Fry Bowls with Bell Pepper and Scallion Rice","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Brown Sugar","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Flour","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"}],"instructions":["Ever wonder why we ask you to separate the white parts of scallions from the green ones? Well, the whites are super oniony and take better to cooking, while the green tops make for a fresh topping or mix-in.","Wash and dry produce. Trim and thinly slice scallions, separating whites from greens; finely chop whites. Core, deseed, and dice bell pepper into 1-inch pieces. Peel and finely chop garlic.","In a small pot, heat a drizzle of oil over medium heat. Add scallion whites and cook, stirring, until fragrant, 20-30 seconds. Add rice, 1½ cups water (3 cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15-18 minutes. Keep covered off heat until ready to serve.","Heat a drizzle of oil in same pan over medium heat. Add bell pepper, garlic, 1 TBSP scallion greens (2 TBSP for 4 servings), and a big pinch of salt. Cook, stirring occasionally, until bell pepper begins to soften, 4-5 minutes.","pat chicken dry with paper towels; transfer to a large bowl and season generously with salt and pepper. Add 1 TBSP flour (2 TBSP for 4 servings) and toss to coat. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken in a single layer; cook, stirring occasionally, until browned and cooked through, 4-6 minutes. (Lower heat if chicken begins to brown too quickly.) Transfer to a plate and set aside.","Fluff rice with a fork; stir in 1 TBSP butter (2 TBSP for 4) until melted. Divide rice between bowls and top with chicken stir-fry. Garnish with remaining scallion greens.","Add umami ginger sauce, ⅓ cup water (⅔ cup for 4 servings), and 1 TBSP brown sugar (2 TBSP for 4; if you don't have brown sugar, swap in an equal amount of white sugar) to pan with veggies; stir to combine. Return chicken to pan and increase heat to medium high. Cook, stirring occasionally, until sauce has thickened, 1-2 minutes. Turn off heat; stir in 1 TBSP butter (2 TBSP for 4)."],"image":"images/recipe_0235.webp","source_file":"Sweet Ginger Chicken Stir Fry Bowls with Bell Pepper and Scallion Rice.pdf"},{"id":"9df43f6789cc","title":"Pork Chili Over Sweet Potatoes with Pepper Jack and Southwest Crema","category":"Pork","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Ground Pork","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Meat & Seafood"},{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Pepper Jack","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Hot Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Why do we ask you to prick your sweet potatoes all over with a fork in step 1? Not only does this shorten their cooking time, it prevents steam from building up and causing the spuds to look like flat tires. Most importantly, it helps ensure a deliciously fluffy interior, and who doesn't want that??","In a small bowl, combine sour cream and ¼ tsp Southwest Spice (½ tsp for 4 servings; you'll use the rest later). Add water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Wash and dry all produce. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens. Using a fork, prick sweet potatoes all over. Place on a microwave-safe plate; set aside.","Microwave sweet potatoes, flipping halfway through, until tender, 6-10 minutes. (If sweet potatoes are still firm, continue to microwave in 1-minute intervals until easily pierced with a fork.) remove from microwave and let cool slightly.","heat a drizzle of oil in a large pan over medium-high heat. Add pork and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-6 minutes. Add garlic, scallion whites, and remaining Southwest Spice. Cook, stirring, until fragrant, 30 seconds.","Stir in tomato paste, stock concentrate, and ⅓ cup water (½ cup for 4 servings). Cook, stirring, until thickened, 1-2 minutes. Season with salt and pepper.","Halve sweet potatoes lengthwise; fluff insides with a fork. Top each half with ½ TBSP butter and sprinkle with salt. Divide sweet potatoes between plates; evenly top with pork chili and cheese. Drizzle with crema and hot sauce if desired. Sprinkle with scallion greens.","89 Pork Chili over Sweet Potatoes_NJ.indd 2 15.89 Pork Chili over Sweet Potatoes_NJ.indd 2 3/18/20 8:45 AM 3/18/20 8:45 AM."],"image":"images/recipe_0236.webp","source_file":"Pork Chili Over Sweet Potatoes with Pepper Jack and Southwest Crema.pdf"},{"id":"eaf19ed36a09","title":"Crispy Caesar Chicken with Roasted Carrots and Garlic Mashed Potatoes","category":"Chicken","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":4.0,"unit":"tsp","quantity_text":"4 tsp","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Dressing","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Breasts","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Other"},{"name":"Parmesan","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Happen to have a lemon hanging out in your kitchen? Zest it up and stir a pinch into your panko mixture in Step 2 for a bright bite!","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","In a small bowl, combine cheese, half the panko (all for 4 servings), and a large drizzle of olive oil; season with salt and pepper. Pat chicken dry with paper towels and season all over with salt and pepper. Evenly spread tops of chicken with 1 tsp dressing each (save the rest for serving). Mound with panko mixture, pressing to adhere (no need to coat the undersides).","Adjust rack to top position (top and middle positions for 4 servings) and preheat oven to 425 degrees. Wash and dry produce. Trim, peel, and cut carrots on a diagonal into ½-inch- thick pieces. Dice potatoes into ½-inch pieces. Peel garlic.","place potatoes and garlic in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve 1 cup potato cooking liquid, then drain and return potatoes and garlic to pot. Keep covered off heat.","Toss carrots on one side of baking sheet with a large drizzle of olive oil and a pinch of salt and pepper. (For 4 servings, spread carrots out across entire baking sheet.) Roast on top rack for 5 minutes, then remove from oven; place chicken, crust sides up, on empty side. (For 4, leave carrots roasting; add chicken to a second sheet and roast on middle rack.) Roast until carrots are browned and tender and chicken is cooked through, 15-20 minutes more.","Swap in broccoli for carrots. Roast for 5 minutes as instructed; add chicken to sheet and roast until chicken is cooked through, 12-15 minutes more.","Swap in green beans for carrots. Roast green beans and chicken together until chicken is cooked through, 12- 15 minutes.","Mash potatoes and garlic with sour cream and 3 TBSP butter (6 TBSP for 4 servings) until smooth, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4).","EPRC_40.81_EP1361L / EP1361LSS01 / EP1361LSS02_CRISPY CAESAR CHICKEN.indd 2 EPRC_40.81_EP1361L / EP1361LSS01 / EP1361LSS02_CRISPY CAESAR CHICKEN.indd 2 9/11/23 3:10 PM 9/11/23 3:10 PM."],"image":"images/recipe_0237.webp","source_file":"Crispy Caesar Chicken with Roasted Carrots and Garlic Mashed Potatoes.pdf"},{"id":"94ea64faac70","title":"Ponzu Pork Meatloaves with a Korean Chili and Sweet Soy Glaze Garlic Sesame Rice and Roasted Carrots","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Ponzu Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Vegetable Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Ketchup","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Other"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Carrots","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["You'll notice that we recommend a fine-mesh sieve for rinsing your rice in step 1. If you don't happen to have one, try lining a standard colander with cheesecloth or a few layers of paper towels instead. Or, you could rinse the rice in a large bowl, using your hand to drain until the starches run off and the water runs clear.","peel and finely chop ginger. Trim and thinly slice scallions, separating whites from greens; finely chop whites. Trim, peel, and cut carrots on a diagonal into ½-inch-thick pieces.","Preheat oven to 425 degrees. Wash and dry all produce. Peel and finely chop garlic. Place rice in a fine-mesh sieve; rinse until water runs clear. Heat a drizzle of oil in a small pot over medium-high heat. Add half the sesame seeds (save the rest for serving) and half the garlic; cook until golden brown and fragrant, 1-2 minutes. Stir in rice and 1 cup water (2 cups for 4). Bring to a boil, then cover and reduce heat to low. Cook until rice is tender, 15 minutes. Keep covered off heat for at least 10 minutes or until ready to serve.","
