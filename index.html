Beef is fully cooked when internal temperature reaches 160°.","EPRC_4.96_EP3486A / EP3486APA01 / EP3486APA02_SPICY BLACK BEAN & PEPPER QUESADILLAS.indd 2 EPRC_4.96_EP3486A / EP3486APA01 / EP3486APA02_SPICY BLACK BEAN & PEPPER QUESADILLAS.indd 2 1/3/23 4:26 PM 1/3/23 4:26 PM."],"image":"images/recipe_0287.webp","source_file":"Spicy Black Bean and Pepper Quesadillas with Smoky Red Pepper Crema.pdf"},{"id":"4e5ec1cb9f41","title":"Sticky Sweet Pepper and Broccoli Bowls with Ginger Rice Sriracha Mayo and a Fried Egg","category":"Veggie","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Eggs","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Bell Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Sesame Seeds","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"}],"instructions":["Want to add a little. je ne sais quoi to this dish? Toast your sesame seeds in a small, dry pan over medium- high heat, stirring often, until golden, 2-3 minutes. This simple step brings out their natural oils (aka nuttiness) and also amps up their crunch factor.","Melt 1 TBSP butter (2 TBSP for 4 servings) in a small pot over medium-high heat. Add half the ginger; cook, stirring, until fragrant, 30 seconds. Stir in rice, 1¼ cups water (2¼ cups for 4), and a big pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","Wash and dry produce. Peel and finely chop or grate ginger. Cut broccoli into bite-size pieces. Halve, peel, and thinly slice onion. Halve, core, and thinly slice bell pepper. Peel and finely chop garlic.","pat chicken dry with paper towels. Season chicken all over with salt and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add chicken and cook, stirring occasionally, until cooked through, 4-6 minutes. Turn off heat; transfer to a plate. Wipe out pan.","heat a drizzle of oil in a large pan over medium-high heat. Add broccoli, onion, and bell pepper; season with salt and pepper. Cook, stirring, until lightly browned and tender, 4-6 minutes. Add garlic and remaining ginger; cook, stirring, until fragrant, 30 seconds. Stir in soy glaze, soy sauce, and ¼ cup water (½ cup for 4 servings). Cook, stirring, until sauce has reduced and veggies are coated, 2-3 minutes. Stir in half the sesame seeds. Turn off heat; transfer veggies to a medium bowl. Wash out pan.","in a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4 servings) with as much Sriracha as you like. (Start with half the Sriracha, then taste and add more from there if you like things spicy!) Add water 1 tsp at a time until mixture reaches a drizzling consistency.","Fluff rice with a fork and season with salt. Divide rice between bowls and top with veggies and fried eggs. Drizzle with as much Sriracha mayo as you like. Sprinkle with remaining sesame seeds.","Heat a drizzle of oil in pan used for veggies over medium heat. Once hot, crack two eggs (four eggs for 4 servings) into pan and cover. (For 4, you may want to cook eggs in batches.) Fry eggs to preference. Season with salt and pepper.","Wash hands and surfaces after handling raw eggs. Consuming raw or undercooked eggs may increase your risk of foodborne illness. Chicken is fully cooked when internal temperature reaches 165°."],"image":"images/recipe_0288.webp","source_file":"Sticky Sweet Pepper and Broccoli Bowls with Ginger Rice Sriracha Mayo and a Fried Egg.pdf"},{"id":"16eac550d56d","title":"Turkey and Pineapple Tacos with Spicy Pickled Onion and Lime Crema","category":"Turkey","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Spice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["If you have a few extra minutes, ditch the microwave in step 4 and try charring your tortillas over the flames of your gas stove! This'll give 'em smoky, fire-touched flavor and a crispier texture. Using tongs and working one at a time, place tortillas directly on the burner until lightly charred on both sides.","Wash and dry produce. Zest and quarter lime. Peel and finely chop garlic. Thinly slice half the jalapeño (whole jalapeño for 4 servings) into rounds, removing ribs and seeds if you prefer less heat. Halve, peel, and thinly slice onion. Drain pineapple (psst-save the juice for adding to cocktails or smoothies).","In a small bowl, combine sour cream, a squeeze of lime juice, a pinch of garlic, 1 TBSP water (2 TBSP for 4 servings), salt, pepper, and as much lime zest as you'd like. In a separate small bowl, combine sliced jalapeño, ⅓ cup onion (⅔ cup for 4), ½ tsp sugar (1 tsp for 4), a squeeze of lime juice, and a pinch of salt and pepper.","Heat a large drizzle of oil in a large pan over medium-high heat. Add remaining onion and a pinch of salt and pepper. Cook, stirring, until softened, 4-5 minutes. Add turkey, Southwest Spice, and another pinch of salt and pepper. Cook, breaking up meat into pieces, until turkey is browned and cooked through, 4-6 minutes. Stir in pineapple and remaining garlic. Cook until browned and fragrant, 1 minute more. Turn off heat.","Divide tortillas between plates; fill with turkey mixture and as many pickled veggies (draining first) as you'd like. Drizzle with lime crema. Serve with remaining lime wedges on the side."],"image":"images/recipe_0289.webp","source_file":"Turkey and Pineapple Tacos with Spicy Pickled Onion and Lime Crema.pdf"},{"id":"bc679232cdbe","title":"Sriracha Pork Stir Fry with Cabbage Zesty Rice and Peanuts","category":"Pork","prep_minutes":null,"ready_minutes":25,"servings":2,"ingredients":[{"name":"Butter","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Dairy & Eggs"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Jasmine Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Peanuts","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Glaze","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sriracha","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Mix","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Look-we know that you (like so many of us) have limited kitchen space. That's why we'll never tell you you MUST purchase something like a digital scale in order to be successful with our recipes. We do recommend a microplane for zesting your lime in Step 2, however. It's the best tool for the job!","Wash and dry produce. In a small pot, combine rice, 1¼ cups water (2¼ cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","zest and quarter lime. Trim and thinly slice scallions, separating whites from greens. Peel and finely chop garlic. Roughly chop peanuts.","In a small bowl, combine soy glaze, half the Sriracha (save the rest for serving), and juice from half the lime. Heat a drizzle of oil in a large pan over medium-high heat. Add scallion whites and garlic; cook, stirring, until fragrant, 30 seconds. Add pork and season with salt and pepper. Cook, breaking up meat into pieces, until pork is browned and cooked through, 4-6 minutes. Add cabbage and carrot mix and stir until slightly softened, 1-2 minutes.","Pat chicken dry with paper towels. Swap in chicken (no need to break up chicken into pieces!) or beef for pork.","Fluff rice with a fork; stir in lime zest and 1 TBSP butter (2 TBSP for 4 servings). Divide rice between bowls. Top with stir-fry and sprinkle with peanuts and scallion greens. Drizzle with as much remaining Sriracha as you like. Serve with remaining lime wedges on the side.","Add soy glaze mixture and 1 TBSP butter (2 TBSP for 4 servings) to pan. Stir until sauce has thickened and stir-fry is evenly coated, 1-2 minutes. Taste and season with salt and pepper if desired. Turn off heat.","Ground Pork is fully cooked when internal temperature reaches 160°. Chicken is fully cooked when internal temperature reaches 165°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0290.webp","source_file":"Sriracha Pork Stir Fry with Cabbage Zesty Rice and Peanuts.pdf"},{"id":"c86fda6c1d39","title":"Shoyu Style Beef Meatball Ramen with Ginger and Scallions","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Breadcrumbs","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Ginger","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"}],"instructions":["To peel ginger, break out a spoon! Using the spoon's tip, apply pressure in a downward motion, carving away the skin. Unlike a vegetable peeler, the mighty spoon allows you to get into ginger's knobby nooks. The more you know!","Wash and dry produce. Trim and thinly slice scallions, separating whites from greens; finely chop whites. Trim, peel, and halve carrot lengthwise; cut on a diagonal into ¼-inch-thick pieces. Peel and finely chop ginger until you have 2 tsp (3 tsp for 4 servings).","In a medium bowl, combine half the panko with chicken stock concentrate and 2 TBSP water (for 4 servings, use all the panko and 4 TBSP water). Add beef, scallion whites, 1 tsp chopped ginger (1½ tsp for 4), ½ tsp salt (1 tsp for 4), and pepper. Mix to combine, then form into 10-12 1½-inch meatballs (20-24 meatballs for 4).","Heat a drizzle of oil in empty pot used for meatballs over medium heat. Add carrot and cook, stirring occasionally, until slightly softened but not browned, 2-3 minutes. Stir in remaining chopped ginger and cook until fragrant, 30 seconds. Add 3½ cups water (7 cups for 4 servings), mushroom stock concentrates, veggie stock concentrates, soy sauce, and 1 tsp salt (2 tsp for 4). Bring to a boil, then reduce to a simmer.","Heat a drizzle of oil in a large pot over medium-high heat. Add meatballs and cook, turning occasionally, until browned on all sides, 7-8 minutes. (Avoid crowding the pot! Cook meatballs in batches if necessary.) Transfer meatballs to a plate. (Meatballs will finish cooking in the next step.) Reserve pot.","Return meatballs to same pot and cook until meatballs are cooked through, 2-3 minutes. Season with salt to taste if necessary. Add three-quarters of the ramen noodles (use one and a half packages for 4 servings; save remaining ramen for another use) and cook, stirring, until noodles are softened, 1 minute more."],"image":"images/recipe_0291.webp","source_file":"Shoyu Style Beef Meatball Ramen with Ginger and Scallions.pdf"},{"id":"b1a624bf643e","title":"Southern Style Pork Chops and Gravy with Roasted Broccoli and Mashed Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":40,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":3.0,"unit":"tbsp","quantity_text":"3 TBSP","aisle":"Dairy & Eggs"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Dried Thyme","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Garlic Powder","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Concentrates","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Other"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Psst-want to know our trick for THE creamiest mashed potatoes? Always save a splash of potato cooking liquid before draining. Why? It's super-starchy, so adding a few splashes while mashing helps the potatoes get extra-smooth. Best spuds ever!","If you ordered a 6-serving meal, combine the 2- and 4-serving ingredient amounts and cook in batches or larger cooking vessels (where it makes sense). Remember: Larger batches may = longer cook times, so follow the visual and temperature cues. 6 SERVINGS.","Preheat oven to 425 degrees. Wash and dry produce. Cut broccoli into bite-size pieces if necessary. Cut potatoes into ½-inch pieces. Halve, peel, and thinly slice half the onion (whole onion for 4 servings). Peel and finely chop garlic.","Toss broccoli on a baking sheet with a drizzle of oil, salt, and pepper. Roast until browned and tender, 15-20 minutes.","pat pork dry with paper towels; season all over with garlic powder, salt, and pepper. Place ¼ cup flour (½ cup for 4 servings) in a shallow dish. Press pork into flour, turning to lightly coat all over. Heat a large drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-6 minutes per side (reduce heat if pork begins to brown too quickly). Turn off heat; transfer to a plate. Wipe out pan.","place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10-12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot.","If using steak, skip flouring step. Swap in steak or chicken for pork; cook steak to desired doneness, 3-5 minutes per side, or cook chicken until browned and cooked through, 5-7 minutes per side.","Mash potatoes with sour cream and 1 TBSP butter (2 TBSP for 4 servings) until smooth, adding splashes of reserved potato cooking liquid. Taste and season generously with salt and pepper. Divide pork, mashed potatoes, and broccoli between plates. Spoon any remaining gravy over pork.","Melt 2 TBSP butter (4 TBSP for 4 servings) in pan used for pork over medium heat. Add sliced onion and ¼ tsp dried thyme (½ tsp for 4); cook, stirring occasionally, until softened, 4-5 minutes. Add chopped garlic and 1 TBSP flour (2 TBSP for 4); stir until onion is coated and flour starts to turn golden, 2-3 minutes. Gradually stir in ½ cup water (1 cup for 4) until combined. Stir in stock concentrates. Return pork to the pan; turn to coat.","Pork is fully cooked when internal temperature reaches 145°. Steak is fully cooked when internal temperature reaches 145°. Chicken is fully cooked when internal temperature reaches 165°."],"image":"images/recipe_0292.webp","source_file":"Southern Style Pork Chops and Gravy with Roasted Broccoli and Mashed Potatoes.pdf"},{"id":"cbb9ead7ecc9","title":"One Pan Beef Tacos with Kiwi Salsa plus Lime Crema","category":"Beef","prep_minutes":null,"ready_minutes":20,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Kiwi","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["Kiwi looking a little underripe? (Hint: The riper the kiwi is, the browner the fuzzy skin will be.) Toss your chopped kiwi in a bowl with a pinch of sugar and allow it to sit for a few minutes. This process, called maceration, helps make the kiwi sweeter and juicier. The more you know!","Wash and dry produce. Finely dice tomato. Peel and finely dice kiwi. Halve, peel, and thinly slice onion; finely dice a few slices until you have 1 TBSP (2 TBSP for 4 servings). Zest and quarter lime.","In a medium bowl, combine tomato, kiwi, diced onion, and a squeeze of lime juice. Season with salt and pepper. In a small bowl, combine sour cream and a pinch of lime zest to taste. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Add another drizzle of oil, beef, and Mexican Spice Blend to pan with onion. Cook, breaking up meat into pieces, until beef is browned and cooked through, 4-5 minutes. Season with salt and pepper. (If there's excess grease in your pan, pour it out.).","Heat a drizzle of oil in a large pan over medium-high heat. Add sliced onion; cook, stirring occasionally, until beginning to soften, 3-4 minutes.","Pat chicken dry with paper towels. Swap in chicken for beef (no need to break up chicken into pieces!); cook until browned and cooked through, 4-6 minutes.","Wrap tortillas in damp paper towels and microwave until warm and pliable, 30 seconds. Divide tortillas between plates; fill with beef filling, salsa, and crema. Serve tacos with remaining lime wedges on the side.","Reduce heat under pan to medium low. Stir in half the tomato paste (all for 4 servings) and 2 TBSP water (4 TBSP for 4). Cook, stirring, until everything is coated in a thick sauce, 1-2 minutes. Season with salt and pepper.","Ground Beef is fully cooked when internal temperature reaches 160°. Chicken is fully cooked when internal temperature reaches 165°."],"image":"images/recipe_0293.webp","source_file":"One Pan Beef Tacos with Kiwi Salsa plus Lime Crema.pdf"},{"id":"278912a1203e","title":"Philly Style Sloppy Joes with Pepper Jack Green Pepper and Potato Wedges","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Soy Sauce","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Vegetable Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Flour","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome potato wedges? Raid your spice cabinet-we especially love garlic powder, onion powder, or smoked paprika (or a combo of all 3!)-and sprinkle a pinch over your spuds before roasting in step 2.","Toss potatoes on a baking sheet with a large drizzle of oil, salt, and pepper. Roast on top rack until golden brown and crispy, 20-25 minutes.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry all produce. Cut potatoes into ½-inch-thick wedges. Core, deseed, and dice green pepper into ½-inch pieces. Peel and finely chop garlic. In a small bowl, combine mustard, soy sauce, 2 TBSP ketchup, and ¼ cup water. (For 4 servings, combine mustard and soy sauce with 4 TBSP ketchup and ½ cup water.) Set aside.","heat a drizzle of oil in a large pan over medium- high heat. Add green pepper and cook, stirring, until softened and lightly charred, 5-7 minutes. Season with salt and pepper. Transfer to a plate.","Heat another drizzle of oil in same pan over medium-high heat. Add beef and season with salt and pepper. Cook, breaking up meat into pieces, until browned and cooked through, 4-5 minutes. (If there's excess grease in your pan, pour it out.) Add garlic, 1 TBSP butter, and 1 TBSP flour (for 4 servings, use 2 TBSP each of butter and flour). Cook, stirring, until garlic is fragrant and flour is incorporated, about 1 minute.","Stir mustard mixture into pan. Bring to a simmer and cook until sauce is slightly reduced and beef is thoroughly coated, 1 minute. Turn off heat and sprinkle with cheese. Cover pan to melt cheese (if your pan doesn't have a cover, use foil or a baking sheet).","halve and toast buns. Divide buns between plates and fill with beef mixture and green pepper. Serve potato wedges on the side, with more ketchup for dipping if you'd like."],"image":"images/recipe_0294.webp","source_file":"Philly Style Sloppy Joes with Pepper Jack Green Pepper and Potato Wedges.pdf"},{"id":"1395e7a36bb4","title":"Monterey Jack Burgers with Potato Wedges Caramelized Onions and Garlicky Horseradish Sauce","category":"Beef","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Potatoes","amount":5.0,"unit":"unit","quantity_text":"5","aisle":"Produce"},{"name":"Yellow Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ground Beef","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Olive Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"with Potato Wedges, Caramelized Onion & Garlicky Horseradish Sauce","amount":2.0,"unit":"servings","quantity_text":"2 servings","aisle":"Produce"},{"name":"Sugar","amount":1.0,"unit":"¼ tsp","quantity_text":"1¼ tsp","aisle":"Pantry"},{"name":"Ketchup","amount":1,"unit":"unit","quantity_text":"Optional","aisle":"Other"},{"name":"Wasabi","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Want to add, like, 500x more flavor to these already-awesome potato wedges? Raid your spice cabinet-we especially love garlic powder, onion powder, or cayenne pepper (or a combo of all three!)-and sprinkle a pinch over your spuds before roasting in step 2.","Preheat oven to 450 degrees. Wash and dry produce. Cut potatoes into ½-inch-thick wedges. Peel garlic; place in the center of a small piece of foil. Drizzle with olive oil and season with salt and pepper; cinch into a packet. Halve, peel and thinly slice onion.","Toss potatoes on a baking sheet with a drizzle of oil, salt, and pepper. Roast for 10 minutes. Add garlic foil packet to same sheet. Roast until garlic is browned and softened and potatoes are browned and crispy, 12-15 minutes more.","Form beef into two ½-inch-thick patties (four patties for 4 servings), each slightly wider than a burger bun; season all over with salt and pepper. Heat a drizzle of oil in pan used for onion over medium-high heat. Add patties and cook to desired doneness, 3-5 minutes per side. In the last 2 minutes of cooking, sprinkle each patty with cheese; cover pan to melt cheese.","Heat a drizzle of oil in a large pan over medium-high heat. Add onion; cook, stirring occasionally, until browned and softened, 8-10 minutes. Add 1 tsp sugar (2 tsp for 4 servings) and a splash of water; cook, stirring, until onion is caramelized, 2-3 minutes more. Season with salt and pepper. Turn off heat; stir in 1 TBSP butter (2 TBSP for 4). Transfer to a small bowl and cover with foil to keep warm. Wipe out pan.","Spread bottom buns with horseradish sauce; fill buns with patties and caramelized onions. Divide cheeseburgers and potato wedges between plates. If you've got some on hand, serve with ketchup on the side for dipping.","halve and toast buns. Mash roasted garlic with a fork until smooth. In a small bowl, combine mashed garlic with mayonnaise, ¼ tsp sugar (½ tsp for 4 servings), and a pinch of wasabi (taste and add more wasabi if you like). Season with pepper."],"image":"images/recipe_0295.webp","source_file":"Monterey Jack Burgers with Potato Wedges Caramelized Onions and Garlicky Horseradish Sauce.pdf"},{"id":"9fea81b55a27","title":"Turkey Flautas with Pickled Onion and Sour Cream","category":"Turkey","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.25,"unit":"tsp","quantity_text":"¼ tsp","aisle":"Pantry"},{"name":"Red Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tex-Mex Paste","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Cheese Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"},{"name":"Ground Turkey","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Wanna know our easy trick for picture-perfect flautas? Weave a toothpick into the seam side of each flauta after assembling in Step 4 (like you would a safety pin). This'll help the flautas stay intact and keep all that glorious filling inside the tortillas. Just remove before eating!","Adjust rack to middle position and preheat oven to 425 degrees. Wash and dry produce. Halve, peel, and thinly slice half the onion (whole onion for 4 servings). Quarter lime. In a small microwave-safe bowl, combine half the sliced onion with juice from two lime wedges (four wedges for 4). Finely dice remaining sliced onion. Peel and finely chop garlic.","Heat a drizzle of oil in a medium pan over medium-high heat. Add diced onion and cook, stirring occasionally, until slightly softened, 2-3 minutes. Add turkey, garlic, Tex-Mex paste, and ¼ cup water (½ cup for 4 servings). Cook, breaking up meat into pieces, until turkey is cooked through and mixture has thickened, 8-10 minutes. (If mixture gets too dry, add water 1 TBSP at a time.).","Line a baking sheet with foil and lightly oil. Place tortillas on a clean work surface. When filling is done, evenly divide between one half of each tortilla, then sprinkle with cheese. Roll up tortillas, starting with filled sides, to create flautas. Place, seam sides down, on prepared sheet. Bake on middle rack until golden brown, 8-12 minutes.","add ¼ tsp sugar (½ tsp for 4 servings) and a pinch of salt to bowl with sliced onion and lime juice. Cover with plastic wrap and microwave for 30 seconds. Set aside to pickle, stirring occasionally, until ready to serve.","Divide flautas between plates; top with pickled onion (draining first) and sour cream. Serve with remaining lime wedges on the side.","Ground Turkey is fully cooked when internal temperature reaches 165°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0296.webp","source_file":"Turkey Flautas with Pickled Onion and Sour Cream.pdf"},{"id":"cea42515dcc5","title":"Southwest Pork and Green Pepper Tacos with Pico de Gallo and Garlicky Sour Cream","category":"Pork","prep_minutes":null,"ready_minutes":35,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Spice Blend","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Jalapeño","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"},{"name":"Garlic","amount":2.0,"unit":"clove","quantity_text":"2 Cloves","aisle":"Produce"},{"name":"Ground Pork","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Sour Cream","amount":2.0,"unit":"unit","quantity_text":"2","aisle":"Dairy & Eggs"},{"name":"Flour Tortillas","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Bakery"}],"instructions":["We love jalapeños for their fresh kick. If you're looking for a milder spice level, however, remove the ribs and seeds (that's where most of the heat lives) before chopping in Step 1. Our favorite way to do it? Halve the pepper lengthwise, then use a spoon to completely scrape out the middle.","Wash and dry produce. Finely dice tomato. Peel and finely chop onion. Finely chop jalapeño, removing ribs and seeds for less heat. Quarter lime. Peel and finely chop garlic. Halve, deseed, and thinly slice green pepper into strips.","In a small bowl, combine tomato, 2 TBSP onion (4 TBSP for 4 servings), 2 tsp jalapeño (4 tsp for 4; save the rest for garnish if you like), and a big squeeze of lime juice. Taste and season with salt and pepper.","Heat a large drizzle of oil in a large pan over medium-high heat. Add green pepper; cook, stirring, until softened and lightly charred, 5-6 minutes. Stir in remaining onion and remaining garlic; cook, stirring, until softened, 3-4 minutes. Add pork and season with Southwest Spice Blend, salt, and pepper. Cook, breaking up meat into pieces, until pork is browned and cooked through, 4-6 minutes. Turn off heat.","In a second small bowl, combine sour cream, a pinch of garlic, and a squeeze of lime juice. Taste and season with salt, pepper, and more lime juice if you like a tangy punch.","Divide tortillas between plates and fill with pork mixture, pico de gallo, and garlicky sour cream. Serve with any remaining lime wedges on the side. (Sprinkle with remaining jalapeño for an extra kick!).","Ground Pork is fully cooked when internal temperature reaches 160°. Ground Beef is fully cooked when internal temperature reaches 160°."],"image":"images/recipe_0297.webp","source_file":"Southwest Pork and Green Pepper Tacos with Pico de Gallo and Garlicky Sour Cream.pdf"},{"id":"873233bdcfbc","title":"Sweet Umami Beef Bowls with Pickled Cucumber and Sriracha Mayo","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Ground Beef","amount":8.0,"unit":"oz","quantity_text":"8 oz","aisle":"Meat & Seafood"},{"name":"Garlic","amount":3.0,"unit":"clove","quantity_text":"3 Cloves","aisle":"Produce"},{"name":"White Rice","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Pantry"},{"name":"Carrot","amount":3.0,"unit":"oz","quantity_text":"3 oz","aisle":"Produce"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Sugar","amount":2.0,"unit":"¼ tsp","quantity_text":"2¼ tsp","aisle":"Pantry"},{"name":"Cooking Oil","amount":1.0,"unit":"tsp","quantity_text":"1 tsp","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Onion","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Mayonnaise","amount":2.0,"unit":"tbsp","quantity_text":"2 TBSP","aisle":"Pantry"}],"instructions":["Look-we know that you (like so many of us) have limited kitchen space. That's why we'll never tell you you MUST purchase something like a digital scale in order to be successful with our recipes. We do recommend a microplane for zesting your lime in Step 2, however. It's the best tool for the job!","In a small pot, combine rice, 1¼ cups water (2¼ cups for 4 servings), and a pinch of salt. Bring to a boil, then cover and reduce to a low simmer. Cook until rice is tender, 15-20 minutes. Keep covered off heat until ready to serve.","wash and dry produce. Trim and halve cucumber lengthwise; thinly slice crosswise into half-moons. Zest and quarter lime (for 4 servings, zest one lime and quarter both). Peel and finely chop garlic. Halve, peel, and dice onion. Trim and thinly slice scallions, separating whites from greens. Trim, peel, and grate carrot on the largest holes of a box grater.","heat a drizzle of oil in a large pan over medium-high heat. Add onion and scallion whites; cook, stirring, until softened, 4-5 minutes. Add beef, remaining garlic, and 2 tsp sugar (4 tsp for 4 servings). Cook, breaking up meat into pieces, until beef is browned and cooked through, 4-5 minutes. Stir in ponzu. Turn off heat; taste and season with salt and pepper.","In a medium bowl, combine cucumber, juice from half the lime, ¼ tsp sugar (½ tsp for 4 servings), and a pinch of salt. Set aside to pickle, stirring occasionally, until ready to serve. In a small bowl, combine 2 TBSP mayonnaise (4 TBSP for 4), a squeeze of lime juice, a pinch of garlic, and as much Sriracha as you like (start with a little, then taste and add more from there if desired). Season with salt and pepper.","Fluff rice with a fork and stir in lime zest and 1 TBSP butter; season with salt. Divide between bowls. Arrange beef, carrot, and pickled cucumber (draining first) on top. Top with scallion greens and a squeeze of lime juice. Drizzle with Sriracha aioli."],"image":"images/recipe_0298.webp","source_file":"Sweet Umami Beef Bowls with Pickled Cucumber and Sriracha Mayo.pdf"},{"id":"81d254318c87","title":"Smoky Paprika Pork Chops with Broccoli and Sour Cream Mashed Potatoes","category":"Pork","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Cooking Oil","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Pork Chops","amount":10.0,"unit":"oz","quantity_text":"10 oz","aisle":"Meat & Seafood"},{"name":"Broccoli","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Paprika","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Spices"},{"name":"Garlic","amount":1.0,"unit":"clove","quantity_text":"1 Clove","aisle":"Produce"},{"name":"Potatoes","amount":12.0,"unit":"oz","quantity_text":"12 oz","aisle":"Produce"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Concentrate","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Other"}],"instructions":["Psst-want to know our trick for THE creamiest mashed potatoes? Always save a splash of potato cooking liquid before draining. Why? It's super-starchy, so adding a few splashes while mashing helps the potatoes get extra- smooth. Best spuds ever!","Place potatoes in a medium pot with enough salted water to cover by 2 inches. Bring to a boil and cook until tender, 10- 12 minutes. Reserve ½ cup potato cooking liquid, then drain and return potatoes to pot. Mash with sour cream and 1 TBSP butter (2 TBSP for 4 servings) until smooth and creamy, adding splashes of reserved potato cooking liquid (we used ¼ cup; ½ cup for 4). Season with plenty of salt and pepper.","Adjust rack to top position and preheat oven to 425 degrees. Wash and dry produce. Dice potatoes into ½-inch pieces. Cut broccoli into bite-size pieces. Peel and finely chop garlic. Trim and thinly slice scallions, separating whites from greens.","pat pork dry with paper towels; season all over with paprika (reserve a pinch for step 5), salt, and pepper. Heat a drizzle of oil in a large pan over medium-high heat. Add pork and cook until browned and cooked through, 4-5 minutes per side. (If pork begins to brown too quickly, lower that heat!) Transfer to a plate.","toss broccoli on a baking sheet with a drizzle of oil, salt, and pepper. Roast on top rack until tender and crisped at the edges, 15-20 minutes.","Heat a drizzle of oil in pan used for pork over medium-high heat. Add garlic and scallion whites; cook until fragrant, 30 seconds. Stir in ¼ cup water (⅓ cup for 4 servings), stock concentrate, and reserved pinch of paprika. Cook until liquid has reduced, 2-3 minutes. Remove pan from heat. Season with salt and pepper to taste."],"image":"images/recipe_0299.webp","source_file":"Smoky Paprika Pork Chops with Broccoli and Sour Cream Mashed Potatoes.pdf"},{"id":"326e0b15a31e","title":"Spinach Ricotta Ravioli and Chicken Sausage with Tomato and Lemon","category":"Chicken","prep_minutes":null,"ready_minutes":15,"servings":2,"ingredients":[{"name":"Scallions","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Lemon","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Tomato","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Sausage Mix","amount":9.0,"unit":"oz","quantity_text":"9 oz","aisle":"Meat & Seafood"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Butter","amount":1.0,"unit":"tbsp","quantity_text":"1 TBSP","aisle":"Dairy & Eggs"},{"name":"Cream Cheese","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"},{"name":"Sour Cream","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Dairy & Eggs"}],"instructions":["Happen to have some Parm hanging out in your fridge? Grate it up (if it isn't pre-shredded) and sprinkle over your ravioli to really take it over the top. Just say when!","Bring a large pot of salted water to a boil. Wash and dry produce. Trim and thinly slice scallions, separating whites from greens. Dice tomato. Quarter lemon.","Heat a large drizzle of oil in a large pan over medium-high heat. Add sausage, scallion whites, and half the Italian Seasoning (all for 4 servings). Cook, breaking up meat into pieces, until sausage is browned and scallion whites are softened, 3-5 minutes (you'll finish cooking the sausage in Step 4). Stir in tomato and cook until just softened, 1-2 minutes more. Reduce heat to low.","stir stock concentrate, a squeeze of lemon juice, and a small splash of reserved pasta cooking water into pan with sausage mixture (if pasta isn't done cooking, ladle cooking water directly from pot). Cook, scraping up any browned bits from bottom of pan, until sausage is cooked through, 1-2 minutes more. Turn off heat.","add ravioli to pot, then immediately reduce heat to low. Cook, stirring occasionally, until ravioli are tender and floating to the top, 4-5 minutes. Reserve ½ cup pasta cooking water (1 cup for 4 servings), then drain. Gently shake ravioli in strainer to remove as much moisture as possible.","Transfer drained ravioli to pan with sauce; add lemon juice to taste and stir to combine. Season with salt and pepper. Divide ravioli between plates or bowls; garnish with scallion greens. Serve with any remaining lemon wedges on the side.","Add cream cheese, sour cream, and 1 TBSP butter (2 TBSP for 4 servings) to same pan; stir until melted and combined. (If sauce seems too thick, stir in more reserved pasta cooking water 1 TBSP at a time.)."],"image":"images/recipe_0300.webp","source_file":"Spinach Ricotta Ravioli and Chicken Sausage with Tomato and Lemon.pdf"},{"id":"6b41299fddd9","title":"Southwest Beef Fajita Tacos with Pickled Onion and Zesty Crema","category":"Beef","prep_minutes":null,"ready_minutes":30,"servings":2,"ingredients":[{"name":"Pepper","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"},{"name":"Cooking Oil","amount":2.0,"unit":"tsp","quantity_text":"2 tsp","aisle":"Pantry"},{"name":"Sugar","amount":0.5,"unit":"tsp","quantity_text":"½ tsp","aisle":"Pantry"},{"name":"Lime","amount":1.0,"unit":"unit","quantity_text":"1","aisle":"Produce"}],"instructions":["Can't get enough of the heat? If you've got a jalapeño or serrano pepper in your fridge, slice it up and scatter on top of your finished fajita tacos for a spicy spin!","Wash and dry all produce. Halve, peel, and thinly slice onion. Zest and quarter lime (for 4 servings, zest 1 lime and quarter both). Core, deseed, and thinly slice bell pepper into strips. Peel and finely chop garlic.","In a small microwave-safe bowl, combine ¼ of the onion, juice from half the lime, ½ tsp sugar (1 tsp for 4 servings), 1 TBSP water (2 TBSP for 4), and salt. Stir until sugar and salt are mostly dissolved. Microwave for 30 seconds. Set aside to pickle, stirring occasionally, until ready to serve. In a separate small bowl, combine sour cream with lime zest to taste. Stir in water 1 tsp at a time until mixture reaches a drizzling consistency. Season with salt and pepper.","Heat a drizzle of oil in pan used for veggies over medium-high heat. Add beef and remaining Southwest Spice. Cook, breaking up meat into pieces, until browned, 3-4 minutes. pour out any excess grease from pan. Stir in garlic, Tex-Mex paste, and a splash of water. Cook until beef is cooked through and saucy, 1-2 minutes more. Turn off heat. Taste and season with salt and pepper.","Heat a drizzle of oil in a large pan over medium-high heat. Add bell pepper and cook, stirring, until slightly softened, 3-4 minutes. Add remaining onion; cook, stirring, until browned and tender, 5-6 minutes more. Season with half the Southwest Spice (you'll use the rest in the next step), salt, and pepper. Transfer to a plate and set aside.","Divide tortillas between plates; fill with beef and veggies. Drizzle with zesty crema and top with as much pickled onion (draining first) as you'd like. Serve with remaining lime wedges on the side.","Ground Beef is fully cooked when internal temperature reaches 160 degrees. Chicken is fully cooked when internal temperature reaches 165 degrees. WK28-89.","EPRC_28.89_EP1607A / EP1607APS05_Southwest Beef Fajita Tacos.indd 2 EPRC_28.89_EP1607A / EP1607APS05_Southwest Beef Fajita Tacos.indd 2 6/22/21 4:54 PM 6/22/21 4:54 PM."],"image":"images/recipe_0301.webp","source_file":"Southwest Beef Fajita Tacos with Pickled Onion and Zesty Crema.pdf"}];

function applyKnownPackageConversions(){
  const norm=v=>String(v||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9]+/g,' ').trim();
  const set=(i,amount,unit,text)=>{i.amount=amount;i.unit=unit;i.quantity_text=text};
  for(const r of RECIPES){
    for(const i of r.ingredients){
      const n=norm(i.name),u=norm(i.unit);
      if(u==='unit'){
        if(/scallion|green onion/.test(n)) set(i,2,'unit','2 scallions');
        else if(/\bcorn\b/.test(n)) set(i,1,'can','1 (15.25 oz) can');
        else if(/reduced fat milk|low fat milk|\bmilk\b/.test(n)) set(i,1,'cup','1 cup (8 fl oz)');
        else if(/cream cheese/.test(n)) set(i,1,'oz','1 oz');
        else if(/sour cream/.test(n)) set(i,2,'tbsp','2 tbsp (1 oz)');
        else if(/stock concentrate/.test(n)) set(i,5,'g','5 g');
        else if(/chicken demi glace|chicken demi-glace/.test(n)) set(i,37.5,'g','37.5 g (1.32 oz)');
        else if(/vinegar/.test(n)) set(i,25,'ml','25 ml (0.85 fl oz)');
        else if(/mayonnaise|\bmayo\b/.test(n)) set(i,2,'tbsp','2 tbsp (1 fl oz)');
        else if(/ground beef/.test(n)) set(i,9,'oz','8–10 oz');
        else if(/pork tenderloin/.test(n)) set(i,12,'oz','12 oz');
        else if(/shredded.*cheese|cheese.*shredded|\bcheese\b/.test(n)) set(i,.5,'cup','1/2 cup');
        else if(/ketchup/.test(n)) set(i,2,'tbsp','2 tbsp');
        else if(/couscous/.test(n)) set(i,.5,'cup','1/2 cup');
        else if(/yogurt/.test(n)) set(i,2,'tbsp','2 tbsp (1 oz)');
        else if(/spice blend|seasoning blend/.test(n)) set(i,1,'tbsp','1 tbsp');
        else if(/seasoning|spice|paprika|cumin|oregano|thyme|rosemary|chili powder|garlic powder|onion powder/.test(n)) set(i,1,'tsp','1 tsp');
        else if(/bacon/.test(n)) set(i,4,'slice','4 slices');
        else if(/wasabi/.test(n)) set(i,.15,'oz','0.15 oz');
        else if(/soy sauce/.test(n)) set(i,8,'g','8 g');
        else if(/dijon mustard/.test(n)) set(i,10,'g','10 g (0.35 oz)');
      }
      if(/carrot/.test(n) && String(i.unit).toLowerCase()==='oz' && Number(i.amount)===12){
        i.quantity_text='3–4 medium carrots (12 oz)';
      }
    }
  }
}
applyKnownPackageConversions();
const KEY='everyplatePlannerFinalV1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{favorites:{},ratings:{},plans:{},notes:{},checked:{},purchasedPlans:{},weekOffset:0};state.purchasedPlans=state.purchasedPlans||{};let category='All',query='';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}function monday(d=new Date()){d=new Date(d);let day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day+state.weekOffset*7);return d}function iso(d){return d.toISOString().slice(0,10)}function fmtDate(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}function fmtQty(a,u){if(u==='oz'&&a>=16){let lb=Math.floor(a/16),oz=Math.round((a%16)*10)/10;return lb+' lb'+(oz?' '+oz+' oz':'')}if(u==='tsp'&&a>=3)return (Math.round(a/3*100)/100)+' tbsp';return (Math.round(a*100)/100)+' '+(u||'unit')}function updateStats(){$('#recipeCount').textContent=RECIPES.length;$('#favCount').textContent=Object.keys(state.favorites).filter(k=>state.favorites[k]).length}
function renderChips(){let favTotal=Object.keys(state.favorites).filter(k=>state.favorites[k]).length;let cats=['All','Favorites',...new Set(RECIPES.map(r=>r.category))];$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===category?'on':''}" data-cat="${c}">${c==='Favorites'?'★ Favorites ('+favTotal+')':c}</button>`).join('');$$('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderChips();renderGrid()})}
function card(r){let fav=!!state.favorites[r.id];return `<article class="card"><img loading="lazy" src="${r.image}" alt="${r.title}"><div class="body"><div class="fpid">${r.fpid||""}</div><h3>${r.title}</h3><div class="meta"><span>⏱ ${r.ready_minutes||'—'} min</span><span>🥕 ${r.ingredients.length} items</span><span>${r.category}</span></div><div class="actions"><button class="btn primary" onclick="plan('${r.id}')">📅 Plan meal</button><button class="btn" onclick="favorite('${r.id}')">${fav?'★ Favorite':'☆ Favorite'}</button><button class="btn full" onclick="details('${r.id}')">View recipe & instructions</button></div></div></article>`}

function normalizeIngredient(raw){let original={...raw},name=canonicalIngredientName(raw.name),amount=Number(raw.amount)||0,unit=String(raw.unit||'unit').toLowerCase();if(name==='chicken breasts'||name==='breasts')name='chicken breasts';if(unit==='unit'){let c=PACKAGE_CONVERSIONS[name];if(c){amount*=c.amount;unit=c.unit;name=c.name}else if(/seasoning blend|spice blend|seasoning mix|bbq seasoning|fry seasoning|ranch spice/.test(name)){amount*=1;unit='tbsp';name=name.replace(/^seasoning$/,'seasoning blend')}else if(/spice|paprika|turmeric|cumin|oregano|thyme|rosemary|chili flakes|curry powder|cayenne pepper|garlic powder|peppercorns|seasoning powder/.test(name)){amount*=1;unit='tsp'}else if(/sauce|glaze|dressing|vinaigrette|paste/.test(name)){amount*=1;unit='tbsp'}else if(/rice|couscous|farro/.test(name)){amount*=.5;unit='cup';name='dry '+name}else if(/pasta|noodles/.test(name)){amount*=6;unit='oz';name='dry '+name}}

function canonicalAisle(name,aisle){let n=canonicalIngredientName(name);if(/powder|seasoning|spice|paprika|cumin|oregano|thyme|rosemary|chili flakes|cinnamon|turmeric|curry/.test(n))return 'Spices';if(/cheese|cream|butter|milk|yogurt|egg|mozzarella|parmesan|pepper jack|cheddar|feta|gouda/.test(n))return 'Dairy & Eggs';if(/chicken|beef|pork|turkey|steak|sausage|bacon|shrimp|fish|salmon/.test(n))return 'Meat & Seafood';if(/bun|bread|tortilla|pita|ciabatta|breadcrumbs|panko|baguette|biscuit/.test(n))return 'Bakery';if(/potato|onion|scallion|garlic$|lime|lemon|tomato|pepper|carrot|broccoli|zucchini|cucumber|lettuce|cabbage|mushroom|peas$|spinach|kale|avocado|cilantro|parsley|ginger|sprouts|shallot|celery|poblano|asparagus|mango|kiwi|pineapple|green beans/.test(n))return 'Produce';if(/beans|chickpeas|corn|rice|pasta|noodle|couscous|flour|sugar|sauce|glaze|paste|oil|vinegar|jam|honey|peanut butter|cornstarch/.test(n))return 'Pantry';return aisle||'Other'}
function unitFamily(unit){let u=String(unit||'unit').toLowerCase();if(u==='lb'||u==='oz')return 'weight';if(u==='cup'||u==='tbsp'||u==='tsp')return 'volume';if(u==='clove'||u==='cloves')return 'clove';if(u==='g'||u==='gram'||u==='grams')return 'grams';if(u==='ml'||u==='milliliter'||u==='milliliters')return 'milliliters';if(u==='slice'||u==='slices')return 'slice';if(u==='can'||u==='cans')return 'can';return u}

function formatFamilyAmount(amount,family){if(family==='weight')return fmtQty(amount,'oz');if(family==='volume'){if(amount>=48&&Math.abs(amount%48)<.001)return fmtQty(amount/48,'cup');if(amount>=12&&Math.abs(amount%12)<.001)return fmtQty(amount/48,'cup');if(amount>=3&&Math.abs(amount%3)<.001)return fmtQty(amount/3,'tbsp');return fmtQty(amount,'tsp')}if(family==='clove')return fmtQty(amount,'clove');if(family==='grams')return fmtQty(amount,'g');if(family==='milliliters')return fmtQty(amount,'ml');if(family==='slice')return fmtQty(amount,'slice');if(family==='can')return fmtQty(amount,'can');return fmtQty(amount,family)}
function renderGrocery(){let m=monday(),all=[];for(let i=0;i<14;i++){let d=new Date(m);d.setDate(m.getDate()+i);let dayKey=iso(d),purchased=state.purchasedPlans[dayKey]||[];for(let id of state.plans[dayKey]||[]){if(purchased.includes(id))continue;let r=RECIPES.find(x=>x.id===id);if(r)all.push(...r.ingredients.map(normalizeIngredient))}}let combined={};for(let i of all){let name=canonicalIngredientName(i.name),key=name,fam=unitFamily(i.unit);combined[key]=combined[key]||{name:i.name,aisle:canonicalAisle(i.name,i.aisle),groups:{}};combined[key].groups[fam]=(combined[key].groups[fam]||0)+toBase(i.amount,i.unit)}let aisles={};for(let i of Object.values(combined)){i.qty=Object.entries(i.groups).map(([fam,amt])=>formatFamilyAmount(amt,fam)).join(' + ');(aisles[i.aisle]??=[]).push(i)}let order=['Produce','Meat & Seafood','Dairy & Eggs','Bakery','Pantry','Spices','Other'];$('#groceryList').innerHTML=order.filter(a=>aisles[a]?.length).map(a=>`<section class="aisle"><h3>${a}</h3>${aisles[a].sort((x,y)=>x.name.localeCompare(y.name)).map(i=>{let k=canonicalIngredientName(i.name);return `<label class="gitem"><input type="checkbox" data-gkey="${k}" ${state.checked[k]?'checked':''}><span class="name">${displayIngredientName(i.name)}</span><span class="qty">${i.qty}</span></label>`}).join('')}</section>`).join('')||'<div class="aisle"><p>Plan meals to build your grocery list.</p></div>';$$('[data-gkey]').forEach(x=>x.onchange=()=>{state.checked[x.dataset.gkey]=x.checked;save()})}
